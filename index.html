  let yr=null;
  const rows = entries.map((e,i)=>{ const y=(e.date||'').slice(0,4)||'—'; let h=''; if(y!==yr){ yr=y; h+=`<div class="yr">${esc(y==='—'?'undated':y)}</div>`; }
    const stops=(e.stops||[]).map(s=>IDX.stop[s]).filter(Boolean);
    const links = tlStream==='terse'? `${(e.docs||[]).map(d=>`<a href="#/archive/${d}" title="${esc(IDX.doc[d].title)}">Read the document${(e.docs.length>1)?' ('+esc(IDX.doc[d].date_text)+')':''}</a>`).join('')}${stops.map(s=>`<a href="#/map/${s.place}" title="${esc(s.label)}">On the map: ${esc(IDX.place[s.place].label.split(' (')[0].split(' — ')[0])}</a>`).join('')}${(e.stories||[]).map(s=>`<a href="#/story/${s}">In the story</a>`).join('')}${(e.findings||[]).map(f=>`<a href="#/method/findings/${f}" style="border-color:var(--disputed);color:var(--disputed)">Discrepancy</a>`).join('')}` : '';
    return h+`<div class="tlentry ${e.stream&&e.stream.startsWith('itinerary')?'itin':''} ${e.id===id?'active':''}" id="${e.id}"><div class="d">${esc(e.date?fmtDate(e.date):'undated')} <span class="tag" style="margin-left:.4rem">${esc(tlStream==='terse'? (e.stream.startsWith('itinerary')?'itinerary (B.AMNH 26 via PI)':'PI summary') : 'itinerary digest · PI colour-coded purple')}</span></div>
      <div class="text">${esc(e.text)}</div>${e.note?modelBlock(e.note):''}<div class="links">${links}${tlStream==='terse'?`<a href="#/timeline/${e.id}" class="muted">¶</a>`:''}</div></div>`; }).join('');
  const cur = id? entries.findIndex(e=>e.id===id): -1;
  const prev = cur>0? entries[cur-1]: null, next = cur>=0&&cur<entries.length-1? entries[cur+1]: null;
  page.innerHTML=`<div class="page">${navbar({close:false, extra: id?`${prev?`<button class="ghost" onclick="App.go('/timeline/${prev.id}')">‹ Previous entry</button>`:''}${next?`<button class="ghost" onclick="App.go('/timeline/${next.id}')">Next entry ›</button>`:''}`:''})}
    <h1>Timeline</h1><p class="subtitle">The principal investigator’s terse timeline, entry by entry and in her order, with every entry wired to the documents, stops and story pages it rests on.</p>
    <div class="pagenav"><div class="seg"><button class="${tlStream==='terse'?'active':''}" onclick="Pages._tl('terse')">PI’s terse timeline (${D.timeline.length})</button><button class="${tlStream==='itin'?'active':''}" onclick="Pages._tl('itin')">Itinerary digest from B.AMNH 26 (${D.itinerary.length})</button></div><span class="spacer"></span><span class="small muted">${tlStream==='terse'?'Entries are the PI’s words; links and notes are the model’s.':'The purple-coded entries of the PI’s comprehensive timeline: her digest of Quackenbush’s published itinerary (pp. 88–91) and two letters.'}</span></div>
    ${tlStream==='terse'?`<div class="notice small">Two entries (20 and 22 July 1908) stand at the end of the PI’s file, out of date order; they are kept where she left them and flagged. Her 15 May 1907 entry for Bumpus’s letter to Meany disagrees with the 15 June date in her transcription (flagged).</div>`:''}
    <div class="tl">${rows}</div></div>`;
  if(id){ setTimeout(()=>{ const el=document.getElementById(id); if(el) el.scrollIntoView({block:'center'}); },30); }
};
Pages._tl = function(s){ tlStream=s; Pages.timeline([]); };

Pages.published = function([id]){
  if(id && IDX.pub[id]){ const p=IDX.pub[id]; const citedDocs=(p.cited_in||[]).filter(x=>IDX.doc[x]); const idx=D.published.findIndex(x=>x.id===id); const prev=D.published[idx-1], next=D.published[idx+1];
    page.innerHTML=`<div class="page">${navbar({extra:`${prev?`<button class="ghost" onclick="App.go('/published/${prev.id}')">‹ Previous</button>`:''}${next?`<button class="ghost" onclick="App.go('/published/${next.id}')">Next ›</button>`:''}<a class="small" href="#/published">All published sources</a>`})}
      <div class="phase">published / cited source · ${esc(p.type)}</div><h1>${esc(p.short)}</h1>
      <dl class="kv"><dt>Citation as given</dt><dd class="serif">${esc(p.citation_as_given)}</dd><dt>Author</dt><dd>${esc(p.author)}</dd><dt>Year</dt><dd>${esc(p.year)}</dd><dt>Full text provided?</dt><dd><span class="chip unlocated">no</span> only as cited and quoted in the supplied files</dd>
      <dt>Cited in</dt><dd>${(p.cited_in||[]).map(x=>IDX.doc[x]?docLink(x):x==='tale'?'<a href="#/tale">Tale of Two Mammoths</a>':x==='pi_timeline'?'<a href="#/timeline">PI timeline</a>':esc(x)).join('; ')}</dd>
      ${p.stories.length?`<dt>Story pages</dt><dd>${p.stories.map(s=>storyLink(s)).join('<br>')}</dd>`:''}</dl>
      ${p.note?modelBlock(p.note):''}
      ${p.excerpts.length?`<h2>Passages quoted in the supplied files</h2>${p.excerpts.map(e=>`<div class="block verbatim"><span class="who">quoted via the citing document · locator: ${esc(e.locator)}</span>${esc(e.text)}</div>`).join('')}`:'<p class="notice">No passage of this source is quoted in the supplied files; it is known here only as a citation.</p>'}
    </div>`; return; }
  const types=[...new Set(D.published.map(p=>p.type))];
  page.innerHTML=`<div class="page">${navbar({close:false})}<h1>Published documents</h1><p class="subtitle">Every published or archival source cited in the supplied files, recorded exactly as cited. No record has been completed from outside knowledge; no full text was supplied, and none has been reconstructed.</p>
    <div class="notice small">Quackenbush’s own published account (Bulletin AMNH vol. 26, 1909) underlies the itinerary dates marked “via PI”; its title has deliberately not been supplied because it does not occur in the inputs. Historical maps for the geocoding hierarchy (tier 3) were likewise unavailable: the 1906 Post Route Map is cited but not provided.</div>
    <table class="data"><thead><tr><th>Source (as cited)</th><th>Type</th><th>Year</th><th>Cited in</th><th>Quoted?</th></tr></thead><tbody>${D.published.map(p=>`<tr><td><a href="#/published/${p.id}">${esc(p.short)}</a></td><td class="small">${esc(p.type)}</td><td class="small">${esc(p.year)}</td><td class="small">${(p.cited_in||[]).map(x=>IDX.doc[x]?docLink(x,IDX.doc[x].date_text):x==='tale'?'Tale':x==='pi_timeline'?'PI timeline':esc(x)).join('; ')}</td><td class="small">${p.excerpts.length?`${p.excerpts.length} passage${p.excerpts.length>1?'s':''}`:'—'}</td></tr>`).join('')}</tbody></table></div>`;
};

Pages.method = function(seg){
  const sub=seg[0]||'overview'; const anchor=seg[1];
  const tabs=[['overview','Approach & authorship'],['geocoding','Geocoding decisions'],['network','Network rules'],['findings','Discrepancies & absences'],['data','Data & downloads']];
  let body='';
  if(sub==='overview'){
    body=`<h2>What this site is</h2><p class="serif">An evidence-based historical reconstruction of L. S. Quackenbush’s two Alaskan journeys for the American Museum of Natural History (1907, 1908), built only from the five files supplied by the Mammoth History Lab: the principal investigator’s talk text (“A Tale of Two Mammoths”, 2019), her transcription file of the AMNH correspondence, her comprehensive and terse timelines, and her Cast of Characters. Nothing on the site—no date, coordinate, quotation, person or tie—comes from anywhere else, except gazetteer coordinates, which are cited record by record.</p>
     <h2>Whose prose, whose transcription, what the model did</h2><dl class="kv">${Object.entries(D.meta.authorship).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
     <h2>Source criticism as the foundation</h2><ul>
      <li><b>Three voices kept apart.</b> The transcription file mixes verbatim quotation with the PI’s summaries and editorial notes. Every paragraph was typed as <span class="tag verbatim">verbatim</span>, <span class="tag summary">summary</span>, <span class="tag editorial">editorial</span> or <span class="tag annotation">annotation</span> and is rendered differently throughout (${D.meta.counts.blocks} blocks in ${D.meta.counts.documents} items). Typing was done by rule (quotation marks, the PI’s conventions for stamps, letterheads, dated notes) and then checked by hand; a handful of paragraphs that change voice mid-way were split at the sentence boundary.</li>
      <li><b>Marks preserved.</b> Struck text, underlining, caret insertions, [sic], [?], [illeg], and the PI’s colour coding (red/blue annotations by Bumpus and Osborn; red pencil underlining; purple for her itinerary stream) were recovered from the Word files and carried into the data.</li>
      <li><b>Absences as findings.</b> Unnamed people, missing enclosures, a letter removed from the file in 1908 and never returned, conversations that never entered the file, an untranscribed manuscript, and the unprovided Bulletin are recorded in the <a href="#/method/findings">register</a> rather than silently filled.</li>
      <li><b>Contradictions left standing.</b> Where the PI’s own documents disagree (15 May vs 15 June 1907; 19 May vs “toward the end of May” 1908; Lane’s Landing vs Shelton; 86 vs “about 80” miles) both readings are shown and the record is chipped <span class="chip disputed">disputed</span>.</li>
      <li><b>Nominalist prosopography.</b> Names are recorded as written (Meany/Meaney, Startsman/Startson/Statesman, “C.W. Graham [sic]”) and identities are asserted only where a source asserts them; two attestations of a “Lucas” are kept as two records with a stated possibility of identity.</li></ul>
     <h2>Design precedents consulted</h2><p class="small">The treatment of uncertainty follows published practice in historical GIS and digital humanities: semi-opaque circles around a centroid for approximate positions (as used by the Visualizing Emancipation project, University of Richmond), background rather than foreground treatment of uncertainty (Weixuan Li, <i>Journal for the History of Knowledge</i>, 2024), recording approximation in the dataset with a separate uncertainty column (St Olaf DH recipes), and the view of the interface itself as a scholarly argument (<i>DHQ</i> 18.1, 2024; <i>Digital Scholarly Editions as Interfaces</i>, SIDE 12). Typography follows long-form reading guidance: a serif for the historical text and the PI’s narrative, a sans for interface and summary, 16–17 px body, 1.55 line height, 60–75 characters per line.</p>
     <h2>Not received</h2><p class="small">The lab’s earlier map models and the previously designed primary-source interface were not among the supplied files and the repository was empty; the Archive tab was therefore designed afresh on the same typed-block logic and can be exchanged for the lab’s own interface, since it reads from <code>data/documents.json</code>.</p>`;
  } else if(sub==='geocoding'){
    body=`<h2>Hierarchy applied</h2><ol>${Object.entries(D.meta.geocoding_tiers).map(([k,v])=>`<li><b>Tier ${k}</b> — ${esc(v)}</li>`).join('')}</ol>
      <p class="small">GNIS = USGS Geographic Names Information System, Alaska domestic-names file (retrieved 18 Nov 2026); CGNDB = Canadian Geographical Names Database; GeoNames for places outside the US and Canada; Wikidata only as a cross-check and never as sole authority. Every connector is schematic (great-circle or straight) because no route was traced from a historical map. Upriver points on the Buckland are projections of Quackenbush’s river-mile estimates along a schematic axis and carry wide halos.</p>
      <h2>Every place, with its decision</h2><table class="data"><thead><tr><th>Place (attested)</th><th>Status</th><th>Tier</th><th>Precision</th><th>Lat, lon</th><th>Halo km</th><th>Authority / id</th><th>Why this point is here</th></tr></thead><tbody>${D.places.map(p=>`<tr><td><a href="#/place/${p.id}">${esc(p.label)}</a><div class="small muted">${p.attested.map(a=>'“'+esc(a.form)+'”').join('; ')}</div></td><td>${chip(p.status)}</td><td>${p.tier||'—'}</td><td class="small">${esc(p.precision)}</td><td class="small">${p.has_coords?`${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`:'—'}</td><td class="small">${p.radius_km||'—'}</td><td class="small">${p.coord_source?`${esc(p.coord_source.authority)}${p.coord_source.id?` · ${p.coord_source.url?`<a href="${esc(p.coord_source.url)}" target="_blank" rel="noopener">${esc(p.coord_source.id)}</a>`:esc(p.coord_source.id)}`:''}`:'—'}</td><td class="small">${esc(p.why)}</td></tr>`).join('')}</tbody></table>
      <h2>Stops and their dates</h2><table class="data"><thead><tr><th>Stop</th><th>Place</th><th>Date as attested</th><th>Precision</th><th>Status</th><th>Why</th></tr></thead><tbody>${D.stops.map(s=>`<tr><td><span class="tag ${App.journeyClass(s.journey)}">${s.journey}</span> ${esc(s.label)}</td><td><a href="#/place/${s.place}">${esc(IDX.place[s.place].label.split(' (')[0])}</a></td><td class="small">${esc(s.date_text)}</td><td><span class="chip plain ${esc(s.date_precision)}">${esc(s.date_precision)}</span></td><td>${chip(s.status)}</td><td class="small">${esc(s.why)}</td></tr>`).join('')}</tbody></table>
      <h2>Connectors</h2><table class="data"><thead><tr><th>Segment</th><th>Mode</th><th>Mode status</th><th>Geometry</th><th>Source</th></tr></thead><tbody>${D.segments.map(g=>`<tr><td><span class="tag ${App.journeyClass(g.journey)}">${g.journey}</span> ${esc(IDX.stop[g.frm].label)} → ${esc(IDX.stop[g.to].label)}</td><td>${esc(g.mode)}</td><td class="small">${esc(g.mode_status.replace('_',' '))}</td><td class="small">${esc(g.geometry)}</td><td class="small">${esc(g.source.ref)}: ${esc(g.source.locator||'')}${g.note?`<div class="muted">${esc(g.note)}</div>`:''}</td></tr>`).join('')}</tbody></table>`;
  } else if(sub==='network'){
    body=`<h2>Rules</h2><dl class="kv">${Object.entries(D.network.rules).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
     <h2>Prosopographical method</h2><ul><li>Persons are identified by the documents, not by the model: a record exists for each name attested, with every spelling and the source of each role or office.</li><li>Unnamed actors (the “old Indian”, the Eskimos, the prospectors, the signers of office copies) have records of kind <i>unnamed</i> or <i>collective</i> so that their absence is visible in the network.</li><li>Institutions are nodes; person–institution ties come only from attested roles.</li><li>Metrics (degree by edge kind) describe the transcription file, not the historical world: a person who wrote many letters that were not kept has a low degree.</li></ul>
     <h2>All ties with evidence</h2><table class="data"><thead><tr><th>Source</th><th></th><th>Target</th><th>Kind</th><th>Relation</th><th>Evidence</th></tr></thead><tbody>${D.network.edges.filter(e=>e.kind!=='affiliation').map(e=>`<tr><td><a href="#/person/${e.source}">${esc(App.personLabel(e.source))}</a></td><td>${e.directed?'→':'↔'}</td><td><a href="#/person/${e.target}">${esc(App.personLabel(e.target))}</a></td><td><span class="tag ${e.kind==='pi'?'model':''}">${e.kind}</span></td><td class="small">${esc(e.label)}</td><td class="small">${e.evidence.map(v=>IDX.doc[v.ref]?docLink(v.ref, IDX.doc[v.ref].date_text):esc(v.ref)).join('; ')}${e.kind!=='correspondence'?`<div class="serif">${e.evidence.map(v=>'“'+esc(v.quote)+'”').join(' / ')}</div>`:''}</td></tr>`).join('')}</tbody></table>`;
  } else if(sub==='findings'){
    const kinds=[['discrepancy','Discrepancies — where the provided sources disagree'],['absence','Absences — what the file does not contain'],['naming','Naming — variants and modern equivalents'],['unlocated','Unlocated — what cannot be placed'],['authorship','Authorship — whose words']];
    body=kinds.map(([k,lab])=>`<h2>${esc(lab)}</h2>${D.findings.filter(f=>f.kind===k).map(f=>`<div id="${f.id}">${findingCard(f.id)}${(f.stories||[]).length?`<div class="small muted" style="margin:-.3rem 0 .6rem .9rem">Story pages: ${f.stories.map(s=>storyLink(s)).join('; ')}</div>`:''}</div>`).join('')}`).join('');
  } else {
    const files=['documents','people','offices','institutions','places','stops','segments','context_arcs','stories','timeline','itinerary','tale','tale_footnotes','cast','network','published','findings','meta'];
    const csvs=['documents','document_blocks','places','stops','segments','people','institutions','network_edges','network_nodes','timeline','itinerary','stories','published','findings'];
    body=`<h2>Exports</h2><p>The data lives outside the interface. Each table is exported as JSON and CSV; <code>data/bundle.js</code> carries the same content for this page; <code>data/DATA_DICTIONARY.md</code> defines every field. Built ${esc(D.meta.built)} from these inputs:</p>
     <table class="data"><thead><tr><th>Input file</th><th>SHA-256</th><th>bytes</th></tr></thead><tbody>${D.meta.inputs.map(i=>`<tr><td>${esc(i.file)}</td><td class="small" style="font-family:monospace">${esc(i.sha256)}</td><td class="small">${i.bytes}</td></tr>`).join('')}</tbody></table>
     <h3>JSON</h3><div class="dl">${files.map(f=>`<a href="data/${f}.json" download>${f}.json</a>`).join('')}</div>
     <h3>CSV</h3><div class="dl">${csvs.map(f=>`<a href="data/csv/${f}.csv" download>${f}.csv</a>`).join('')}</div>
     <h3>Data dictionary and pipeline</h3><p><a href="data/DATA_DICTIONARY.md" download>DATA_DICTIONARY.md</a> · <code>scripts/extract_docx.py</code> (Word → paragraphs with formatting) · <code>scripts/build_data.py</code> (typing, normalisation, cross-reference and quotation checks) · <code>scripts/authored/*.py</code> (hand-authored normalisation: document metadata, prosopography, gazetteer, stops, stories, ties, published sources, findings).</p>
     <h2>Counts</h2><dl class="kv">${Object.entries(D.meta.counts).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>
     <h2>Vocabularies</h2><h4>Block types</h4><dl class="kv">${Object.entries(D.meta.block_types).map(([k,v])=>`<dt><span class="tag ${k}">${k}</span></dt><dd>${esc(v)}</dd>`).join('')}</dl><h4>Status chips</h4><dl class="kv">${Object.entries(D.meta.status_chips).map(([k,v])=>`<dt>${chip(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  }
  page.innerHTML=`<div class="page wide">${navbar({close:false})}<h1>Method &amp; Data</h1>
    <div class="pagenav"><div class="seg">${tabs.map(([k,l])=>`<button class="${k===sub?'active':''}" onclick="App.go('/method/${k}')">${esc(l)}</button>`).join('')}</div></div>${body}</div>`;
  if(anchor){ setTimeout(()=>{ const el=document.getElementById(anchor); if(el){ el.scrollIntoView({block:'center'}); el.style.outline='2px solid var(--inferred)'; } },40); }
};
})();
</script>
</body>
