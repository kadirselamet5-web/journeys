*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--j1907);text-decoration:none}a:hover{text-decoration:underline}

.serif{font-family:var(--serif)}

.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;line-height:1;padding:.22rem .5rem;border-radius:999px;border:1px solid var(--rule-2);color:var(--ink-2);background:var(--surface);white-space:nowrap;vertical-align:middle;font-family:var(--sans);text-transform:lowercase}

<body>
<header id="topbar">
  <div class="brand">The Quackenbush Journeys <span>1907–1908 · an evidence-based reconstruction</span></div>
  <nav class="tabs" id="tabs">
    <a href="#/map" data-tab="map">Map</a>
    <a href="#/stories" data-tab="story">Story</a>
    <a href="#/network" data-tab="network">Network</a>
    <a href="#/archive" data-tab="archive">Archive</a>
    <a href="#/timeline" data-tab="timeline">Timeline</a>
    <a href="#/published" data-tab="published">Published</a>
    <a href="#/method" data-tab="method">Method &amp; Data</a>
  </nav>
</header>
<main id="app">
  <section id="mapview" class="view">
    <button id="panelToggle" title="Show or hide the layer panel" aria-label="Toggle panel">☰</button>
    <aside id="panel"><div class="inner" id="panelInner"></div></aside>
    <div id="mapstage">
      <div id="leaflet"></div>
      <div id="globe" class="hidden"></div>
      <div id="maplegend"></div>
      <div id="mapnote">All connectors are schematic: no route was traced. Marker style = source status; halos = uncertainty radius.</div>
    </div>
  </section>
  <section id="pageview" class="view hidden"></section>
</main>
<script src="data/bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ============================================================================
   Core: data access, routing with an explicit history stack, shared components
   ============================================================================ */
(function(){
'use strict';
const D = window.JOURNEYS_DATA;
if(!D){ document.getElementById('pageview').innerHTML='<div class="page"><h1>Data not loaded</h1><p>data/bundle.js is missing. Run <code>python3 scripts/build_data.py</code>.</p></div>'; return; }
const byId = (arr)=>Object.fromEntries(arr.map(x=>[x.id,x]));
const IDX = {
  doc: byId(D.documents), person: byId([...D.people, ...D.offices, ...D.institutions]), place: byId(D.places), stop: byId(D.stops),
  story: byId(D.stories), pub: byId(D.published), finding: byId(D.findings), tl: byId(D.timeline), tale: byId(D.tale), seg: byId(D.segments)
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){ if(!iso) return 'undated'; const p=iso.split('-'); if(p.length===1) return p[0]; if(p.length===2) return MONTHS[+p[1]-1]+' '+p[0]; return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0]; }
function personLabel(id){ const p=IDX.person[id]; return p? p.label : id; }
function journeyClass(j){ return j==='1907'?'j1907': j==='1908'?'j1908':''; }
const JCOLOR = {'1907':'#1f6fa3','1908':'#c0603a'};
const STATUS_TXT = D.meta.status_chips;

/* ---------------- routing ---------------- */
/* The stack is the app's own notion of "where the user came from". hashchange fires asynchronously, so
   go()/goBack() update the stack first and the handler ignores a hash that already sits on top. */
const stack = [];
function currentHash(){ return location.hash.replace(/^#/, '') || '/map'; }
function go(route){ if(currentHash()===route){ render(route); return; } stack.push(route); location.hash=route; render(route); }
function goBack(){ if(stack.length>1){ stack.pop(); const prev=stack[stack.length-1]; location.hash=prev; render(prev); } else { go('/map'); } }
function prevTitle(){ if(stack.length<2) return 'Map'; return routeTitle(stack[stack.length-2]); }
function routeTitle(r){
  const seg=r.split('/').filter(Boolean);
  const t=seg[0]||'map';
  if(t==='map') return 'Map'; if(t==='stories') return 'Story index'; if(t==='story') return (IDX.story[seg[1]]||{}).title||'Story';
  if(t==='archive') return seg[1]? ((IDX.doc[seg[1]]||{}).title||'Document') : 'Archive';

<script>

function gcPath(a,b){ const toR=Math.PI/180, toD=180/Math.PI; const [lat1,lon1]=[a[0]*toR,a[1]*toR],[lat2,lon2]=[b[0]*toR,b[1]*toR]; const d=2*Math.asin(Math.sqrt(Math.sin((lat2-lat1)/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon2-lon1)/2)**2)); if(d<1e-6) return [a,b]; const n=Math.max(2,Math.ceil(d*toD/1.5)); const pts=[]; for(let i=0;i<=n;i++){ const f=i/n; const A=Math.sin((1-f)*d)/Math.sin(d), B=Math.sin(f*d)/Math.sin(d); const x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2), y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2), z=A*Math.sin(lat1)+B*Math.sin(lat2); pts.push([Math.atan2(z,Math.sqrt(x*x+y*y))*toD, Math.atan2(y,x)*toD]); } return pts; }

function setFrame(id){ const f=FRAMES.find(x=>x.id===id); if(!f||!map) return; state.frame=id; closePopup(); if(state.mode==='globe'){ const c=L.latLngBounds(f.bounds).getCenter(); globe.focus({lat:c.lat, lon:c.lng}); } else map.fitBounds(f.bounds, {padding:[40,40], animate:!REDUCE}); document.querySelectorAll('#frames .pill').forEach(b=>b.classList.toggle('active', b.dataset.frame===id)); }

/* ---------------------------------------------------------------- tiles */
function isDark(){ const t=document.documentElement.dataset.theme; return t==='dark' || (t!=='light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
function buildFlat(){
  const dark=isDark();
  if(tileFlat){ if(map.hasLayer(tileFlat)) map.removeLayer(tileFlat); if(map.hasLayer(tileFlatRef)) map.removeLayer(tileFlatRef); }
  tileFlat = L.tileLayer(ESRI+`Canvas/${dark?'World_Dark_Gray_Base':'World_Light_Gray_Base'}/MapServer/tile/{z}/{y}/{x}`, {attribution:`Basemap: Esri ${dark?'Dark':'Light'} Gray Canvas (Esri, HERE, Garmin, © OpenStreetMap contributors)`, maxZoom:16});
  tileFlatRef = L.tileLayer(ESRI+`Canvas/${dark?'World_Dark_Gray_Reference':'World_Light_Gray_Reference'}/MapServer/tile/{z}/{y}/{x}`, {maxZoom:16, pane:'shadowPane', opacity:.5});
}
/* the reference (place-name) tiles are shown in flat mode only from zoom 6, dimmed, so that they do not compete with the attested labels */
function syncReference(){ if(!map) return; const want = state.mode==='flat' && map.getZoom()>=6; if(want && !map.hasLayer(tileFlatRef)) tileFlatRef.addTo(map); if(!want && map.hasLayer(tileFlatRef)) map.removeLayer(tileFlatRef); }
function schemeChanged(){ if(!map) return; buildFlat(); if(state.mode==='flat'){ tileFlat.addTo(map); syncReference(); } renderLegend(); }

function initMap(openOnAlaska){
  map = L.map('leaflet', {zoomControl:false, attributionControl:true, worldCopyJump:true}).setView([62, -140], 3);
  L.control.zoom({position:'topright'}).addTo(map);
  L.control.scale({imperial:true, metric:true, position:'bottomleft'}).addTo(map);
  buildFlat();
  tileRelief = L.tileLayer(ESRI+'World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {attribution:'Relief: Esri, USGS, NOAA', maxZoom:13});
  tileLabels = L.tileLayer(ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom:13, pane:'shadowPane', opacity:.8});
  tileFlat.addTo(map);
  groups = { halos:L.layerGroup().addTo(map), constraints:L.layerGroup().addTo(map), candidates:L.layerGroup().addTo(map), routes:L.layerGroup().addTo(map), arrows:L.layerGroup().addTo(map), markers:L.layerGroup().addTo(map), badges:L.layerGroup().addTo(map), labels:L.layerGroup().addTo(map), context:L.layerGroup() };
  drawAll();
  if(openOnAlaska) setFrame('alaska');
  map.on('zoomend', ()=>{ drawRoutes(); drawUnlocated(); syncReference(); updateLabelVisibility(); });
  // a popup requested before a move opens once the move has ended; any newer move, close or clear cancels it (no stale openers)
  map.on('moveend', ()=>{ const f=pendingPopup; pendingPopup=null; if(f) f(); updateLabelVisibility(); });
  map.on('popupclose', ()=>{ popup=null; });
  if(window.matchMedia){ try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', schemeChanged); }catch(e){} }
  new MutationObserver(schemeChanged).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
}

/* ---------------------------------------------------------------- popups (compact; the evidence lives in the panel card) */
function closePopup(){ pendingPopup=null; if(popup && map){ map.closePopup(popup); popup=null; } }
function popupFor(place, journey, stopId){
  const visits = journey? D.stops.filter(s=>s.place===place.id && s.journey===journey) : [];
  const other = journey? (journey==='1907'?'1908':'1907') : null; const otherN = other? D.stops.filter(s=>s.place===place.id && s.journey===other).length : 0;
  const story = (visits.find(v=>v.id===stopId)||visits[0]||{}).story || (place.stories||[])[0];
  return `<h4>${esc(place.short_label)}</h4>
    <div class="small">${glyph(place.status)} ${esc(place.status)}${place.naming?` · ${glyph('naming')} naming`:''}${journey?` · <span class="tag ${jc(journey)}">${esc(journey)}</span>`:''}${place.radius_km&&place.status!=='verified'?` · halo ${place.radius_km} km`:''}</div>
    ${visits.length?`<ul class="visits">${visits.map(v=>`<li class="${v.id===stopId?'cur':''}"><b class="seq ${jc(journey)}">${v.seq}</b> ${esc(fmtDate(v.date_start))} · ${esc(v.label)}</li>`).join('')}</ul>`:''}
    ${otherN?`<div class="small muted">also visited in ${other} (${otherN} stop${otherN>1?'s':''}) — <a href="#/map/${place.id}" onclick="event.preventDefault();MapView.popupJourney('${place.id}','${other}')">show</a></div>`:''}
    <div class="small">${story?`<a href="#/story/${story}">Open story</a> · `:''}<a href="#/place/${place.id}">Place record</a>${stopId?` · <a href="#/map/stop/${stopId}" onclick="event.preventDefault();MapView.focusCard()">More in panel</a>`:''}</div>`;
}
function openPopupFor(place, journey, stopId){
  closePopup();
  if(!map || window.innerWidth<=600 || state.mode==='globe') return;   // at phone widths the card in the panel carries the evidence; no popup
  popup = L.popup({maxWidth:300, autoPanPaddingTopLeft:[0,60], className:'stoppopup'}).setLatLng([place.lat,place.lon]).setContent(popupFor(place, journey, stopId)).openOn(map);
}
function popupJourney(placeId, journey){ const p=IDX.place[placeId]; const s=D.stops.find(x=>x.place===placeId && x.journey===journey); if(s) stepTo(s.id, {move:false, popup:false}); openPopupFor(p, journey, s? s.id : null); }
function focusCard(){ const c=document.getElementById('stopcard'); if(!c) return; if(panel.classList.contains('collapsed')) toggle.click(); c.scrollIntoView({block:'nearest'}); const h=c.querySelector('h4'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }

/* ---------------------------------------------------------------- drawing */
function drawAll(){
  Object.values(groups).forEach(g=>g.clearLayers()); labelList=[]; badgeList=[];
  const drawn=new Map();          // placeId -> {place, byJ:{1907:[stops],1908:[stops]}}
  ['1907','1908'].forEach(j=>{ if(!state.layers['j'+j]) return;
    placesOf(j).forEach(({place, stops})=>{ if(!drawn.has(place.id)) drawn.set(place.id,{place, byJ:{}}); drawn.get(place.id).byJ[j]=stops;
      if(state.layers.halos && place.radius_km && place.status!=='verified') groups.halos.addLayer(L.circle([place.lat,place.lon], {className:'halo '+jc(j), radius:place.radius_km*1000, color:JVAR[j], weight:1, opacity:.5, fillColor:JVAR[j], fillOpacity:.08, dashArray:'4 4', interactive:false}));
    });
  });
  drawn.forEach(({place, byJ})=>{
    const js=Object.keys(byJ).sort(); const key = js.length===2? 'both' : js[0];
    const st=styleFor(place,key);
    let m;
    if(place.status==='disputed') m=L.marker([place.lat,place.lon],{icon:L.divIcon({className:'', html:`<div class="marker-disputed ${key==='both'?'both':jc(key)}" data-place="${esc(place.id)}" title="${esc(place.label)}"></div>`, iconSize:[14,14], iconAnchor:[7,7]}), keyboard:false});
    else m=L.circleMarker([place.lat,place.lon], st);
    m.on('add', ()=>{ const el=m.getElement(); if(el){ el.setAttribute('data-place', place.id); el.setAttribute('aria-label', place.label); } });
    m.on('click', ()=>{ const j = js.includes(state.journey)? state.journey : js[0]; const s=byJ[j][0]; stepTo(s.id, {move:false, popup:false}); openPopupFor(place, j, s.id); });
    m.bindTooltip(esc(place.label), {direction:'top', offset:[0,-8], className:'lbl tip'});
    groups.markers.addLayer(m);
    js.forEach((j,slot)=>{ const b=badge(place, j, byJ[j], slot, js.length); b._placeId=place.id; groups.badges.addLayer(b); badgeList.push(b); });
    if(state.layers.labels){ const lab=L.marker([place.lat,place.lon],{icon:L.divIcon({className:'lbl '+(key==='both'?'both':jc(key)), html:esc(place.short_label), iconSize:null, iconAnchor:[-9,8]}), interactive:false, keyboard:false});
      lab._minZoom=labelTier(place); lab._prio=[js.reduce((n,j)=>n+byJ[j].length,0), place.status==='verified'?1:0]; lab._placeId=place.id; groups.labels.addLayer(lab); labelList.push(lab); }
  });
  if(state.layers.trail){
    TRAIL_PLACES.forEach(id=>{ const p=IDX.place[id]; if(!p||drawn.has(id)) return;
      const m=L.circleMarker([p.lat,p.lon], styleFor(p,null)); m.on('add', ()=>{ const el=m.getElement(); if(el){ el.setAttribute('data-place', id); el.setAttribute('aria-label', p.label); } });
      m.on('click', ()=>openPopupFor(p, null, null)); m.bindTooltip(esc(p.label), {direction:'top', offset:[0,-8], className:'lbl tip'}); groups.markers.addLayer(m); drawn.set(id,{place:p, byJ:{}});
      if(state.layers.labels){ const lab=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'lbl trail', html:esc(p.short_label), iconSize:null, iconAnchor:[-8,8]}), interactive:false, keyboard:false}); lab._minZoom=labelTier(p); lab._prio=[0, 1]; lab._placeId=id; groups.labels.addLayer(lab); labelList.push(lab); }
    });
  }
  if(state.layers.context){
    D.context_arcs.forEach(a=>{ const p=IDX.place[a.frm], q=IDX.place[a.to]; groups.context.addLayer(L.polyline(gcPath([p.lat,p.lon],[q.lat,q.lon]), {className:'route ctx', color:'var(--model)', weight:1.5, dashArray:'6 6', opacity:.8}).bindTooltip(esc(a.label)+' — context (Tale §1); schematic', {sticky:true,className:'lbl tip'})); });
    CTX_PLACES.forEach(id=>{ const p=IDX.place[id]; const m=L.circleMarker([p.lat,p.lon], {...styleFor(p,'ctx'), radius:6}); m.on('click', ()=>openPopupFor(p, null, null)); groups.context.addLayer(m); if(p.radius_km>20) groups.context.addLayer(L.circle([p.lat,p.lon],{className:'halo ctx', radius:p.radius_km*1000, color:'var(--model)', weight:1, fillColor:'var(--model)', fillOpacity:.06, dashArray:'4 4', interactive:false}));
      const lab=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'lbl ctx', html:esc(p.short_label), iconSize:null, iconAnchor:[-8,8]}), interactive:false, keyboard:false}); lab._minZoom=0; lab._prio=[0,0]; lab._placeId=id; groups.context.addLayer(lab); labelList.push(lab); });
    if(!map.hasLayer(groups.context)) groups.context.addTo(map);
  } else if(map.hasLayer(groups.context)) map.removeLayer(groups.context);
  drawRoutes(); drawUnlocated(); updateLabelVisibility();
}
/* perpendicular screen-space offset of a sampled path (k-th of n coincident legs), recomputed on zoomend */
function offsetPath(pts, off){
  if(!off) return pts;
  const P=pts.map(ll=>map.latLngToLayerPoint(L.latLng(ll[0],ll[1]))); const out=[];
  for(let i=0;i<P.length;i++){ const p0=P[Math.max(0,i-1)], p1=P[Math.min(P.length-1,i+1)]; const dx=p1.x-p0.x, dy=p1.y-p0.y, len=Math.hypot(dx,dy)||1; out.push(map.layerPointToLatLng(L.point(P[i].x - dy/len*off, P[i].y + dx/len*off))); }
  return out;
}
function drawRoutes(){
  groups.routes.clearLayers(); groups.arrows.clearLayers(); legLines=[]; arrowMarkers=[]; state.legs=[];
  if(!state.layers.routes) return;
  const legs=[];
  ['1907','1908'].forEach(j=>{ if(!state.layers['j'+j]) return; D.segments.filter(g=>g.journey===j).forEach(g=>legsOf(g).forEach(l=>legs.push(l))); });
  // coincident legs (same unordered endpoint pair) are spread 4 px apart: 1907 outward, 1907 return, 1908 outward, 1908 return
  const bykey=new Map(); legs.forEach(l=>{ const k=[l.a.id,l.b.id].sort().join('|'); if(!bykey.has(k)) bykey.set(k,[]); bykey.get(k).push(l); });
  bykey.forEach(arr=>{ arr.sort((x,y)=> x.journey.localeCompare(y.journey) || (IDX.stop[x.seg.frm].seq - IDX.stop[y.seg.frm].seq) || (x.idx-y.idx)); arr.forEach((l,k)=>{ l.k=k; l.n=arr.length; }); });
  legs.forEach(l=>{
    const g=l.seg; const pts=gcPath([l.a.lat,l.a.lon],[l.b.lat,l.b.lon]); const latlngs=offsetPath(pts, (l.k-(l.n-1)/2)*4);
    const lineL=L.polyline(latlngs, {className:'route '+jc(l.journey)+(l.inferred?' inferred':''), color:JVAR[l.journey], weight: l.posUnsure?1.6:2.4, opacity:.85, dashArray:l.dash, lineCap:'round'});
    const legTxt = l.n>1 || (g.via||[]).length ? `<br><span class="small">leg ${l.idx+1} of ${l.n}: ${esc(l.a.short_label)} → ${esc(l.b.short_label)}${(g.via||[]).length?` · ${esc(viaText(g))}`:''}</span>` : '';
    lineL.bindTooltip(`<b>${esc(IDX.stop[g.frm].label)} → ${esc(IDX.stop[g.to].label)}</b> <span class="tag ${jc(l.journey)}">${l.journey}</span>${legTxt}<br>mode: ${esc(g.mode)} <i>(${esc(g.mode_status.replace('_',' '))}${l.inferred&&g.mode_status!=='inferred'?'; this leg inferred':''})</i><br>geometry: ${esc(g.geometry)} — not traced<br><span class="small">source: ${esc(g.source.ref)} ${esc(g.source.locator||'')}</span>`, {sticky:true, className:'lbl tip', opacity:1});
    lineL.on('add', ()=>{ const el=lineL.getElement(); if(el){ el.setAttribute('data-seg', g.id); el.setAttribute('data-leg', `${l.a.id}>${l.b.id}`); } });
    groups.routes.addLayer(lineL); const ar=arrowFor(l, latlngs); groups.arrows.addLayer(ar);
    l.line=lineL; l.arrow=ar; legLines.push(l); arrowMarkers.push(ar);
    state.legs.push({seg:g.id, journey:l.journey, a:l.a.id, b:l.b.id, via_status: l.vias.length? l.vias.map(v=>v.status).join('+') : null, inferred:l.inferred, k:l.k, n:l.n});
  });
  emphasise(state.highlight);
}
/* the incoming leg(s) of the selected stop are weight 4 / opacity 1; every other connector recedes to .25 */
function emphasise(stopId){
  legLines.forEach(l=>{ const incoming = stopId && l.seg.to===stopId; l.line.setStyle({weight: incoming? 4 : (l.posUnsure?1.6:2.4), opacity: stopId? (incoming? 1 : .25) : .85}); const el=l.arrow.getElement(); if(el) el.classList.toggle('dim', !!stopId && !incoming); });
}
/* unlocated places: each stated constraint is drawn around its located anchor; gazetteer homonyms as equal hollow squares; never a point */
function drawUnlocated(){
  groups.constraints.clearLayers(); groups.candidates.clearLayers(); state.constraintCount=0; state.candidateCount=0;
  labelList = labelList.filter(l=>!l._unloc);
  if(!state.layers.unlocated) return;
  const px=(ll, dx, dy)=>map.layerPointToLatLng(map.latLngToLayerPoint(ll).add(L.point(dx,dy)));
  D.places.filter(p=>!p.has_coords && state.showUnlocated.has(p.id) && !state.unlocatedOff.has(p.id)).forEach(p=>{
    const finding = D.findings.find(f=>(f.places||[]).includes(p.id));
    const pop = (c)=>`<h4>${esc(p.label)}</h4><div class="small">${glyph('unlocated')} ${esc(p.status)} · <span class="tag">${esc(p.unlocated_kind)}</span> · constraint: ${esc(c.kind)}</div>
      <div class="block verbatim" style="margin:.4rem 0"><span class="who">${esc(c.speaker)} — verbatim</span>“${esc(c.quote)}”</div>${App.modelBlock(c.model_note)}
      <div class="small"><a href="#/place/${p.id}">Place record</a>${finding?` · <a href="#/method/findings/${finding.id}">Finding</a>`:''}</div>`;
    const addLabel=(ll, text, c, minZoom=0, leftFirst=false)=>{ const lab=L.marker(ll,{icon:L.divIcon({className:'lbl ulbl', html:esc(text), iconSize:null, iconAnchor:[-6,8]}), keyboard:false}); lab._minZoom=minZoom; lab._prio=[-1,0]; lab._unloc=true; lab._leftFirst=leftFirst; lab._placeId=p.id; if(c) lab.bindPopup(pop(c),{maxWidth:360}); groups.constraints.addLayer(lab); labelList.push(lab); return lab; };
    (p.constraints||[]).forEach(c=>{ const a=IDX.place[c.anchor]; if(!a||!a.has_coords) return; const all=L.latLng(a.lat,a.lon);
      if(c.kind==='distance'){ const ring=L.circle(all, {className:'constraint dist', radius:c.miles*MI, color:'var(--unlocated)', weight:1.5, dashArray:'2 6', fill:false}); ring.bindPopup(pop(c),{maxWidth:360}); ring.bindTooltip(`stated distance, not a position: “${esc(c.quote)}”`, {sticky:true, className:'lbl tip'}); groups.constraints.addLayer(ring); ring._placeId=p.id;
        const north=L.latLng(a.lat + (c.miles*MI)/111195, a.lon); const centre = a.radius_km>=20? ` (centre ±${a.radius_km} km)`:''; addLabel(north, `≈${c.miles} mi from ${a.short_label}${centre} — ${c.speaker} — no point asserted`, c, 3); state.constraintCount++; }
      else if(c.kind==='near'){ const end=px(all, 28, -28); const lead=L.polyline([all,end], {className:'constraint leader', color:'var(--unlocated)', weight:1.2, dashArray:'2 4', interactive:false}); groups.constraints.addLayer(lead); addLabel(end, `near ${a.short_label} — ${c.speaker} — no radius given`, c, 5); }
      else if(c.kind==='identity'){ const br=L.polyline([px(all,-13,-11),px(all,-19,-11),px(all,-19,11),px(all,-13,11)], {className:'constraint bracket', color:'var(--unlocated)', weight:1.2, dashArray:'2 3', interactive:false}); groups.constraints.addLayer(br); addLabel(px(all,-20,14), `= ‘${c.quote.replace(/^Mr\. Grants camp on /,'')}’? — ${c.speaker}`, c, 6, true); }
    });
    if((p.candidates||[]).length){
      const shared=`<h4>${esc(p.label)}</h4><div class="small">${glyph('candidate')} ${p.candidates.length} gazetteer record${p.candidates.length>1?'s':''} bearing the name — candidates, none asserted</div>
        <ul class="small">${p.candidates.map(c=>`<li>GNIS <a href="${esc(c.url)}" rel="noopener">${esc(c.id)}</a> · ${esc(c.name)} (${esc(c.feature_class)}) · ${esc(c.county||'')} · ${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}${c.note?` <span class="muted">— ${esc(c.note)}</span>`:''}</li>`).join('')}</ul>
        ${App.modelBlock(p.candidates_note)}<div class="small"><a href="#/place/${p.id}">Place record</a>${finding?` · <a href="#/method/findings/${finding.id}">Finding</a>`:''}</div>`;
      p.candidates.forEach(c=>{ const m=L.marker([c.lat,c.lon],{icon:L.divIcon({className:'', html:`<div class="cand" data-place="${esc(p.id)}" data-gnis="${esc(c.id)}"></div>`, iconSize:[8,8], iconAnchor:[4,4]}), keyboard:false}); m.bindPopup(shared,{maxWidth:380}); m._placeId=p.id; groups.candidates.addLayer(m); state.candidateCount++;
        const lab=L.marker([c.lat,c.lon],{icon:L.divIcon({className:'lbl ulbl candlbl', html:esc(`${p.short_label} — GNIS ${c.id}, ${c.county||c.feature_class}`), iconSize:null, iconAnchor:[-7,8]}), keyboard:false}); lab._minZoom=4; lab._prio=[-1,0]; lab._unloc=true; lab._placeId=p.id; lab.bindPopup(shared,{maxWidth:380}); groups.candidates.addLayer(lab); labelList.push(lab); });
    }
  });
}
/* bounds of everything drawn for one unlocated place (rings, leaders, candidates) */
function unlocatedBounds(placeId){ let b=null; const add=l=>{ const bb = l.getBounds? l.getBounds() : (l.getLatLng? L.latLngBounds([l.getLatLng()]) : null); if(!bb) return; b = b? b.extend(bb) : L.latLngBounds(bb); }; groups.constraints.eachLayer(l=>{ if(l._placeId===placeId) add(l); }); groups.candidates.eachLayer(l=>{ if(l._placeId===placeId) add(l); }); return b; }
/* labels: zoom tiers, then a greedy collision pass in priority order (stop count desc, verified first); a label that collides is tried on the left of its point, then hidden */
function updateLabelVisibility(){
  if(!map) return; const z=map.getZoom();
  // the legend, the zoom control, the scale bar and the panel toggle are obstacles: no label is placed under them
  const placed=['#maplegend details','.leaflet-control-zoom','.leaflet-control-scale','#panelToggle'].map(q=>document.querySelector(q)).filter(e=>e && e.offsetParent!==null).map(e=>e.getBoundingClientRect()).filter(r=>r.width);
  const hit=(r)=>placed.some(q=>!(r.right<=q.left||r.left>=q.right||r.bottom<=q.top||r.top>=q.bottom));
  const order=[...labelList].sort((a,b)=> (b._prio[0]-a._prio[0]) || (b._prio[1]-a._prio[1]) || (a._minZoom-b._minZoom));
  // the selected stop's label, or the labels of the unlocated place whose constraints were asked for, are placed first
  const first = l=> (l._placeId===state.highlightPlace || (state.focusUnlocated && l._placeId===state.focusUnlocated))? 1 : 0;
  order.sort((a,b)=> first(b)-first(a));
  const shown=new Set();
  // a place's badges are reserved together with its label, so a neighbour's numeral never covers a placed label
  const badgesOf=new Map(); badgeList.forEach(b=>{ if(!badgesOf.has(b._placeId)) badgesOf.set(b._placeId,[]); badgesOf.get(b._placeId).push(b); });
  order.forEach(l=>{ const el=l.getElement(); if(!el) return;
    const on = (l._unloc || state.layers.labels) && (l._minZoom==null || z>=l._minZoom);
    el.classList.toggle('active', !!state.highlightPlace && l._placeId===state.highlightPlace && !l._unloc);
    if(!on){ el.style.display='none'; return; }
    const bEls = (!l._unloc && z>=5)? (badgesOf.get(l._placeId)||[]).map(b=>b.getElement()).filter(Boolean) : [];
    bEls.forEach(e=>{ e.style.display=''; }); const bRects=bEls.map(e=>(e.querySelector('.seq')||e).getBoundingClientRect());
    const right=()=>{ el.classList.remove('left'); el.style.marginLeft=''; }, left=()=>{ el.classList.add('left'); el.style.marginLeft=`${-(el.offsetWidth+9)}px`; };
    el.style.display=''; right();
    if(!el.getBoundingClientRect().width){ placed.push(el.getBoundingClientRect()); return; }
    let r=null;
    for(const side of (l._leftFirst? [left,right] : [right,left])){ side(); const rr=el.getBoundingClientRect(); if(!hit(rr) && !bRects.some(hit)){ r=rr; break; } }
    if(!r){ el.style.display='none'; right(); return; }
    placed.push(r, ...bRects); if(!l._unloc) shown.add(l._placeId);
  });
  // badges from zoom 5; below zoom 7 only where the place's label could be placed (or labels are off), so that a cluster does not pile numerals
  badgeList.forEach(b=>{ const el=b.getElement(); if(!el) return; const on = z>=5 && (z>=7 || !state.layers.labels || shown.has(b._placeId) || b._placeId===state.highlightPlace); el.style.display = on? '' : 'none'; });
}

function setMode(mode){
  state.mode=mode; document.querySelectorAll('#modeSeg button').forEach(b=>{ b.classList.toggle('active', b.dataset.mode===mode); b.setAttribute('aria-pressed', String(b.dataset.mode===mode)); });
  const g=document.getElementById('globe'), l=document.getElementById('leaflet'); const gz=document.getElementById('globeZoom'); if(gz) gz.classList.toggle('hidden', mode!=='globe');
  closePopup();
  if(mode==='globe'){ l.classList.add('hidden'); g.classList.remove('hidden'); initGlobe(); globe.resize(); globe.draw(); }
  else { g.classList.add('hidden'); l.classList.remove('hidden'); leafletEl.classList.toggle('relief', mode==='relief');
    if(mode==='relief'){ if(map.hasLayer(tileFlat)) map.removeLayer(tileFlat); if(map.hasLayer(tileFlatRef)) map.removeLayer(tileFlatRef); tileRelief.addTo(map); tileLabels.addTo(map); }
    else { if(map.hasLayer(tileRelief)) map.removeLayer(tileRelief); if(map.hasLayer(tileLabels)) map.removeLayer(tileLabels); tileFlat.addTo(map); syncReference(); }
    setTimeout(()=>map.invalidateSize(),50); }
  renderLegend();
}

/* ---------------------------------------------------------------- step-through: 'Follow the journey' */
function stepTo(stopId, opts={}){
  const s=IDX.stop[stopId]; if(!s) return; const p=IDX.place[s.place];
  state.highlight=stopId; state.highlightPlace=s.place; state.journey=s.journey; state.focusUnlocated=null;
  document.querySelectorAll('#stoplist li').forEach(li=>{ const on=li.dataset.stop===stopId; li.classList.toggle('active', on); li.setAttribute('aria-current', on?'true':'false'); if(on) li.scrollIntoView({block:'nearest'}); });
  renderFollow(); renderStopCard(s); emphasise(stopId); updateLabelVisibility();
  if(!p||!p.has_coords) return;
  if(state.mode==='globe'){ if(opts.move!==false) globe.focus(p); return; }
  const ll=L.latLng(p.lat,p.lon), z = p.radius_km>40? 6 : 8;
  const sz=map.getSize(); if(!sz.x||!sz.y) map.invalidateSize(false);
  const same = map.getZoom()===z && map.getCenter().distanceTo(ll)<50;
  if(opts.move!==false && !same){ if(REDUCE) map.setView(ll, z, {animate:false}); else map.flyTo(ll, z, {duration:.8}); }
  if(opts.popup!==false){ if(opts.move===false || same) openPopupFor(p, s.journey, s.id); else pendingPopup=()=>{ if(state.highlight===stopId) openPopupFor(p, s.journey, s.id); }; }
}
function highlightStop(stopId, fly=true){ stepTo(stopId, {move:fly, popup:fly}); }
function clearStop(){ state.highlight=null; state.highlightPlace=null; document.querySelectorAll('#stoplist li.active').forEach(li=>{ li.classList.remove('active'); li.setAttribute('aria-current','false'); }); emphasise(null); updateLabelVisibility(); closePopup(); renderFollow(); const c=document.getElementById('stopcard'); if(c) c.innerHTML=startCard(); }
function step(dir){ const list=stopsOf(state.journey); let i=list.findIndex(s=>s.id===state.highlight); if(i<0) i = dir>0? -1 : list.length; i=Math.max(0, Math.min(list.length-1, i+dir)); stepTo(list[i].id); }
function follow(journey){ state.journey=journey; const list=stopsOf(journey); const cur=IDX.stop[state.highlight]; if(cur && cur.journey===journey) { renderFollow(); return; } stepTo(list[0].id); }
function renderFollow(){
  const list=stopsOf(state.journey); const i=list.findIndex(s=>s.id===state.highlight);
  document.querySelectorAll('#followSeg button').forEach(b=>{ const on=b.dataset.j===state.journey; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
  const pos=document.getElementById('stepPos'); if(pos) pos.textContent = i>=0? `Stop ${i+1} of ${list.length}` : `${list.length} stops`;
  const prev=document.getElementById('prevStop'), next=document.getElementById('nextStop'); if(prev) prev.disabled = i<=0; if(next) next.disabled = i>=list.length-1;
}
function startCard(){ return `<div class="card stopcard start"><h4>Follow the journey</h4><p class="small">Choose 1907 or 1908 and step through the stops with <b>Next ›</b> (or the ← → keys while the panel or the map has focus). Each step selects the stop, moves the map to it, thickens the connector that leads into it, and shows its evidence here. The sequence numerals on the map match the stop list; 1907 badges are round, 1908 badges square-cornered.</p><p class="small muted">The paper-trail part of each journey (New York, Montreal, Seattle) lies outside the Alaska frame; the <b>Whole route</b> frame shows it.</p></div>`; }
function renderStopCard(s){

    ${inc.length?`<dt>Arrived by</dt><dd class="small">${inc.map(g=>`${esc(g.mode)} <i>(${esc(g.mode_status.replace('_',' '))})</i>${(g.via||[]).length?`; out-and-back ${esc(viaText(g))}`:''}`).join('<br>')}</dd>`:''}

document.addEventListener('keydown', e=>{
  if(mapviewEl.classList.contains('hidden')) return; const t=e.target; if(t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  const inGlobe = globe && document.getElementById('globe').contains(document.activeElement); if(inGlobe) return;   // the globe has its own keys

});

function unlocatedCards(){
  const items=D.places.filter(p=>!p.has_coords && !p.mentioned_only);
  return items.map(p=>{ const f=D.findings.find(x=>(x.places||[]).includes(p.id));
    const drawn=[...(p.constraints||[]).map(c=>{ const a=IDX.place[c.anchor]||{short_label:c.anchor}; return c.kind==='distance'? `a dashed ring of ${c.miles} mi around ${a.short_label}` : c.kind==='near'? `a leader label at ${a.short_label}` : `a bracket at ${a.short_label}`; }), ...((p.candidates||[]).length? [`${p.candidates.length} hollow squares, one per gazetteer homonym, none chosen`]:[])];
    return `<li data-place="${p.id}"><div class="head"><b>${esc(p.label)}</b> ${chip(p.status)} <span class="tag" title="${esc((D.meta.unlocated_kinds||{})[p.unlocated_kind]||'')}">${esc(p.unlocated_kind)}</span>${drawn.length?`<label class="small draw"><input type="checkbox" data-unloc="${p.id}" ${state.unlocatedOff.has(p.id)?'':'checked'}>draw</label>`:''}</div>
      ${(p.constraints||[]).map(c=>`<div class="block verbatim"><span class="who">${esc(c.speaker)} — verbatim</span>“${esc(c.quote)}”</div>`).join('')}
      ${(p.candidates||[]).length?`<div class="small">${p.candidates.length} GNIS record${p.candidates.length>1?'s':''} named ‘${esc(p.candidates[0].name)}’ — ${esc(p.candidates_note)}</div>`:''}
      <div class="small"><span class="tag model">model</span> What is drawn: ${drawn.length? esc(drawn.join('; '))+'.' : 'nothing.'} No point is asserted.</div>
      <div class="small"><a href="#/place/${p.id}">Place record</a>${f?` · <a href="#/method/findings/${f.id}">${esc(f.title)}</a>`:''}</div></li>`; }).join('');
}

     <span id="globeZoom" class="seg hidden" role="group" aria-label="Globe zoom"><button onclick="MapView.globeZoom(1.25)" aria-label="Zoom the globe in">+</button><button onclick="MapView.globeZoom(0.8)" aria-label="Zoom the globe out">−</button></span></div>

   <div class="section"><h3>Layers</h3>

  el.querySelectorAll('input[data-layer]').forEach(cb=>cb.addEventListener('change', ()=>{ state.layers[cb.dataset.layer]=cb.checked; drawAll(); if(globe) globe.draw(); }));

/* ------------------------------------------------------------ globe (D3 orthographic) */
function initGlobe(){
  if(globe) return;
  const el=document.getElementById('globe');
  const svg=d3.select(el).append('svg').attr('role','img').attr('tabindex',0).attr('aria-label','Orthographic globe of the same stops');
  svg.append('title').text('Orthographic globe of the same stops'); svg.append('desc').text('The chronological stop list carries the same information.');
  const projection=d3.geoOrthographic().rotate([150, -58]).clipAngle(90);
  const path=d3.geoPath(projection);
  let land=null, W=0,H=0, scale0=1;
  const gSphere=svg.append('g'), gLand=svg.append('g'), gGrat=svg.append('g'), gData=svg.append('g');
  const grat=d3.geoGraticule10();
  function resize(){ W=el.clientWidth; H=el.clientHeight; if(!W||!H) return; scale0=Math.min(W,H)/2.15; projection.translate([W/2,H/2]); if(!projection._userScale) projection.scale(scale0); draw(); }
  const kNow=()=>projection.scale()/scale0;
  const tierOn = p=>{ const t=labelTier(p), k=kNow(); return t===0 || (t===4 && k>=1.8) || (t===6 && k>=3) || (t===8 && k>=5); };
  function draw(){
    if(!W) return;
    gSphere.selectAll('path').data([{type:'Sphere'}]).join('path').attr('d', path).style('fill','var(--globe-sea)').style('stroke','var(--globe-coast)');
    gGrat.selectAll('path').data([grat]).join('path').attr('d', path).attr('fill','none').style('stroke','var(--rule)').attr('stroke-width',.5);
    if(land) gLand.selectAll('path').data([land]).join('path').attr('d', path).style('fill','var(--globe-land)').style('stroke','var(--globe-coast)').attr('stroke-width',.6);
    const feats=[];
    ['1907','1908'].forEach(j=>{ if(!state.layers['j'+j]) return;
      if(state.layers.routes) D.segments.filter(g=>g.journey===j).forEach(g=>legsOf(g).forEach(l=>feats.push({type:'Feature', kind:'route', j, l, geometry:{type:'LineString', coordinates:[[l.a.lon,l.a.lat],[l.b.lon,l.b.lat]]}})));
    });
    if(state.layers.context) D.context_arcs.forEach(a=>{ const p=IDX.place[a.frm], q=IDX.place[a.to]; feats.push({type:'Feature', kind:'ctx', a, geometry:{type:'LineString', coordinates:[[p.lon,p.lat],[q.lon,q.lat]]}}); });
    gData.selectAll('path.route').data(feats, (d,i)=>i).join('path').attr('class','route').attr('d', path).attr('fill','none')
      .style('stroke', d=>d.kind==='ctx'?'var(--model)':JVAR[d.j]).attr('stroke-width', d=>d.kind==='ctx'?1.4: (d.l.seg.to===state.highlight? 3.2 : 2))
      .attr('stroke-dasharray', d=>d.kind==='ctx'?'6 5': d.l.dash? d.l.dash.replace('8 6','7 5').replace('2 6','2 5') : null).attr('opacity', d=>d.kind==='ctx'? .9 : (state.highlight? (d.l.seg.to===state.highlight? 1 : .3) : .9))
      .append('title').text(d=>d.kind==='ctx'? d.a.label+' (context, schematic)' : `${IDX.stop[d.l.seg.frm].label} → ${IDX.stop[d.l.seg.to].label}${(d.l.seg.via||[]).length?' · '+viaText(d.l.seg):''}: ${d.l.seg.mode} (${d.l.seg.mode_status}); schematic`);
    // halos and points
    const halos=[]; const pts=[]; const seen=new Map();
    ['1907','1908'].forEach(j=>{ if(!state.layers['j'+j]) return; placesOf(j).forEach(({place,stops})=>{ if(!seen.has(place.id)) seen.set(place.id,{place,js:[],stops:[]}); const e=seen.get(place.id); e.js.push(j); e.stops=e.stops.concat(stops); if(state.layers.halos && place.radius_km && place.status!=='verified' && e.js.length===1) halos.push({place,j}); }); });
    seen.forEach(e=>pts.push({place:e.place, j: e.js.length===2?'both':e.js[0], stops:e.stops}));
    if(state.layers.trail) TRAIL_PLACES.forEach(id=>{ const p=IDX.place[id]; if(p&&!seen.has(id)){ seen.set(id,1); pts.push({place:p,j:null,stops:[]}); } });
    if(state.layers.context) CTX_PLACES.forEach(id=>{ const p=IDX.place[id]; pts.push({place:p,j:'ctx',stops:[]}); if(p.radius_km>20) halos.push({place:p,j:'ctx'}); });
    const circle=d3.geoCircle();
    gData.selectAll('path.halo').data(halos,(d)=>d.place.id).join('path').attr('class','halo').attr('d', d=>path(circle.center([d.place.lon,d.place.lat]).radius(d.place.radius_km/111.2)())).style('fill', d=>d.j==='ctx'?'var(--model)':JVAR[d.j]).attr('fill-opacity',.1).style('stroke', d=>d.j==='ctx'?'var(--model)':JVAR[d.j]).attr('stroke-dasharray','3 3').attr('stroke-width',.8);
    const vis = d=>{ const r=projection.rotate(); const c=[-r[0],-r[1]]; return d3.geoDistance([d.place.lon,d.place.lat], c) < Math.PI/2; };
    const sel=gData.selectAll('g.pt').data(pts, d=>d.place.id).join(enter=>{ const g=enter.append('g').attr('class','pt').style('cursor','pointer'); g.append('circle'); g.append('text'); g.append('title'); return g; });
    sel.attr('display', d=>vis(d)?null:'none').attr('transform', d=>{ const xy=projection([d.place.lon,d.place.lat]); return xy?`translate(${xy[0]},${xy[1]})`:null; })
      .on('click', (ev,d)=>{ const s = d.stops.find(x=>x.journey===state.journey) || d.stops[0]; if(s) stepTo(s.id, {move:false}); })
      .select('circle').attr('r', d=>d.j==='ctx'?5: d.j? (d.place.status==='verified'?5.5:6):4)
      .style('fill', d=>{ if(d.j==='both') return 'var(--j1908)'; const c=d.j==='ctx'?'var(--model)':d.j?JVAR[d.j]:'var(--surface)'; return d.place.status==='verified'||!d.j? c : 'var(--surface)'; }).attr('fill-opacity', d=>(d.j&&d.j!=='both'&&d.place.status!=='verified')? .7 : 1)
      .style('stroke', d=>d.j==='both'?'var(--j1907)': d.j==='ctx'?'var(--model)':d.j?JVAR[d.j]:'var(--paper-trail)').attr('stroke-width', d=>d.j==='both'?2.5: (d.stops.some(s=>s.id===state.highlight)? 3.5 : 2)).attr('stroke-dasharray', d=>d.place.status==='approximate'?'2 2':null);
    sel.select('text').text(d=>d.place.short_label).attr('x',8).attr('y',4).attr('font-size',11).attr('font-family','var(--sans)').style('fill','var(--ink-2)').attr('paint-order','stroke').style('stroke','var(--paper)').attr('stroke-width',3)
      .attr('display', d=> (tierOn(d.place) || d.place.id===state.highlightPlace || ['pl_stpetersburg','pl_lena_mouth'].includes(d.place.id))? null:'none');
    sel.select('title').text(d=>`${d.place.label} — ${d.place.status}; ${d.place.precision}${d.place.radius_km?`; halo ${d.place.radius_km} km`:''}${d.stops.length?`; stops ${d.stops.map(s=>s.journey+' #'+s.seq).join(', ')}`:''}`);
  }
  svg.call(d3.drag().on('start', ()=>svg.style('cursor','grabbing')).on('drag', (ev)=>{ const r=projection.rotate(); const k=75/projection.scale(); projection.rotate([r[0]+ev.dx*k, Math.max(-90,Math.min(90, r[1]-ev.dy*k))]); draw(); }).on('end', ()=>svg.style('cursor','grab')));
  const zoomB=d3.zoom().scaleExtent([.7,8]).on('zoom', (ev)=>{ projection._userScale=true; projection.scale(scale0*ev.transform.k); draw(); }).filter(ev=>ev.type==='wheel'||ev.type==='dblclick'||/^touch/.test(ev.type));
  svg.call(zoomB);
  function zoomBy(f){ const k=Math.max(.7, Math.min(8, kNow()*f)); svg.call(zoomB.scaleTo, k); }
  function rotateBy(dlon, dlat){ const r=projection.rotate(); projection.rotate([r[0]+dlon, Math.max(-90,Math.min(90, r[1]+dlat))]); draw(); }
  svg.on('keydown', (ev)=>{ const k=ev.key; if(k==='ArrowLeft'){ rotateBy(5,0); } else if(k==='ArrowRight'){ rotateBy(-5,0); } else if(k==='ArrowUp'){ rotateBy(0,5); } else if(k==='ArrowDown'){ rotateBy(0,-5); } else if(k==='+'||k==='='){ zoomBy(1.25); } else if(k==='-'||k==='_'){ zoomBy(.8); } else return; ev.preventDefault(); });
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(topo=>{ land=topojson.feature(topo, topo.objects.land); draw(); }).catch(()=>{ gLand.append('text').attr('x',12).attr('y',24).style('fill','var(--disputed)').attr('font-size',12).text('Land outlines could not be loaded (world-atlas CDN unavailable); routes and points are still drawn.'); });
  function focus(p){ const target=[-p.lon, -p.lat]; if(REDUCE){ projection.rotate(target); draw(); return; } d3.transition().duration(900).tween('rotate', ()=>{ const r=d3.interpolate(projection.rotate(), target); return t=>{ projection.rotate(r(t)); draw(); }; }); }
  globe={resize, draw, focus, zoomBy, rotateBy, scale:()=>projection.scale()};
  window.addEventListener('resize', resize);
  resize();
}

/* ---------------------------------------------------------------- routes: #/map, #/map/<placeId>, #/map/stop/<stopId> */
function show(a, b){
  if(!state.inited){ state.inited=true; if(typeof L==='undefined'){ document.getElementById('leaflet').innerHTML='<div class="page notice">Leaflet could not be loaded from the CDN; the map requires network access. The Archive, Timeline, Network and Story tabs work offline.</div>'; return; } initMap(!a); renderPanel(); renderLegend(); }
  if(!map) return;
  map.invalidateSize(false);   // the container may have been hidden until this render; measure it before any flyTo
  setTimeout(()=>{ if(map) map.invalidateSize(); if(globe) globe.resize(); }, 30);
  if(a==='stop' && b && IDX.stop[b]){ stepTo(b); return; }
  if(a && IDX.place[a]){ const p=IDX.place[a];
    if(p.has_coords){ const s=D.stops.find(x=>x.place===a); if(s) stepTo(s.id); else { closePopup(); if(REDUCE) map.setView([p.lat,p.lon], 6); else map.flyTo([p.lat,p.lon], 6); pendingPopup=()=>openPopupFor(p, null, null); } }
    else { closePopup(); state.focusUnlocated=a; state.showUnlocated.add(a); if(!state.layers.unlocated){ state.layers.unlocated=true; const cb=document.querySelector('input[data-layer="unlocated"]'); if(cb) cb.checked=true; } drawUnlocated(); const bb=unlocatedBounds(a); if(bb && bb.isValid()) map.fitBounds(bb.pad(.15), {animate:!REDUCE, maxZoom:8}); updateLabelVisibility(); }
  }
}
window.MapView = { show, setMode, highlight:highlightStop, stepTo, step, follow, clearStop, setFrame, styleFor, gcPath, badge, badgeHTML, arrowFor, legsOf, labelTier, glyph, popupJourney, focusCard,
  zoom(){ return map? map.getZoom() : null; }, setView(ll, z){ if(map){ closePopup(); map.setView(ll, z, {animate:false}); } },
  globeZoom(f){ if(globe) globe.zoomBy(f); }, globeScale(){ return globe? globe.scale() : null; }, pauseGlobe(){}, state, FRAMES };
})();
</script>
<script>
/* ============================================================================
   Story pages, story index, place records, full Tale, Cast
   ============================================================================ */
(function(){
'use strict';
const {D, IDX, esc, chip, personPill, docLink, storyLink, blockHTML, modelBlock, piBlock, docCard, placeCard, findingCard, navbar, fmtDate} = App;
const page=document.getElementById('pageview');
let minimap=null, miniTimer=null;
function destroyMini(){ if(miniTimer){ clearTimeout(miniTimer); miniTimer=null; } if(minimap){ try{minimap.remove();}catch(e){} minimap=null; } }

Pages.storyIndex = function(){
  destroyMini();
  const phases=[['prologue','Prologue (the PI’s framing)'],['paper-trail','The paper trail, 1898–July 1907'],['journey-1907','The 1907 reconnaissance'],['interlude','Interlude, winter 1907–08'],['journey-1908','The 1908 excavation'],['epilogue','Epilogue, 1909–1930']];
  page.innerHTML=`<div class="page">${navbar({close:false})}<h1>Story</h1><p class="subtitle">Twenty-five pages built on the principal investigator’s narrative, enriched from the correspondence. Each page lists the people and documents behind it and states what is inferred.</p>
   ${phases.map(([k,lab])=>`<h2>${esc(lab)}</h2><ol class="toc">${D.stories.filter(s=>s.phase===k).map(s=>`<li><a href="#/story/${s.id}">${esc(s.title)}</a>${s.stops.length?` <span class="muted small">(${s.stops.length} stop${s.stops.length>1?'s':''})</span>`:''}</li>`).join('')}</ol>`).join('')}
   <h2>Also</h2><p><a href="#/tale">Read the Tale of Two Mammoths in full</a> · <a href="#/cast">The PI’s Cast of Characters</a> · <a href="#/method">How this reconstruction was made</a></p></div>`;
};

Pages.story = function([id]){
  destroyMini();
  const s=IDX.story[id]; if(!s){ page.innerHTML='<div class="page">'+navbar()+'<h1>Story not found</h1></div>'; return; }
  const stops=s.stops.map(x=>IDX.stop[x]).filter(Boolean);
  const places=s.places.map(x=>IDX.place[x]).filter(Boolean);
  const dateRange = stops.length? `${fmtDate(stops[0].date_start)} – ${fmtDate(stops[stops.length-1].date_end)}`: '';
  const people=[...new Set(s.people.concat(...s.docs.map(d=>(IDX.doc[d]||{}).senders||[]), ...s.docs.map(d=>(IDX.doc[d]||{}).recipients||[])))].filter(p=>IDX.person[p]);
  const sortedDocs=[...s.docs].filter(d=>IDX.doc[d]).sort((a,b)=>IDX.doc[a].order-IDX.doc[b].order);
  const mapLink = places.find(p=>p.has_coords);
  page.innerHTML=`<div class="page">
    ${navbar({extra: `${s.prev?`<button class="ghost" onclick="App.go('/story/${s.prev}')">‹ Previous</button>`:''}${s.next?`<button class="ghost" onclick="App.go('/story/${s.next}')">Next ›</button>`:''}<a class="small" href="#/stories">Story index</a>`, right: mapLink?`<button onclick="App.go('/map/${mapLink.id}')">Open on map</button>`:''})}
    <div class="phase ${esc(s.phase).replace('journey-','j')}">${esc(s.phase.replace('journey-','journey '))} · page ${s.order+1} of ${D.stories.length}</div>
    <h1>${esc(s.title)}</h1><p class="subtitle">${esc(s.subtitle)}${dateRange?` · <span class="muted">${esc(dateRange)}</span>`:''}</p>
    ${places.some(p=>p.has_coords)?`<div class="minimap" id="minimap"></div><p class="minimap-caption">Symbols as on the main map; see <a href="#/map">Legend</a>. Numerals are the stop's sequence in its journey; connectors are schematic.</p>`:''}
    ${stops.length?`<h2>When</h2><table class="data"><thead><tr><th>Stop</th><th>Date as attested</th><th>Precision</th><th>Status</th><th>Sources</th></tr></thead><tbody>${stops.map(st=>`<tr><td><span class="tag ${App.journeyClass(st.journey)}">${st.journey}</span> <b class="seq ${App.journeyClass(st.journey)}">${st.seq}</b> ${esc(st.label)}<div class="small"><a href="#/map/stop/${st.id}">on the map</a></div></td><td>${esc(st.date_text)}</td><td><span class="chip plain ${esc(st.date_precision)}">${esc(st.date_precision)}</span></td><td>${chip(st.status)}${st.naming?' '+chip('naming'):''}</td><td class="small">${st.sources.map(sr=>`${IDX.doc[sr.ref]?docLink(sr.ref):IDX.pub[sr.ref]?`<a href="#/published/${sr.ref}">${esc(IDX.pub[sr.ref].short)}</a>`:esc(sr.ref)}: ${esc(sr.locator)}`).join('<br>')}<br><span class="muted">${esc(st.why)}</span></td></tr>`).join('')}</tbody></table>`:''}
    ${places.length?`<h2>Where</h2><div class="grid2">${places.map(p=>placeCard(p.id)).join('')}</div>`:''}
    <h2>The principal investigator’s narrative</h2>
    ${s.tale_excerpts.length? s.tale_excerpts.map(e=>piBlock(e.text, e.para)).join('') : `<div class="notice">The Tale does not narrate this part of the journey. The page rests on the correspondence and the PI’s timeline alone.</div>`}
    ${s.model_note? `<h3>Model note</h3>${modelBlock(s.model_note)}`:''}
    ${sortedDocs.length?`<h2>From the correspondence <span class="muted small">(${sortedDocs.length} item${sortedDocs.length>1?'s':''}; blocks are typed: verbatim / researcher’s summary / editorial note)</span></h2>${sortedDocs.map(d=>docCard(d)).join('')}`:'<h2>From the correspondence</h2><div class="notice">No archival item in the transcription file bears directly on this stop. This is itself a finding: the stop is known only from the published itinerary as read by the PI.</div>'}
    <h2>People involved</h2><div>${people.map(personPill).join(' ')}</div>
    ${s.findings.length?`<h2>Discrepancies and absences</h2>${s.findings.map(findingCard).join('')}`:''}
    ${s.published.length?`<h2>Published sources cited</h2><ul>${s.published.map(p=>`<li><a href="#/published/${p}">${esc(IDX.pub[p].short)}</a> <span class="muted small">— ${esc(IDX.pub[p].type)}; full text not provided</span></li>`).join('')}</ul>`:''}
    <div class="footer-nav">${s.prev?`<a href="#/story/${s.prev}">‹ ${esc(IDX.story[s.prev].title)}</a>`:'<span></span>'}${s.next?`<a href="#/story/${s.next}" style="text-align:right">${esc(IDX.story[s.next].title)} ›</a>`:'<span></span>'}</div>
  </div>`;
  if(places.some(p=>p.has_coords) && typeof L!=='undefined'){
    // the minimap reuses the main map's symbology (MapView.styleFor, gcPath, badge, legsOf) so that it cannot contradict the legend
    miniTimer=setTimeout(()=>{ miniTimer=null; const el=document.getElementById('minimap'); if(!el || el._leaflet_id) return; minimap=L.map(el,{zoomControl:false, attributionControl:false, scrollWheelZoom:false, dragging:true, keyboard:false});
      const dark = document.documentElement.dataset.theme==='dark' || (document.documentElement.dataset.theme!=='light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${dark?'World_Dark_Gray_Base':'World_Light_Gray_Base'}/MapServer/tile/{z}/{y}/{x}`,{maxZoom:16}).addTo(minimap);
      const MV=window.MapView; const b=[]; const JV={'1907':'var(--j1907)','1908':'var(--j1908)'};
      // legs of the segments that join this page's stops (out-and-back legs included), in the stop's journey colour with the segment's dash
      const stopIds=new Set(stops.map(st=>st.id));
      D.segments.filter(g=>stopIds.has(g.frm)&&stopIds.has(g.to)).forEach(g=>MV.legsOf(g).forEach(l=>{ const pts=MV.gcPath([l.a.lat,l.a.lon],[l.b.lat,l.b.lon]); L.polyline(pts,{color:JV[l.journey],weight:l.posUnsure?1.6:2.4,dashArray:l.dash,opacity:.85,interactive:false}).addTo(minimap); pts.forEach(q=>b.push(q)); }));
      places.filter(p=>p.has_coords).forEach(p=>{ const here=stops.filter(st=>st.place===p.id); const js=[...new Set(here.map(st=>st.journey))].sort(); const key = js.length===2?'both': js[0]||null;
        if(p.radius_km&&p.status!=='verified'&&key&&key!=='both') L.circle([p.lat,p.lon],{radius:p.radius_km*1000,color:JV[key],weight:1,fillColor:JV[key],fillOpacity:.08,dashArray:'4 4',interactive:false}).addTo(minimap);
        L.circleMarker([p.lat,p.lon], MV.styleFor(p,key)).bindTooltip(esc(p.label)).addTo(minimap);
        js.forEach((j,slot)=>MV.badge(p, j, here.filter(st=>st.journey===j), slot, js.length).addTo(minimap));
        L.marker([p.lat,p.lon],{icon:L.divIcon({className:'lbl '+(key==='both'?'both':App.journeyClass(key)), html:esc(p.short_label), iconSize:null, iconAnchor:[-9,8]}), interactive:false, keyboard:false}).addTo(minimap);
        b.push([p.lat,p.lon]); });
      if(b.length===1) minimap.setView(b[0], 7); else minimap.fitBounds(b,{padding:[30,30],maxZoom:8});
    },30);
  }
};

Pages.place = function([id]){
  destroyMini();
  const p=IDX.place[id]; if(!p){ page.innerHTML='<div class="page">'+navbar()+'<h1>Place not found</h1></div>'; return; }
  const stops=D.stops.filter(s=>s.place===id); const docs=D.documents.filter(d=>(d.place||'').toLowerCase().includes(p.label.split(' ')[0].toLowerCase()) );

    ${placeCard(id)}
    ${stops.length?`<h2>Stops at this place</h2><table class="data"><thead><tr><th>Journey</th><th>Stop</th><th>Date as attested</th><th>Precision</th><th>Status</th><th>Story</th></tr></thead><tbody>${stops.map(st=>`<tr><td><span class="tag ${App.journeyClass(st.journey)}">${st.journey}</span></td><td>${esc(st.label)}</td><td>${esc(st.date_text)}</td><td><span class="chip plain ${esc(st.date_precision)}">${esc(st.date_precision)}</span></td><td>${chip(st.status)}</td><td>${storyLink(st.story)}</td></tr>`).join('')}</tbody></table>`:'<p class="notice">No itinerary stop is recorded at this place; it appears in the record as a correspondence node, a mention, or an unlocated reference.</p>'}
    ${p.stories.length?`<h2>Story pages</h2><ul>${p.stories.map(s=>`<li>${storyLink(s)}</li>`).join('')}</ul>`:''}
    ${docs.length?`<h2>Letters written here</h2><ul>${docs.map(d=>`<li>${docLink(d.id)} <span class="muted small">${esc(d.date_text)}</span></li>`).join('')}</ul>`:''}
    ${D.findings.filter(f=>(f.places||[]).includes(id)).length?`<h2>Findings</h2>${D.findings.filter(f=>(f.places||[]).includes(id)).map(f=>findingCard(f.id)).join('')}`:''}
  </div>`;
};

Pages.tale = function([para]){
  destroyMini();
  let section=null;
  page.innerHTML=`<div class="page">${navbar()}<div class="phase">principal investigator’s text · unpublished talk · quoted in full</div>
   <h1>Time, Temperature, and Tissue in the Circumpolar North: A Tale of Two Mammoths</h1><p class="subtitle">Rebecca Woods, University of Toronto · MIT Seminar in Agriculture and the Environment · 20 September 2019</p>
   <p class="notice">Reproduced verbatim from the file supplied by the lab (including the author’s bracketed notes, struck passages and footnotes). Paragraph numbers (¶) are added by the build for citation; they are not the author’s. Footnote numbers link to the notes at the end.</p>
   <div class="serif" style="font-size:1.05rem">${D.tale.map(t=>{ let h=''; if(t.section!==section){ section=t.section; h+=`<h2 id="sec-${esc(section)}">${esc(section)}</h2>`; } return h+`<p id="${t.id}" style="position:relative"><span class="muted small" style="position:absolute;left:-3.2rem;font-family:var(--sans)">¶${t.id.replace('t','')}</span>${t.html}</p>`; }).join('')}</div>
   <h2>Notes</h2><ol class="small serif">${D.tale_footnotes.map(f=>`<li id="fn${f.n}" value="${f.n}">${f.html}</li>`).join('')}</ol></div>`;
  page.querySelectorAll('sup.fnref').forEach(s=>s.addEventListener('click', ()=>{ const el=document.getElementById('fn'+s.dataset.fn); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='var(--annotation-soft)'; setTimeout(()=>el.style.background='',1500);} }));

Pages.cast = function(){

  page.innerHTML=`<div class="page">${navbar()}<div class="phase">principal investigator — Cast of Characters: working notes (unpublished, 2019), quoted verbatim</div><h1>Cast of Characters</h1><p class="notice">The principal investigator’s working notes (unpublished, 2019): one-line characterisations in an informal register, reproduced exactly as written and verified against her file at build. They are her reading aids, not publication prose. Each name links to the prosopographical record built from the correspondence, where the line is quoted again, apart from the attested roles and offices.</p>
   <dl class="kv" style="grid-template-columns:200px 1fr">${D.cast.map(c=>{ const p=match(c.name); return `<dt><b>${p?`<a href="#/person/${p.id}">${esc(c.name)}</a>`:esc(c.name)}</b></dt><dd class="serif">${esc(c.text)}</dd>`; }).join('')}</dl></div>`;

<script>
/* ============================================================================
   Archive (primary-source reader), person pages, network analysis
   ============================================================================ */
(function(){
'use strict';
const {D, IDX, esc, chip, personPill, docLink, storyLink, blockHTML, modelBlock, findingCard, navbar, fmtDate, personLabel} = App;
const page=document.getElementById('pageview');
const AF = { q:'', folder:'', year:'', type:'', who:'' };
const folders=[...new Set(D.documents.map(d=>d.archive).filter(Boolean))];
const years=[...new Set(D.documents.map(d=>d.year).filter(Boolean))].sort();
const correspondents=[...new Set(D.documents.flatMap(d=>[...(d.senders||[]),...(d.recipients||[])]))].map(id=>({id,label:personLabel(id)})).sort((a,b)=>a.label.localeCompare(b.label));

function docMatches(d){
  if(AF.folder && d.archive!==AF.folder) return false;
  if(AF.year && String(d.year)!==AF.year) return false;
  if(AF.type){ if(AF.type==='verbatim' && !(d.block_counts||{}).verbatim) return false; if(AF.type==='summary-only' && (d.block_counts||{}).verbatim) return false; if(AF.type==='enclosure' && !d.enclosed_in) return false; if(AF.type==='copy' && !/copy|draft|excerpt|telegram/i.test(d.form)) return false; }
  if(AF.who && !(d.senders||[]).includes(AF.who) && !(d.recipients||[]).includes(AF.who)) return false;
  if(AF.q){ const q=AF.q.toLowerCase(); const hay=(d.title+' '+d.date_text+' '+d.blocks.map(b=>b.text).join(' ')).toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}
Pages.archive = function([id]){
  if(!document.getElementById('archive')){
    page.innerHTML=`<div id="archive"><div class="list">
      <div class="pagenav" style="margin-bottom:.4rem"><button class="ghost" onclick="App.back()">← Back</button><span class="spacer"></span><span class="small muted" id="doccount"></span></div>
      <div class="filters">
        <input type="search" id="afq" placeholder="Search text of all ${D.documents.length} items…" value="${esc(AF.q)}">
        <select id="affolder"><option value="">All folders</option>${folders.map(f=>`<option ${AF.folder===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
        <select id="afyear"><option value="">All years</option>${years.map(y=>`<option ${AF.year===String(y)?'selected':''}>${y}</option>`).join('')}</select>
        <select id="afwho"><option value="">Any correspondent</option>${correspondents.map(c=>`<option value="${c.id}" ${AF.who===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select>
        <select id="aftype"><option value="">Any form</option><option value="verbatim" ${AF.type==='verbatim'?'selected':''}>has verbatim text</option><option value="summary-only" ${AF.type==='summary-only'?'selected':''}>summary only (no verbatim)</option><option value="copy" ${AF.type==='copy'?'selected':''}>copies, drafts, telegrams, excerpts</option><option value="enclosure" ${AF.type==='enclosure'?'selected':''}>enclosures</option></select>
      </div>
      <ul id="doclist"></ul></div><div class="reader" id="reader"></div></div>`;
    document.getElementById('afq').addEventListener('input', e=>{AF.q=e.target.value; renderList();});
    [['affolder','folder'],['afyear','year'],['afwho','who'],['aftype','type']].forEach(([el,k])=>document.getElementById(el).addEventListener('change', e=>{AF[k]=e.target.value; renderList();}));
  }
  renderList(id);
  renderReader(id);
};
function renderList(active){
  const ul=document.getElementById('doclist'); if(!ul) return;
  const docs=D.documents.filter(docMatches);
  document.getElementById('doccount').textContent=`${docs.length} of ${D.documents.length} items`;
  let yr=null; ul.innerHTML=docs.map(d=>{ let h=''; if(d.year!==yr){ yr=d.year; h+=`<span class="yr">${yr||'undated'}</span>`; } return h+`<li data-id="${d.id}" class="${d.id===active?'active':''}" onclick="App.go('/archive/${d.id}')"><span class="d">${esc(d.date_text.length>22?fmtDate(d.date):d.date_text)}</span> <span class="t">${esc(d.title)}</span><span class="small muted">${esc(d.form)}${d.enclosed_in?' · enclosure':''} · ${Object.entries(d.block_counts||{}).map(([k,v])=>`${v} ${k[0]}`).join(' ')}</span></li>`; }).join('');
  const a=ul.querySelector('li.active'); if(a) a.scrollIntoView({block:'nearest'});
}
function renderReader(id){
  const r=document.getElementById('reader'); if(!r) return;
  if(!id){ r.innerHTML=`<h1>Archive</h1><p class="subtitle">The correspondence of the Alaskan Mammoth Expeditions, 1906–1930, as transcribed by the principal investigator.</p>
    <div class="notice"><b>How to read a document.</b> The transcription file mixes three voices, and the reader keeps them apart typographically:
    <div class="block verbatim" style="margin:.5rem 0"><span class="who">historical writer (as transcribed by the PI)</span>Serif, with the PI’s marks preserved: <s>struck text</s>, <u>underlining</u>, <ins class="ms-insert">caret insertions</ins>, <span class="ed-inline">[sic]</span>, and <span class="pi-color pc-FF0000">her colour coding</span> (explained per document).</div>
    <div class="block summary" style="margin:.5rem 0"><span class="who">researcher’s summary (R. J. H. Woods)</span>Sans-serif on grey: the PI’s paraphrase of what a document says. Quotation marks inside a summary are hers.</div>

    <div class="block annotation" style="margin:.5rem 0"><span class="who">annotation on the original (as transcribed by the PI)</span>Marginal or interlinear notes on the document itself.</div>

    <h3>Collections</h3><ul>${folders.map(f=>`<li>${esc(f)} <span class="muted small">(${D.documents.filter(d=>d.archive===f).length})</span></li>`).join('')}</ul>`; return; }
  const d=IDX.doc[id]; if(!d){ r.innerHTML='<h1>Item not found</h1>'; return; }

  const related = [];
  if(d.enclosed_in) related.push(`Enclosed in ${docLink(d.enclosed_in)}`);

  r.innerHTML=`${navbar({extra:`${prev?`<button class="ghost" onclick="App.go('/archive/${prev.id}')">‹ Previous item</button>`:''}${next?`<button class="ghost" onclick="App.go('/archive/${next.id}')">Next item ›</button>`:''}`})}
    <div class="phase">archival item ${idx+1} of ${D.documents.length} · ${esc(d.form)}</div>
    <h1>${esc(d.title)}</h1>
    <div class="docmeta">
      <div><b>Date</b>${esc(d.date_text)} <span class="chip plain ${esc(d.precision)}">${esc(d.precision)}</span></div>
      <div><b>From</b>${(d.senders||[]).map(personPill).join(' ')||'—'}</div>
      <div><b>To</b>${(d.recipients||[]).map(personPill).join(' ')||'—'}</div>
      <div><b>Place of writing</b>${esc(d.place||'not stated')}</div>
      <div><b>Archive citation</b>${esc(d.archive||'')}</div>
      <div><b>PI header (verbatim)</b><span class="serif">${esc(d.header_raw||'')}</span></div>
      ${related.length?`<div><b>Related items</b>${related.join('<br>')}</div>`:''}
      ${d.mentions.length?`<div><b>Also named in the text</b>${d.mentions.map(personPill).join(' ')}<div class="small muted">${esc(d.mentions_method)}</div></div>`:''}
    </div>
    ${d.note? modelBlock(d.note):''}
    ${legend}
