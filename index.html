*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--j1907);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:1px solid var(--rule-2);border-radius:var(--radius);padding:.3rem .7rem;cursor:pointer}

h1{font-size:1.9rem}h2{font-size:1.35rem;margin-top:2rem}h3{font-size:1.1rem;margin-top:1.4rem}h4{font-size:1rem;margin-top:1rem;font-family:var(--sans)}

.serif{font-family:var(--serif)}
.small{font-size:.86rem}.muted{color:var(--muted)}.caps{font-variant:all-small-caps;letter-spacing:.04em}
.hidden{display:none!important}
.sr-only{position:absolute;left:-9999px}
/* top bar */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);display:flex;align-items:center;gap:1rem;padding:0 1rem;background:var(--surface);border-bottom:1px solid var(--rule);z-index:1200}
#topbar .brand{font-family:var(--serif);font-weight:600;font-size:1.05rem;white-space:nowrap}

nav.tabs{display:flex;gap:.1rem;margin-left:auto;overflow-x:auto}

nav.tabs a.active{background:var(--ink);color:var(--paper)}
nav.tabs a:hover{text-decoration:none;background:var(--surface-2)}nav.tabs a.active:hover{background:var(--ink)}

.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}

.pagenav{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem;font-size:.9rem}
.pagenav .spacer{flex:1}
.pagenav button{padding:.25rem .6rem}
.crumb{color:var(--muted)}
.phase{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.phase.j1907{color:var(--j1907)}.phase.j1908{color:var(--j1908)}.phase.prologue,.phase.epilogue{color:var(--model)}
.subtitle{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:1.05rem;margin-top:-.2rem}

.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;line-height:1;padding:.22rem .5rem;border-radius:999px;border:1px solid var(--rule-2);color:var(--ink-2);background:var(--surface);white-space:nowrap;vertical-align:middle;font-family:var(--sans);text-transform:lowercase}

.chip.plain::before{display:none}

.block.verbatim{color:var(--ink)}
.block.summary{color:var(--ink)}
.block.editorial{color:var(--ink-2)}
.block.annotation{color:var(--ink-2)}
.block.model{color:var(--ink)}
.block.verbatim.tabular{white-space:pre-wrap;tab-size:10;font-size:.95rem}
.block.summary{font-family:var(--sans);background:var(--summary-soft);border-left-color:var(--summary);color:#2e3140}
.block.editorial{font-family:var(--sans);font-size:.9rem;font-style:italic;background:var(--editorial-soft);border-left-color:var(--editorial);color:#4d4c2d}
.block.annotation{font-family:var(--sans);font-size:.92rem;background:var(--annotation-soft);border-left-color:var(--annotation);color:#5a4712;border-left-style:dashed}

.block s{text-decoration:line-through;color:#7a7a7a}.block u{text-decoration:underline}

.block ins.ms-insert::before{content:"^";font-size:.7em;vertical-align:super;color:#2f5f3f}
.block .ed-inline{color:var(--editorial);font-family:var(--sans);font-size:.85em;font-style:italic}
.block .ann-inline{color:var(--annotation);font-family:var(--sans);font-size:.9em;border-bottom:1px dashed var(--annotation)}
.block .pi-color{border-bottom:2px solid currentColor;padding-bottom:1px}
.pc-FF0000{color:var(--pc-red)}.pc-0070C0{color:var(--pc-blue)}.pc-7030A0{color:var(--pc-purple)}.pc-FF40FF{color:var(--pc-magenta)}
sup.fnref{color:var(--j1907);cursor:pointer;font-size:.7em;margin-left:1px}
.legend-colors{font-size:.84rem;margin:.4rem 0 .8rem}
.legend-colors span{display:inline-block;margin-right:1rem}
.legend-colors i{display:inline-block;width:1.4rem;height:.15rem;vertical-align:middle;margin-right:.3rem}
/* document cards in stories */
.doccard{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);margin:.6rem 0;padding:.7rem .9rem}
.doccard .head{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:baseline;font-size:.92rem}

/* MAP */
#mapview{display:flex;flex-direction:row}
#panel{width:330px;flex:none;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;transition:width .2s ease;overflow:hidden;position:relative;z-index:900}

#panel .inner{width:330px;overflow:auto;padding:.9rem 1rem 2rem;height:100%}
#panel h3{margin:.2rem 0 .5rem;font-size:.95rem;font-family:var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

#stoplist li:hover{background:var(--surface-2)}
#stoplist li.active{background:var(--surface-2)}
#stoplist li.j1907{border-left-color:var(--j1907)}#stoplist li.j1908{border-left-color:var(--j1908)}
#stoplist .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem;padding-top:.1rem}
#stoplist .grp{display:block;margin:.6rem 0 .2rem;font-weight:600;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
#stoplist .grp.j1907{color:var(--j1907)}#stoplist .grp.j1908{color:var(--j1908)}
#panelToggle{position:absolute;top:.6rem;left:0;z-index:950;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-left:none;border-radius:0 var(--radius) var(--radius) 0;padding:.35rem .5rem;cursor:pointer;box-shadow:var(--shadow);transition:left .2s ease}
#mapstage{flex:1;position:relative;background:#e9eef2}

#globe svg{width:100%;height:100%;display:block;cursor:grab}
#maplegend{position:absolute;right:.8rem;bottom:1.6rem;background:var(--surface);opacity:.96;color:var(--ink);border:1px solid var(--rule);border-radius:var(--radius);padding:.6rem .8rem;font-size:.78rem;z-index:800;max-width:260px;box-shadow:var(--shadow)}
#maplegend .row{display:flex;align-items:center;gap:.5rem;margin:.15rem 0}
#maplegend svg{flex:none}
#mapnote{position:absolute;left:.8rem;bottom:.6rem;font-size:.72rem;color:var(--muted);z-index:800;background:var(--surface);opacity:.9;padding:.1rem .4rem;border-radius:3px;max-width:60%}
.leaflet-container{font-family:var(--sans);background:#e3e9ee}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content-wrapper{border-radius:var(--radius);box-shadow:var(--shadow);font-family:var(--sans)}
.leaflet-popup-content{margin:.7rem .9rem;font-size:.88rem;line-height:1.45;min-width:220px}
.leaflet-popup-content h4{margin:0 0 .3rem;font-family:var(--serif);font-size:1.02rem}
.leaflet-popup-content .why{color:var(--ink-2);font-size:.82rem;margin:.3rem 0}
.leaflet-popup-content ul{margin:.3rem 0;padding-left:1rem}
.leaflet-control-attribution{font-size:.68rem}
.lbl{background:transparent;border:none;box-shadow:none;font-family:var(--sans);font-size:.76rem;color:var(--ink-2);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;white-space:nowrap}
.lbl.j1907{color:var(--j1907)}.lbl.j1908{color:var(--j1908)}
.marker-disputed{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--disputed);background:#fff;}
.minimap{height:260px;border:1px solid var(--rule);border-radius:var(--radius);margin:.5rem 0 1rem;z-index:1}
/* archive */
#archive{display:grid;grid-template-columns:360px 1fr;height:100%}
#archive .list{border-right:1px solid var(--rule);background:var(--surface);overflow:auto;padding:.8rem}
#archive .reader{overflow:auto;padding:1.4rem 2rem 4rem}
#archive .filters{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.6rem}
#archive .filters input[type=search]{grid-column:1/-1}
#doclist{list-style:none;margin:0;padding:0}
#doclist li{padding:.4rem .5rem;border-radius:var(--radius);cursor:pointer;border-left:3px solid transparent;font-size:.86rem}
#doclist li:hover{background:var(--surface-2)}#doclist li.active{background:var(--surface-2);border-left-color:var(--ink)}
#doclist .d{color:var(--muted);font-variant-numeric:tabular-nums}

.docmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.3rem 1rem;font-size:.88rem;margin:.6rem 0 1rem;padding:.7rem .9rem;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}
.docmeta b{color:var(--muted);font-weight:600;display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
/* network */
#network{display:grid;grid-template-columns:1fr 380px;height:100%}
#netstage{position:relative;background:var(--surface)}
#netstage svg{width:100%;height:100%;display:block}
#netcontrols{position:absolute;top:.6rem;left:.6rem;background:var(--surface);opacity:.97;border:1px solid var(--rule);border-radius:var(--radius);padding:.6rem .8rem;font-size:.84rem;z-index:5;box-shadow:var(--shadow);max-width:330px}
#netcontrols label{display:inline-flex;align-items:center;gap:.35rem;margin:.1rem .6rem .1rem 0}
#netcontrols .row{margin:.2rem 0}
#netside{border-left:1px solid var(--rule);overflow:auto;padding:1rem 1.1rem 3rem;background:var(--paper)}
.netnode{cursor:pointer}
.netnode text{font-family:var(--sans);font-size:11px;fill:var(--ink-2);pointer-events:none;paint-order:stroke;stroke:var(--net-halo);stroke-width:3px}
.netedge{fill:none;stroke-opacity:.55}
.netedge.correspondence{stroke:var(--j1907)}.netedge.stated{stroke:var(--j1908)}.netedge.pi{stroke:var(--model);stroke-dasharray:4 3}.netedge.affiliation{stroke:#9a9a9a;stroke-dasharray:1 3}
.netedge.dim{stroke-opacity:.08}.netnode.dim{opacity:.18}
/* timeline */
.tl{position:relative;margin-left:.5rem;padding-left:1.6rem;border-left:2px solid var(--rule-2)}
.tl .yr{position:relative;margin:1.6rem 0 .6rem;font-family:var(--serif);font-size:1.3rem}
.tl .yr::before{content:"";position:absolute;left:calc(-1.6rem - 7px);top:.5rem;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.tlentry{position:relative;margin:.5rem 0;padding:.6rem .9rem;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}
.tlentry::before{content:"";position:absolute;left:calc(-1.6rem - 5px);top:1rem;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tlentry.itin::before{background:var(--pc-purple)}
.tlentry.active{border-color:var(--ink)}
.tlentry .d{font-weight:600;font-variant-numeric:tabular-nums}
.tlentry .text{font-family:var(--serif);margin:.2rem 0 .4rem}
.tlentry .links{display:flex;gap:.6rem;flex-wrap:wrap;font-size:.84rem}
.tlentry .links a{padding:.1rem .45rem;border:1px solid var(--rule-2);border-radius:999px}
/* misc */
.notice{border:1px dashed var(--rule-2);padding:.6rem .9rem;border-radius:var(--radius);background:var(--surface);font-size:.9rem}
.toc{columns:2;column-gap:2rem;font-size:.92rem}
.toc li{break-inside:avoid;margin:.2rem 0}
.finding{border-left:3px solid var(--disputed);padding:.5rem .9rem;background:var(--surface);margin:.5rem 0;border-radius:0 var(--radius) var(--radius) 0;font-size:.92rem}
.finding.absence{border-left-color:var(--approximate)}.finding.naming{border-left-color:var(--inferred)}.finding.unlocated{border-left-color:var(--unlocated)}.finding.authorship{border-left-color:var(--model)}
.finding b{font-family:var(--serif)}
.footer-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--rule)}
.footer-nav a{max-width:45%}
.dl a{display:inline-block;margin:.2rem .6rem .2rem 0}
@media (max-width:900px){
  #archive,#network{grid-template-columns:1fr}
  #archive .list{max-height:40vh;border-right:none;border-bottom:1px solid var(--rule)}
  #network{grid-template-rows:60vh 1fr}
  #netside{border-left:none;border-top:1px solid var(--rule)}
  #panel{position:absolute;top:0;bottom:0;left:0}

  #topbar .brand span{display:none}
}

  html{font-size:15px}
  .page{padding:1rem 1rem 3rem}

  #maplegend{display:none}
}

<body>
<header id="topbar">
  <div class="brand">The Quackenbush Journeys <span>1907–1908 · an evidence-based reconstruction</span></div>
  <nav class="tabs" id="tabs">
    <a href="#/map" data-tab="map">Map</a>
    <a href="#/stories" data-tab="story">Story</a>
    <a href="#/network" data-tab="network">Network</a>
    <a href="#/archive" data-tab="archive">Archive</a>
    <a href="#/timeline" data-tab="timeline">Timeline</a>
    <a href="#/published" data-tab="published">Published</a>
    <a href="#/method" data-tab="method">Method &amp; Data</a>
  </nav>
</header>
<main id="app">
  <section id="mapview" class="view">
    <button id="panelToggle" title="Show or hide the layer panel" aria-label="Toggle panel">☰</button>
    <aside id="panel"><div class="inner" id="panelInner"></div></aside>
    <div id="mapstage">
      <div id="leaflet"></div>
      <div id="globe" class="hidden"></div>
      <div id="maplegend"></div>
      <div id="mapnote">All connectors are schematic: no route was traced. Marker style = source status; halos = uncertainty radius.</div>
    </div>
  </section>
  <section id="pageview" class="view hidden"></section>
</main>
<script src="data/bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ============================================================================
   Core: data access, routing with an explicit history stack, shared components
   ============================================================================ */
(function(){
'use strict';
const D = window.JOURNEYS_DATA;
if(!D){ document.getElementById('pageview').innerHTML='<div class="page"><h1>Data not loaded</h1><p>data/bundle.js is missing. Run <code>python3 scripts/build_data.py</code>.</p></div>'; return; }
const byId = (arr)=>Object.fromEntries(arr.map(x=>[x.id,x]));
const IDX = {
  doc: byId(D.documents), person: byId([...D.people, ...D.offices, ...D.institutions]), place: byId(D.places), stop: byId(D.stops),
  story: byId(D.stories), pub: byId(D.published), finding: byId(D.findings), tl: byId(D.timeline), tale: byId(D.tale), seg: byId(D.segments)
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){ if(!iso) return 'undated'; const p=iso.split('-'); if(p.length===1) return p[0]; if(p.length===2) return MONTHS[+p[1]-1]+' '+p[0]; return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0]; }
function personLabel(id){ const p=IDX.person[id]; return p? p.label : id; }
function journeyClass(j){ return j==='1907'?'j1907': j==='1908'?'j1908':''; }
const JCOLOR = {'1907':'#1f6fa3','1908':'#c0603a'};
const STATUS_TXT = D.meta.status_chips;

/* ---------------- routing ---------------- */
/* The stack is the app's own notion of "where the user came from". hashchange fires asynchronously, so
   go()/goBack() update the stack first and the handler ignores a hash that already sits on top. */
const stack = [];
function currentHash(){ return location.hash.replace(/^#/, '') || '/map'; }
function go(route){ if(currentHash()===route){ render(route); return; } stack.push(route); location.hash=route; render(route); }
function goBack(){ if(stack.length>1){ stack.pop(); const prev=stack[stack.length-1]; location.hash=prev; render(prev); } else { go('/map'); } }
function prevTitle(){ if(stack.length<2) return 'Map'; return routeTitle(stack[stack.length-2]); }
function routeTitle(r){
  const seg=r.split('/').filter(Boolean);
  const t=seg[0]||'map';
  if(t==='map') return 'Map'; if(t==='stories') return 'Story index'; if(t==='story') return (IDX.story[seg[1]]||{}).title||'Story';
  if(t==='archive') return seg[1]? ((IDX.doc[seg[1]]||{}).title||'Document') : 'Archive';
  if(t==='network') return 'Network'; if(t==='person') return personLabel(seg[1]); if(t==='timeline') return 'Timeline'; if(t==='published') return seg[1]? 'Published source':'Published sources';
  if(t==='method') return 'Method & Data'; if(t==='place') return (IDX.place[seg[1]]||{}).label||'Place'; if(t==='tale') return 'A Tale of Two Mammoths (full text)'; if(t==='cast') return 'Cast of Characters';
  return t;
}
window.addEventListener('hashchange', ()=>{ const h=currentHash(); if(stack.length && stack[stack.length-1]===h) return; /* already handled by go()/goBack() */ if(stack.length>=2 && stack[stack.length-2]===h){ stack.pop(); } else { stack.push(h); } render(h); });

const page = document.getElementById('pageview'), mapview=document.getElementById('mapview');
function setTab(name){ document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('active', a.dataset.tab===name)); }
function render(route){
  const seg=route.split('/').filter(Boolean); const t=seg[0]||'map';
  if(t==='map'){ page.classList.add('hidden'); mapview.classList.remove('hidden'); setTab('map'); MapView.show(seg[1]); return; }
  mapview.classList.add('hidden'); page.classList.remove('hidden'); page.scrollTop=0;
  const tabFor={stories:'story',story:'story',archive:'archive',network:'network',person:'network',timeline:'timeline',published:'published',method:'method',place:'map',tale:'story',cast:'network'};
  setTab(tabFor[t]||'');
  const fn={stories:Pages.storyIndex, story:Pages.story, archive:Pages.archive, network:Pages.network, person:Pages.person, timeline:Pages.timeline, published:Pages.published, method:Pages.method, place:Pages.place, tale:Pages.tale, cast:Pages.cast}[t];
  if(fn) fn(seg.slice(1)); else page.innerHTML='<div class="page"><h1>Not found</h1></div>';
  if(window.MapView) MapView.pauseGlobe && MapView.pauseGlobe();
}
/* shared nav bar */
function navbar(opts={}){
  const back = `<button class="ghost" onclick="App.back()" title="Return to the previous page">← Back to ${esc(prevTitle())}</button>`;
  const close = opts.close===false?'':`<button class="ghost" onclick="App.back()" title="Close and return to the previous page">✕ Close</button>`;
  return `<div class="pagenav">${back}${opts.extra||''}<span class="spacer"></span>${opts.right||''}${close}</div>`;
}
function chip(status, text){ return `<span class="chip ${esc(status)}" title="${esc(STATUS_TXT[status]||'')}">${esc(text||status)}</span>`; }
function personPill(id){ const p=IDX.person[id]; if(!p) return esc(id); const cls = p.kind==='office'? 'pill':(p.type==='institution'||id.startsWith('i_')||id.startsWith('v_'))?'pill inst':'pill person'; const href = id.startsWith('p_')||id.startsWith('o_') ? `#/person/${id}` : `#/person/${id}`; return `<a class="${cls}" href="${href}">${esc(p.label)}</a>`; }
function docLink(id, text){ const d=IDX.doc[id]; if(!d) return esc(id); return `<a href="#/archive/${id}">${esc(text||d.title)}</a>`; }
function storyLink(id, text){ const s=IDX.story[id]; if(!s) return esc(id); return `<a href="#/story/${id}">${esc(text||s.title)}</a>`; }
function blockHTML(b){
  const cls=['block', b.type, b.indent?'indent':'', b.tabular?'tabular':''].join(' ');
  return `<div class="${cls}" id="${esc(b.id)}"><span class="who">${esc(b.speaker)}</span>${b.html}</div>`;
}
function modelBlock(text){ return `<div class="block model"><span class="who">model note — the model’s words, added for connection; not from the sources</span>${esc(text)}</div>`; }
function piBlock(text, para){ const link = para? ` <a class="small" href="#/tale#${para}" onclick="event.preventDefault();App.go('/tale/${para}')">read in context ¶${para.replace('t','')}</a>`:''; return `<div class="block pi"><span class="who">principal investigator — Tale of Two Mammoths (2019), verbatim</span>${esc(text)}${link}</div>`; }
function docCard(id, opts={}){
  const d=IDX.doc[id]; if(!d) return '';
  const firstV = d.blocks.find(b=>b.type==='verbatim') || d.blocks[0];
  const counts = Object.entries(d.block_counts||{}).map(([k,v])=>`<span class="tag ${k}">${v} ${k}</span>`).join(' ');
  const who = `${(d.senders||[]).map(personLabel).join(', ')} → ${(d.recipients||[]).map(personLabel).join(', ')||'—'}`;
  return `<div class="doccard" id="dc-${id}">
    <div class="head"><span class="date">${esc(d.date_text)}</span><span class="title">${esc(d.title)}</span><span class="muted small">${esc(d.form)}</span></div>
    <div class="small muted">${esc(who)} · ${esc(d.archive||'')}</div>
    ${firstV? `<div class="preview"><div class="block ${firstV.type}" style="margin:.3rem 0"><span class="who">${esc(firstV.speaker)}</span>${trunc(firstV.html, 420)}</div></div>`:''}
    <div class="actions">${counts}<a href="#/archive/${id}">Read the document →</a><button class="ghost small" onclick="App.expandDoc('${id}')">show all ${d.blocks.length} blocks</button></div>
    <div class="full hidden" id="full-${id}"></div>
  </div>`;
}
function trunc(html, n){ const tmp=document.createElement('div'); tmp.innerHTML=html; const txt=tmp.textContent||''; if(txt.length<=n) return html; return esc(txt.slice(0,n))+'…'; }
function expandDoc(id){ const el=document.getElementById('full-'+id); const d=IDX.doc[id]; if(!el||!d) return; if(!el.classList.contains('hidden')){ el.classList.add('hidden'); return; } el.innerHTML=d.blocks.map(blockHTML).join(''); el.classList.remove('hidden'); }
function placeCard(id){
  const p=IDX.place[id]; if(!p) return '';
  const cs=p.coord_source||{};
  const coords = p.has_coords? `${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`:'no coordinate (unlocated)';
  return `<div class="card"><h4>${esc(p.label)} ${chip(p.status)} ${p.tier?`<span class="tag">tier ${p.tier}</span>`:''}</h4>
    <dl class="kv"><dt>Attested as</dt><dd>${p.attested.map(a=>`“${esc(a.form)}” <span class="muted small">(${esc(a.source)})</span>`).join('; ')}</dd>
    <dt>Coordinates</dt><dd>${coords}${p.radius_km?` · halo ${p.radius_km} km`:''} · <span class="muted">${esc(p.precision)}</span></dd>
    ${cs.authority? `<dt>Source</dt><dd>${esc(cs.authority)}${cs.id?` · ${esc(cs.name||'')} (${esc(cs.feature_class||'')}) id ${cs.url?`<a href="${esc(cs.url)}" target="_blank" rel="noopener">${esc(cs.id)}</a>`:esc(cs.id)}`:''}${cs.note?` · ${esc(cs.note)}`:''}</dd>`:''}
    ${(p.crosscheck||[]).length? `<dt>Cross-check</dt><dd>${p.crosscheck.map(c=>`${esc(c.authority)} ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.id)}</a>`:esc(c.id||'')}${c.lat!=null?` (${c.lat.toFixed(3)}, ${c.lon.toFixed(3)})`:''}`).join('; ')}</dd>`:''}
    ${p.gnis_note?`<dt>Gazetteer note</dt><dd>${esc(p.gnis_note)}</dd>`:''}
    ${p.distance_check?`<dt>Distance check</dt><dd>${esc(p.distance_check)}</dd>`:''}
    <dt>Why this point is here</dt><dd>${esc(p.why)}</dd></dl>
    <div class="small"><a href="#/map/${id}">Show on map</a> · <a href="#/place/${id}">Place record</a></div></div>`;
}
function findingCard(id){ const f=IDX.finding[id]; if(!f) return ''; return `<div class="finding ${esc(f.kind)}"><span class="tag">${esc(f.kind)}</span> <b>${esc(f.title)}</b><div>${esc(f.text)}</div>${(f.refs||[]).length?`<div class="small muted">Refs: ${f.refs.map(r=>IDX.doc[r]?docLink(r):IDX.pub[r]?`<a href="#/published/${r}">${esc(IDX.pub[r].short)}</a>`:esc(r)).join('; ')}</div>`:''}</div>`; }

window.App = { go, back:goBack, expandDoc, D, IDX, esc, fmtDate, chip, personPill, docLink, storyLink, blockHTML, modelBlock, piBlock, docCard, placeCard, findingCard, navbar, personLabel, journeyClass, JCOLOR, routeTitle };
window.Pages = {};
document.addEventListener('DOMContentLoaded', ()=>{ const h=currentHash(); stack.push(h); render(h); });
})();
</script>
<script>
/* ============================================================================
   Map view: Leaflet (flat, relief) and D3 orthographic globe; collapsible panel
   ============================================================================ */
(function(){
'use strict';
const {D, IDX, esc, chip, JCOLOR} = App;
const state = { mode:'flat', layers:{j1907:true, j1908:true, trail:true, halos:true, routes:true, labels:true, context:false}, highlight:null, inited:false, globeInited:false };
let map, tileFlat, tileRelief, tileLabels, groups={}, globe=null;
const panel=document.getElementById('panel'), toggle=document.getElementById('panelToggle');
toggle.addEventListener('click', ()=>{ panel.classList.toggle('collapsed'); toggle.style.left = panel.classList.contains('collapsed')? '0':'330px'; setTimeout(()=>{ if(map) map.invalidateSize(); if(globe) globe.resize(); }, 220); });
toggle.style.left='330px';

const placesOf = (journey)=>{ const seen=new Map(); D.stops.filter(s=>s.journey===journey).forEach(s=>{ const p=IDX.place[s.place]; if(!p||!p.has_coords) return; if(!seen.has(p.id)) seen.set(p.id,{place:p, stops:[]}); seen.get(p.id).stops.push(s); }); return [...seen.values()]; };
const TRAIL_PLACES = ['pl_newyork','pl_seattle','pl_washington','pl_garrison'];

function initMap(){
  map = L.map('leaflet', {zoomControl:true, attributionControl:true, worldCopyJump:true}).setView([62, -140], 3);
  tileFlat = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {attribution:'Basemap: Esri Light Gray Canvas (Esri, HERE, Garmin, © OpenStreetMap contributors)', maxZoom:16}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom:16, pane:'shadowPane', opacity:.85})]);
  tileRelief = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {attribution:'Relief: Esri, USGS, NOAA', maxZoom:13});
  tileLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom:13, pane:'shadowPane', opacity:.8});
  tileFlat.addTo(map);
  groups = { halos:L.layerGroup().addTo(map), routes:L.layerGroup().addTo(map), markers:L.layerGroup().addTo(map), labels:L.layerGroup().addTo(map), context:L.layerGroup() };
  drawAll();
  const pts=D.stops.map(st=>IDX.place[st.place]).filter(p=>p&&p.has_coords).map(p=>[p.lat,p.lon]); if(pts.length) map.fitBounds(pts,{padding:[40,40]});
  map.on('zoomend', ()=>updateLabelVisibility());
}
function styleFor(place, journey){
  const c = JCOLOR[journey] || '#6b6760';
  const base = {color:c, weight:2, fillColor:c, fillOpacity:.9, radius:7};
  switch(place.status){
    case 'verified': return base;
    case 'inferred': return {...base, fillOpacity:.15, weight:2.5};
    case 'approximate': return {...base, fillOpacity:.1, dashArray:'3 3', weight:2};
    case 'disputed': return {...base, fillOpacity:.25, weight:2.5};
    default: return base;
  }
}
function popupFor(place){
  const stops = D.stops.filter(s=>s.place===place.id);
  const stories = [...new Set(stops.map(s=>s.story).concat(place.stories||[]))];
  return `<h4>${esc(place.label)}</h4>${chip(place.status)} ${place.tier?`<span class="tag">tier ${place.tier}</span>`:''} <span class="tag">${esc(place.precision)}</span>
    <div class="why">${esc(place.why)}</div>
    ${stops.length?`<ul>${stops.map(s=>`<li><span class="tag ${App.journeyClass(s.journey)}">${s.journey}</span> ${esc(s.date_text)} — ${esc(s.label)} <span class="chip plain ${esc(s.date_precision)}">${esc(s.date_precision)}</span></li>`).join('')}</ul>`:''}
    <div>${stories.map(id=>`<button class="primary small" onclick="App.go('/story/${id}')">Open story: ${esc(IDX.story[id].title.split(':')[0])}</button>`).join(' ')} <a class="small" href="#/place/${place.id}">place record</a></div>`;
}
function drawAll(){
  Object.values(groups).forEach(g=>g.clearLayers());
  const drawn=new Set();
  ['1907','1908'].forEach(j=>{
    if(!state.layers['j'+j]) return;
    // routes
    if(state.layers.routes){
      D.segments.filter(g=>g.journey===j).forEach(g=>{
        const a=IDX.place[IDX.stop[g.frm].place], b=IDX.place[IDX.stop[g.to].place]; if(!a||!b||!a.has_coords||!b.has_coords) return;
        if(a.id===b.id) return;
        const dash = g.mode_status==='stated'? null : g.mode_status==='not_stated'? '8 6' : '2 6';
        const posUnsure = a.status==='approximate'||b.status==='approximate'||a.status==='disputed'||b.status==='disputed';
        const line=L.polyline(gcPath([a.lat,a.lon],[b.lat,b.lon]), {color:JCOLOR[j], weight: posUnsure?1.6:2.4, opacity:.85, dashArray: dash, lineCap:'round'});
        line.bindTooltip(`<b>${esc(IDX.stop[g.frm].label)} → ${esc(IDX.stop[g.to].label)}</b><br>mode: ${esc(g.mode)} <i>(${esc(g.mode_status.replace('_',' '))})</i><br>geometry: ${esc(g.geometry)} — not traced<br><span class="small">source: ${esc(g.source.ref)} ${esc(g.source.locator||'')}</span>`, {sticky:true, className:'lbl', opacity:1});
        groups.routes.addLayer(line);
      });
    }
    placesOf(j).forEach(({place, stops})=>{
      if(state.layers.halos && place.radius_km && place.status!=='verified'){
        groups.halos.addLayer(L.circle([place.lat,place.lon], {radius:place.radius_km*1000, color:JCOLOR[j], weight:1, opacity:.5, fillColor:JCOLOR[j], fillOpacity:.08, dashArray:'4 4', interactive:false}));
      }
      const key=place.id+j;
      const both = drawn.has(place.id);
      const st=styleFor(place,j); if(both){ st.radius=4; st.weight=1.5; }
      let m;
      if(place.status==='disputed'){ m=L.marker([place.lat,place.lon],{icon:L.divIcon({className:'', html:`<div class="marker-disputed" style="border-color:${JCOLOR[j]};${both?'width:10px;height:10px':''}"></div>`, iconSize:[14,14], iconAnchor:[7,7]})}); }
      else m=L.circleMarker([place.lat,place.lon], st);
      m.bindPopup(popupFor(place), {maxWidth:340});
      m.on('click', ()=>highlightStop(stops[0].id, false));
      groups.markers.addLayer(m); drawn.add(place.id);
      if(state.layers.labels && !both){
        const lab=L.marker([place.lat,place.lon],{icon:L.divIcon({className:'lbl '+App.journeyClass(j), html:esc(place.label.replace(/\s*\(.*$/,'').replace(/ — .*$/,'')), iconAnchor:[-9,8]}), interactive:false, keyboard:false});
        lab._minZoom = place.status==='verified' && ['pl_newyork','pl_seattle','pl_nome','pl_dawson','pl_elephant_point','pl_keewalik','pl_stmichael','pl_montreal'].includes(place.id)? 0 : 5;
        groups.labels.addLayer(lab);
      }
    });
  });
  if(state.layers.trail){
    TRAIL_PLACES.forEach(id=>{ const p=IDX.place[id]; if(!p||drawn.has(id)) { if(p && !drawn.has(id)){} else return; }
      if(drawn.has(id)) return;
      const m=L.circleMarker([p.lat,p.lon], {color:'#6b6760', weight:1.5, fillColor:'#fff', fillOpacity:1, radius:5}); m.bindPopup(popupFor(p),{maxWidth:340}); groups.markers.addLayer(m); drawn.add(id);
      if(state.layers.labels) groups.labels.addLayer(L.marker([p.lat,p.lon],{icon:L.divIcon({className:'lbl', html:esc(p.label), iconAnchor:[-8,8]}), interactive:false}));
    });
  }
  if(state.layers.context){
    D.context_arcs.forEach(a=>{ const p=IDX.place[a.frm], q=IDX.place[a.to]; groups.context.addLayer(L.polyline(gcPath([p.lat,p.lon],[q.lat,q.lon]), {color:'#6d4c9f', weight:1.5, dashArray:'6 6', opacity:.8}).bindTooltip(esc(a.label)+' — context (Tale §1); schematic', {sticky:true,className:'lbl'})); });
    ['pl_lena_mouth','pl_yakutsk','pl_stpetersburg'].forEach(id=>{ const p=IDX.place[id]; const m=L.circleMarker([p.lat,p.lon],{color:'#6d4c9f',weight:2,fillColor:'#6d4c9f',fillOpacity:p.status==='verified'?.9:.1, dashArray:p.status==='approximate'?'3 3':null, radius:6}); m.bindPopup(popupFor(p),{maxWidth:340}); groups.context.addLayer(m); if(p.radius_km>20) groups.context.addLayer(L.circle([p.lat,p.lon],{radius:p.radius_km*1000,color:'#6d4c9f',weight:1,fillOpacity:.06,dashArray:'4 4',interactive:false})); groups.context.addLayer(L.marker([p.lat,p.lon],{icon:L.divIcon({className:'lbl',html:esc(p.label.split(' (')[0]),iconAnchor:[-8,8]}),interactive:false})); });
    if(!map.hasLayer(groups.context)) groups.context.addTo(map);
  } else if(map.hasLayer(groups.context)) map.removeLayer(groups.context);
  updateLabelVisibility();
}
function updateLabelVisibility(){ if(!map) return; const z=map.getZoom(); groups.labels.eachLayer(l=>{ const el=l.getElement(); if(!el) return; el.style.display = (l._minZoom==null || z>=l._minZoom)? '':'none'; }); }
/* great-circle path sampled for Leaflet (schematic connector) */
function gcPath(a,b){ const toR=Math.PI/180, toD=180/Math.PI; const [lat1,lon1]=[a[0]*toR,a[1]*toR],[lat2,lon2]=[b[0]*toR,b[1]*toR]; const d=2*Math.asin(Math.sqrt(Math.sin((lat2-lat1)/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon2-lon1)/2)**2)); if(d<1e-6) return [a,b]; const n=Math.max(2,Math.ceil(d*toD/1.5)); const pts=[]; for(let i=0;i<=n;i++){ const f=i/n; const A=Math.sin((1-f)*d)/Math.sin(d), B=Math.sin(f*d)/Math.sin(d); const x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2), y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2), z=A*Math.sin(lat1)+B*Math.sin(lat2); pts.push([Math.atan2(z,Math.sqrt(x*x+y*y))*toD, Math.atan2(y,x)*toD]); } return pts; }

function setMode(mode){
  state.mode=mode; document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  const g=document.getElementById('globe'), l=document.getElementById('leaflet');
  if(mode==='globe'){ l.classList.add('hidden'); g.classList.remove('hidden'); initGlobe(); globe.resize(); globe.draw(); }
  else { g.classList.add('hidden'); l.classList.remove('hidden'); if(mode==='relief'){ if(map.hasLayer(tileFlat)) map.removeLayer(tileFlat); tileRelief.addTo(map); tileLabels.addTo(map); } else { if(map.hasLayer(tileRelief)) map.removeLayer(tileRelief); if(map.hasLayer(tileLabels)) map.removeLayer(tileLabels); tileFlat.addTo(map); } setTimeout(()=>map.invalidateSize(),50); }
  renderLegend();
}
function highlightStop(stopId, fly=true){
  state.highlight=stopId; document.querySelectorAll('#stoplist li').forEach(li=>li.classList.toggle('active', li.dataset.stop===stopId));
  const s=IDX.stop[stopId]; if(!s) return; const p=IDX.place[s.place]; if(!p||!p.has_coords) return;
  if(state.mode==='globe'){ globe.focus(p); return; }
  if(fly) map.flyTo([p.lat,p.lon], Math.max(map.getZoom(), p.radius_km>40?6:8), {duration:.8});
  groups.markers.eachLayer(m=>{ const ll=m.getLatLng(); if(Math.abs(ll.lat-p.lat)<1e-6 && Math.abs(ll.lng-p.lon)<1e-6 && fly) m.openPopup(); });
}
function renderPanel(){
  const el=document.getElementById('panelInner');
  const stopsHTML = ['1907','1908'].map(j=>`<span class="grp ${App.journeyClass(j)}">${j} journey</span>`+D.stops.filter(s=>s.journey===j).map(s=>`<li data-stop="${s.id}" class="${App.journeyClass(j)}" onclick="MapView.highlight('${s.id}')" title="${esc(s.date_text)}"><span class="d">${esc(App.fmtDate(s.date_start))}</span><span>${esc(s.label)} ${chip(s.status,'')}</span></li>`).join('')).join('');
  el.innerHTML=`
   <div class="section"><h3>View</h3><div class="seg" id="modeSeg"><button data-mode="flat" class="active" onclick="MapView.setMode('flat')">Flat</button><button data-mode="relief" onclick="MapView.setMode('relief')">Relief</button><button data-mode="globe" onclick="MapView.setMode('globe')">Globe</button></div></div>
   <div class="section"><h3>Layers</h3>
     <label><input type="checkbox" data-layer="j1907" checked><span class="sw" style="background:${JCOLOR['1907']}"></span>1907 reconnaissance (Yukon route)</label>
     <label><input type="checkbox" data-layer="j1908" checked><span class="sw" style="background:${JCOLOR['1908']}"></span>1908 excavation (overland route)</label>
     <label><input type="checkbox" data-layer="trail" checked><span class="sw" style="background:#6b6760;height:.2rem"></span>Paper-trail nodes (New York, Seattle, Washington, Garrison)</label>
     <label><input type="checkbox" data-layer="routes" checked>Route connectors (schematic)</label>
     <label><input type="checkbox" data-layer="halos" checked>Uncertainty halos</label>
     <label><input type="checkbox" data-layer="labels" checked>Place labels</label>
     <label><input type="checkbox" data-layer="context"><span class="sw" style="background:#6d4c9f"></span>Context: Adams mammoth, Lena → St Petersburg (Tale §1)</label>
   </div>
   <div class="section"><h3>Unlocated (not drawn)</h3><div class="small">${D.places.filter(p=>!p.has_coords && !p.mentioned_only).map(p=>`<a href="#/place/${p.id}">${esc(p.label)}</a>`).join('<br>')}</div></div>
   <div class="section"><h3>Chronological stops</h3><ul id="stoplist">${stopsHTML}</ul></div>
   <div class="section small muted">Marker style encodes source status; halos show the uncertainty radius recorded for each place. Click a stop for its evidence and story.</div>`;
  el.querySelectorAll('input[data-layer]').forEach(cb=>cb.addEventListener('change', ()=>{ state.layers[cb.dataset.layer]=cb.checked; drawAll(); if(globe) globe.draw(); }));
}
function renderLegend(){
  const sw=(fill,stroke,dash,extra='')=>`<svg width="18" height="18"><circle cx="9" cy="9" r="6" fill="${fill}" stroke="${stroke}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''} ${extra}/></svg>`;
  document.getElementById('maplegend').innerHTML=`
    <div class="row"><b>Source status of a place</b></div>
    <div class="row">${sw('#1f6fa3','#1f6fa3')} verified — gazetteer match on the attested name</div>
    <div class="row">${sw('rgba(31,111,163,.15)','#1f6fa3')} inferred — identification inferred from the described route</div>
    <div class="row">${sw('rgba(31,111,163,.1)','#1f6fa3','3 3')} approximate — placed from distances/directions</div>
    <div class="row"><svg width="18" height="18"><rect x="5" y="5" width="8" height="8" fill="#fff" stroke="#a23b3b" stroke-width="2" transform="rotate(45 9 9)"/></svg> disputed — sources disagree</div>
    <div class="row"><svg width="18" height="18"><circle cx="9" cy="9" r="7" fill="rgba(31,111,163,.08)" stroke="#1f6fa3" stroke-dasharray="3 3"/></svg> halo — uncertainty radius (km in record)</div>
    <div class="row" style="margin-top:.3rem"><b>Connectors (all schematic)</b></div>
    <div class="row"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#c0603a" stroke-width="2.5"/></svg> mode stated in a source</div>
    <div class="row"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#c0603a" stroke-width="2.5" stroke-dasharray="8 6"/></svg> mode not stated</div>
    <div class="row"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#c0603a" stroke-width="2.5" stroke-dasharray="2 6"/></svg> mode inferred from sequence</div>
    <div class="row"><span class="sw" style="background:#1f6fa3;width:14px;height:3px;display:inline-block"></span> 1907 &nbsp; <span class="sw" style="background:#c0603a;width:14px;height:3px;display:inline-block"></span> 1908</div>`;
}
/* ------------------------------------------------------------ globe (D3 orthographic) */
function initGlobe(){
  if(globe) return;
  const el=document.getElementById('globe');
  const svg=d3.select(el).append('svg');
  const projection=d3.geoOrthographic().rotate([150, -58]).clipAngle(90);
  const path=d3.geoPath(projection);
  let land=null, W=0,H=0, scale0=1;
  const gSphere=svg.append('g'), gLand=svg.append('g'), gGrat=svg.append('g'), gData=svg.append('g');
  const grat=d3.geoGraticule10();
  function resize(){ W=el.clientWidth; H=el.clientHeight; if(!W||!H) return; scale0=Math.min(W,H)/2.15; projection.translate([W/2,H/2]); if(!projection._userScale) projection.scale(scale0); draw(); }
  function draw(){
    if(!W) return;
    gSphere.selectAll('path').data([{type:'Sphere'}]).join('path').attr('d', path).style('fill','var(--globe-sea)').style('stroke','var(--globe-coast)');
    gGrat.selectAll('path').data([grat]).join('path').attr('d', path).attr('fill','none').style('stroke','var(--rule)').attr('stroke-width',.5);
    if(land) gLand.selectAll('path').data([land]).join('path').attr('d', path).style('fill','var(--globe-land)').style('stroke','var(--globe-coast)').attr('stroke-width',.6);
    const feats=[];
    ['1907','1908'].forEach(j=>{ if(!state.layers['j'+j]) return;
      if(state.layers.routes) D.segments.filter(g=>g.journey===j).forEach(g=>{ const a=IDX.place[IDX.stop[g.frm].place], b=IDX.place[IDX.stop[g.to].place]; if(!a||!b||!a.has_coords||!b.has_coords||a.id===b.id) return; feats.push({type:'Feature', kind:'route', j, g, geometry:{type:'LineString', coordinates:[[a.lon,a.lat],[b.lon,b.lat]]}}); });
    });
    if(state.layers.context) D.context_arcs.forEach(a=>{ const p=IDX.place[a.frm], q=IDX.place[a.to]; feats.push({type:'Feature', kind:'ctx', a, geometry:{type:'LineString', coordinates:[[p.lon,p.lat],[q.lon,q.lat]]}}); });
    gData.selectAll('path.route').data(feats, (d,i)=>i).join('path').attr('class','route').attr('d', path).attr('fill','none')
      .attr('stroke', d=>d.kind==='ctx'?'#6d4c9f':JCOLOR[d.j]).attr('stroke-width', d=>d.kind==='ctx'?1.4:2)
      .attr('stroke-dasharray', d=>d.kind==='ctx'?'6 5': d.g.mode_status==='stated'?null: d.g.mode_status==='not_stated'?'7 5':'2 5').attr('opacity',.9)
      .append('title').text(d=>d.kind==='ctx'? d.a.label+' (context, schematic)' : `${IDX.stop[d.g.frm].label} → ${IDX.stop[d.g.to].label}: ${d.g.mode} (${d.g.mode_status}); schematic`);
    // halos
    const halos=[]; const pts=[]; const seen=new Set();
    ['1907','1908'].forEach(j=>{ if(!state.layers['j'+j]) return; placesOf(j).forEach(({place,stops})=>{ if(seen.has(place.id)) return; seen.add(place.id); pts.push({place,j,stops}); if(state.layers.halos && place.radius_km && place.status!=='verified') halos.push({place,j}); }); });
    if(state.layers.trail) TRAIL_PLACES.forEach(id=>{ const p=IDX.place[id]; if(p&&!seen.has(id)){ seen.add(id); pts.push({place:p,j:null,stops:[]}); } });
    if(state.layers.context) ['pl_lena_mouth','pl_yakutsk','pl_stpetersburg'].forEach(id=>{ const p=IDX.place[id]; pts.push({place:p,j:'ctx',stops:[]}); if(p.radius_km>20) halos.push({place:p,j:'ctx'}); });
    const circle=d3.geoCircle();
    gData.selectAll('path.halo').data(halos,(d)=>d.place.id).join('path').attr('class','halo').attr('d', d=>path(circle.center([d.place.lon,d.place.lat]).radius(d.place.radius_km/111.2)())).attr('fill', d=>d.j==='ctx'?'rgba(109,76,159,.08)':(d.j==='1907'?'rgba(31,111,163,.1)':'rgba(192,96,58,.1)')).attr('stroke', d=>d.j==='ctx'?'#6d4c9f':JCOLOR[d.j]).attr('stroke-dasharray','3 3').attr('stroke-width',.8);
    const vis = d=>{ const r=projection.rotate(); const c=[-r[0],-r[1]]; return d3.geoDistance([d.place.lon,d.place.lat], c) < Math.PI/2; };
    const sel=gData.selectAll('g.pt').data(pts, d=>d.place.id).join(enter=>{ const g=enter.append('g').attr('class','pt').style('cursor','pointer'); g.append('circle'); g.append('text'); return g; });
    sel.attr('display', d=>vis(d)?null:'none').attr('transform', d=>{ const xy=projection([d.place.lon,d.place.lat]); return xy?`translate(${xy[0]},${xy[1]})`:null; })
      .on('click', (ev,d)=>{ const s=D.stops.find(x=>x.place===d.place.id); const story = s? s.story : (d.place.stories||[])[0]; if(story) App.go('/story/'+story); })
      .select('circle').attr('r', d=>d.j==='ctx'?5: d.j? (d.place.status==='verified'?5.5:6):4).attr('fill', d=>{ const c=d.j==='ctx'?'#6d4c9f':d.j?JCOLOR[d.j]:'#fff'; return d.place.status==='verified'||!d.j? c : 'rgba(255,255,255,.6)'; }).attr('stroke', d=>d.j==='ctx'?'#6d4c9f':d.j?JCOLOR[d.j]:'#6b6760').attr('stroke-width',2).attr('stroke-dasharray', d=>d.place.status==='approximate'?'2 2':null);
    sel.select('text').text(d=>d.place.label.replace(/\s*\(.*$/,'').replace(/ — .*$/,'')).attr('x',8).attr('y',4).attr('font-size',11).attr('font-family','var(--sans)').style('fill','var(--ink-2)').attr('paint-order','stroke').style('stroke','var(--paper)').attr('stroke-width',3)
      .attr('display', d=> (projection.scale()/scale0>1.8 || ['pl_newyork','pl_seattle','pl_nome','pl_dawson','pl_elephant_point','pl_stpetersburg','pl_lena_mouth','pl_keewalik'].includes(d.place.id))? null:'none');
    sel.select('circle').append('title');
    sel.selectAll('title').text(d=>`${d.place.label} — ${d.place.status}; ${d.place.precision}${d.place.radius_km?`; halo ${d.place.radius_km} km`:''}`);
  }
  svg.call(d3.drag().on('start', ()=>svg.style('cursor','grabbing')).on('drag', (ev)=>{ const r=projection.rotate(); const k=75/projection.scale(); projection.rotate([r[0]+ev.dx*k, Math.max(-90,Math.min(90, r[1]-ev.dy*k))]); draw(); }).on('end', ()=>svg.style('cursor','grab')));
  svg.call(d3.zoom().scaleExtent([.7,8]).on('zoom', (ev)=>{ projection._userScale=true; projection.scale(scale0*ev.transform.k); draw(); }).filter(ev=>ev.type==='wheel'||ev.type==='dblclick'));
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(topo=>{ land=topojson.feature(topo, topo.objects.land); draw(); }).catch(()=>{ gLand.append('text').attr('x',12).attr('y',24).attr('fill','#a23b3b').attr('font-size',12).text('Land outlines could not be loaded (world-atlas CDN unavailable); routes and points are still drawn.'); });
  function focus(p){ d3.transition().duration(900).tween('rotate', ()=>{ const r=d3.interpolate(projection.rotate(), [-p.lon, -p.lat]); return t=>{ projection.rotate(r(t)); draw(); }; }); }
  globe={resize, draw, focus};
  window.addEventListener('resize', resize);
  resize();
}
function show(placeId){
  if(!state.inited){ state.inited=true; if(typeof L==='undefined'){ document.getElementById('leaflet').innerHTML='<div class="page notice">Leaflet could not be loaded from the CDN; the map requires network access. The Archive, Timeline, Network and Story tabs work offline.</div>'; return; } initMap(); renderPanel(); renderLegend(); }
  setTimeout(()=>{ if(map) map.invalidateSize(); if(globe) globe.resize(); }, 30);
  if(placeId && IDX.place[placeId]){ const p=IDX.place[placeId]; if(p.has_coords){ const s=D.stops.find(x=>x.place===placeId); if(s) highlightStop(s.id); else if(map){ map.flyTo([p.lat,p.lon], 6); } } }
}
window.MapView = { show, setMode, highlight:highlightStop, pauseGlobe(){}, state };
})();
</script>
<script>
/* ============================================================================
   Story pages, story index, place records, full Tale, Cast
   ============================================================================ */
(function(){
'use strict';
const {D, IDX, esc, chip, personPill, docLink, storyLink, blockHTML, modelBlock, piBlock, docCard, placeCard, findingCard, navbar, fmtDate} = App;
const page=document.getElementById('pageview');
let minimap=null, miniTimer=null;
function destroyMini(){ if(miniTimer){ clearTimeout(miniTimer); miniTimer=null; } if(minimap){ try{minimap.remove();}catch(e){} minimap=null; } }

Pages.storyIndex = function(){
  destroyMini();
  const phases=[['prologue','Prologue (the PI’s framing)'],['paper-trail','The paper trail, 1898–July 1907'],['journey-1907','The 1907 reconnaissance'],['interlude','Interlude, winter 1907–08'],['journey-1908','The 1908 excavation'],['epilogue','Epilogue, 1909–1930']];
  page.innerHTML=`<div class="page">${navbar({close:false})}<h1>Story</h1><p class="subtitle">Twenty-five pages built on the principal investigator’s narrative, enriched from the correspondence. Each page lists the people and documents behind it and states what is inferred.</p>
   ${phases.map(([k,lab])=>`<h2>${esc(lab)}</h2><ol class="toc">${D.stories.filter(s=>s.phase===k).map(s=>`<li><a href="#/story/${s.id}">${esc(s.title)}</a>${s.stops.length?` <span class="muted small">(${s.stops.length} stop${s.stops.length>1?'s':''})</span>`:''}</li>`).join('')}</ol>`).join('')}
   <h2>Also</h2><p><a href="#/tale">Read the Tale of Two Mammoths in full</a> · <a href="#/cast">The PI’s Cast of Characters</a> · <a href="#/method">How this reconstruction was made</a></p></div>`;
};

Pages.story = function([id]){
  destroyMini();
  const s=IDX.story[id]; if(!s){ page.innerHTML='<div class="page">'+navbar()+'<h1>Story not found</h1></div>'; return; }
  const stops=s.stops.map(x=>IDX.stop[x]).filter(Boolean);
  const places=s.places.map(x=>IDX.place[x]).filter(Boolean);
  const dateRange = stops.length? `${fmtDate(stops[0].date_start)} – ${fmtDate(stops[stops.length-1].date_end)}`: '';
  const people=[...new Set(s.people.concat(...s.docs.map(d=>(IDX.doc[d]||{}).senders||[]), ...s.docs.map(d=>(IDX.doc[d]||{}).recipients||[])))].filter(p=>IDX.person[p]);
  const sortedDocs=[...s.docs].filter(d=>IDX.doc[d]).sort((a,b)=>IDX.doc[a].order-IDX.doc[b].order);
  const mapLink = places.find(p=>p.has_coords);
  page.innerHTML=`<div class="page">
    ${navbar({extra: `${s.prev?`<button class="ghost" onclick="App.go('/story/${s.prev}')">‹ Previous</button>`:''}${s.next?`<button class="ghost" onclick="App.go('/story/${s.next}')">Next ›</button>`:''}<a class="small" href="#/stories">Story index</a>`, right: mapLink?`<button onclick="App.go('/map/${mapLink.id}')">Open on map</button>`:''})}
    <div class="phase ${esc(s.phase).replace('journey-','j')}">${esc(s.phase.replace('journey-','journey '))} · page ${s.order+1} of ${D.stories.length}</div>
    <h1>${esc(s.title)}</h1><p class="subtitle">${esc(s.subtitle)}${dateRange?` · <span class="muted">${esc(dateRange)}</span>`:''}</p>
    ${places.some(p=>p.has_coords)?`<div class="minimap" id="minimap"></div>`:''}
    ${stops.length?`<h2>When</h2><table class="data"><thead><tr><th>Stop</th><th>Date as attested</th><th>Precision</th><th>Status</th><th>Sources</th></tr></thead><tbody>${stops.map(st=>`<tr><td><span class="tag ${App.journeyClass(st.journey)}">${st.journey}</span> ${esc(st.label)}</td><td>${esc(st.date_text)}</td><td><span class="chip plain ${esc(st.date_precision)}">${esc(st.date_precision)}</span></td><td>${chip(st.status)}</td><td class="small">${st.sources.map(sr=>`${IDX.doc[sr.ref]?docLink(sr.ref):IDX.pub[sr.ref]?`<a href="#/published/${sr.ref}">${esc(IDX.pub[sr.ref].short)}</a>`:esc(sr.ref)}: ${esc(sr.locator)}`).join('<br>')}<br><span class="muted">${esc(st.why)}</span></td></tr>`).join('')}</tbody></table>`:''}
    ${places.length?`<h2>Where</h2><div class="grid2">${places.map(p=>placeCard(p.id)).join('')}</div>`:''}
    <h2>The principal investigator’s narrative</h2>
    ${s.tale_excerpts.length? s.tale_excerpts.map(e=>piBlock(e.text, e.para)).join('') : `<div class="notice">The Tale does not narrate this part of the journey. The page rests on the correspondence and the PI’s timeline alone.</div>`}
    ${s.model_note? `<h3>Model note</h3>${modelBlock(s.model_note)}`:''}
    ${sortedDocs.length?`<h2>From the correspondence <span class="muted small">(${sortedDocs.length} item${sortedDocs.length>1?'s':''}; blocks are typed: verbatim / researcher’s summary / editorial note)</span></h2>${sortedDocs.map(d=>docCard(d)).join('')}`:'<h2>From the correspondence</h2><div class="notice">No archival item in the transcription file bears directly on this stop. This is itself a finding: the stop is known only from the published itinerary as read by the PI.</div>'}
    <h2>People involved</h2><div>${people.map(personPill).join(' ')}</div>
    ${s.findings.length?`<h2>Discrepancies and absences</h2>${s.findings.map(findingCard).join('')}`:''}
    ${s.published.length?`<h2>Published sources cited</h2><ul>${s.published.map(p=>`<li><a href="#/published/${p}">${esc(IDX.pub[p].short)}</a> <span class="muted small">— ${esc(IDX.pub[p].type)}; full text not provided</span></li>`).join('')}</ul>`:''}
    <div class="footer-nav">${s.prev?`<a href="#/story/${s.prev}">‹ ${esc(IDX.story[s.prev].title)}</a>`:'<span></span>'}${s.next?`<a href="#/story/${s.next}" style="text-align:right">${esc(IDX.story[s.next].title)} ›</a>`:'<span></span>'}</div>
  </div>`;
  if(places.some(p=>p.has_coords) && typeof L!=='undefined'){
    miniTimer=setTimeout(()=>{ miniTimer=null; const el=document.getElementById('minimap'); if(!el || el._leaflet_id) return; minimap=L.map(el,{zoomControl:false, attributionControl:false, scrollWheelZoom:false, dragging:true});
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(minimap);
      const b=[]; places.filter(p=>p.has_coords).forEach(p=>{ const j = (stops.find(st=>st.place===p.id)||{}).journey; const c=App.JCOLOR[j]||'#6b6760'; if(p.radius_km&&p.status!=='verified') L.circle([p.lat,p.lon],{radius:p.radius_km*1000,color:c,weight:1,fillOpacity:.08,dashArray:'4 4'}).addTo(minimap); L.circleMarker([p.lat,p.lon],{color:c,fillColor:c,fillOpacity:p.status==='verified'?.9:.15,radius:6,weight:2,dashArray:p.status==='approximate'?'3 3':null}).bindTooltip(p.label).addTo(minimap); b.push([p.lat,p.lon]); });
      // schematic connectors between consecutive stops on this page
      for(let i=1;i<stops.length;i++){ const a=IDX.place[stops[i-1].place], c=IDX.place[stops[i].place]; if(a&&c&&a.has_coords&&c.has_coords&&a.id!==c.id) L.polyline([[a.lat,a.lon],[c.lat,c.lon]],{color:App.JCOLOR[stops[i].journey]||'#6b6760',weight:2,dashArray:'6 4',opacity:.7}).addTo(minimap); }
      if(b.length===1) minimap.setView(b[0], 7); else minimap.fitBounds(b,{padding:[30,30],maxZoom:8});
    },30);
  }
};

Pages.place = function([id]){
  destroyMini();
  const p=IDX.place[id]; if(!p){ page.innerHTML='<div class="page">'+navbar()+'<h1>Place not found</h1></div>'; return; }
  const stops=D.stops.filter(s=>s.place===id); const docs=D.documents.filter(d=>(d.place||'').toLowerCase().includes(p.label.split(' ')[0].toLowerCase()) );
  page.innerHTML=`<div class="page">${navbar({right: p.has_coords?`<button onclick="App.go('/map/${id}')">Show on map</button>`:''})}
    <div class="phase">place record · gazetteer tier ${p.tier||'—'}</div><h1>${esc(p.label)}</h1>
    ${placeCard(id)}
    ${stops.length?`<h2>Stops at this place</h2><table class="data"><thead><tr><th>Journey</th><th>Stop</th><th>Date as attested</th><th>Precision</th><th>Status</th><th>Story</th></tr></thead><tbody>${stops.map(st=>`<tr><td><span class="tag ${App.journeyClass(st.journey)}">${st.journey}</span></td><td>${esc(st.label)}</td><td>${esc(st.date_text)}</td><td><span class="chip plain ${esc(st.date_precision)}">${esc(st.date_precision)}</span></td><td>${chip(st.status)}</td><td>${storyLink(st.story)}</td></tr>`).join('')}</tbody></table>`:'<p class="notice">No itinerary stop is recorded at this place; it appears in the record as a correspondence node, a mention, or an unlocated reference.</p>'}
    ${p.stories.length?`<h2>Story pages</h2><ul>${p.stories.map(s=>`<li>${storyLink(s)}</li>`).join('')}</ul>`:''}
    ${docs.length?`<h2>Letters written here</h2><ul>${docs.map(d=>`<li>${docLink(d.id)} <span class="muted small">${esc(d.date_text)}</span></li>`).join('')}</ul>`:''}
    ${D.findings.filter(f=>(f.places||[]).includes(id)).length?`<h2>Findings</h2>${D.findings.filter(f=>(f.places||[]).includes(id)).map(f=>findingCard(f.id)).join('')}`:''}
  </div>`;
};

Pages.tale = function([para]){
  destroyMini();
  let section=null;
  page.innerHTML=`<div class="page">${navbar()}<div class="phase">principal investigator’s text · unpublished talk · quoted in full</div>
   <h1>Time, Temperature, and Tissue in the Circumpolar North: A Tale of Two Mammoths</h1><p class="subtitle">Rebecca Woods, University of Toronto · MIT Seminar in Agriculture and the Environment · 20 September 2019</p>
   <p class="notice">Reproduced verbatim from the file supplied by the lab (including the author’s bracketed notes, struck passages and footnotes). Paragraph numbers (¶) are added by the build for citation; they are not the author’s. Footnote numbers link to the notes at the end.</p>
   <div class="serif" style="font-size:1.05rem">${D.tale.map(t=>{ let h=''; if(t.section!==section){ section=t.section; h+=`<h2 id="sec-${esc(section)}">${esc(section)}</h2>`; } return h+`<p id="${t.id}" style="position:relative"><span class="muted small" style="position:absolute;left:-3.2rem;font-family:var(--sans)">¶${t.id.replace('t','')}</span>${t.html}</p>`; }).join('')}</div>
   <h2>Notes</h2><ol class="small serif">${D.tale_footnotes.map(f=>`<li id="fn${f.n}" value="${f.n}">${f.html}</li>`).join('')}</ol></div>`;
  page.querySelectorAll('sup.fnref').forEach(s=>s.addEventListener('click', ()=>{ const el=document.getElementById('fn'+s.dataset.fn); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='var(--annotation-soft)'; setTimeout(()=>el.style.background='',1500);} }));
  if(para){ setTimeout(()=>{ const el=document.getElementById(para); if(el){ el.scrollIntoView({block:'center'}); el.style.background='var(--j1907-soft)'; } },50); }
};
Pages.cast = function(){
  destroyMini();
  const match = name=>{ const n=name.toLowerCase(); return D.people.find(p=>n.includes(p.sort.toLowerCase().split(',')[0]) || p.label.toLowerCase().includes(n.split(' ').pop().toLowerCase())); };
  page.innerHTML=`<div class="page">${navbar()}<div class="phase">principal investigator’s document · verbatim</div><h1>Cast of Characters</h1><p class="notice">The PI’s one-line characterisations, reproduced as written. Each name links to the prosopographical record built from the correspondence, where the PI’s line is quoted again beside the attested roles.</p>
   <dl class="kv" style="grid-template-columns:200px 1fr">${D.cast.map(c=>{ const p=match(c.name); return `<dt><b>${p?`<a href="#/person/${p.id}">${esc(c.name)}</a>`:esc(c.name)}</b></dt><dd class="serif">${esc(c.text)}</dd>`; }).join('')}</dl></div>`;
};
})();

<script>
/* ============================================================================
   Archive (primary-source reader), person pages, network analysis
   ============================================================================ */
(function(){
'use strict';
const {D, IDX, esc, chip, personPill, docLink, storyLink, blockHTML, modelBlock, findingCard, navbar, fmtDate, personLabel} = App;
const page=document.getElementById('pageview');
const AF = { q:'', folder:'', year:'', type:'', who:'' };
const folders=[...new Set(D.documents.map(d=>d.archive).filter(Boolean))];
const years=[...new Set(D.documents.map(d=>d.year).filter(Boolean))].sort();
const correspondents=[...new Set(D.documents.flatMap(d=>[...(d.senders||[]),...(d.recipients||[])]))].map(id=>({id,label:personLabel(id)})).sort((a,b)=>a.label.localeCompare(b.label));

function docMatches(d){
  if(AF.folder && d.archive!==AF.folder) return false;
  if(AF.year && String(d.year)!==AF.year) return false;
  if(AF.type){ if(AF.type==='verbatim' && !(d.block_counts||{}).verbatim) return false; if(AF.type==='summary-only' && (d.block_counts||{}).verbatim) return false; if(AF.type==='enclosure' && !d.enclosed_in) return false; if(AF.type==='copy' && !/copy|draft|excerpt|telegram/i.test(d.form)) return false; }
  if(AF.who && !(d.senders||[]).includes(AF.who) && !(d.recipients||[]).includes(AF.who)) return false;
  if(AF.q){ const q=AF.q.toLowerCase(); const hay=(d.title+' '+d.date_text+' '+d.blocks.map(b=>b.text).join(' ')).toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}
Pages.archive = function([id]){
  if(!document.getElementById('archive')){
    page.innerHTML=`<div id="archive"><div class="list">
      <div class="pagenav" style="margin-bottom:.4rem"><button class="ghost" onclick="App.back()">← Back</button><span class="spacer"></span><span class="small muted" id="doccount"></span></div>
      <div class="filters">
        <input type="search" id="afq" placeholder="Search text of all ${D.documents.length} items…" value="${esc(AF.q)}">
        <select id="affolder"><option value="">All folders</option>${folders.map(f=>`<option ${AF.folder===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
        <select id="afyear"><option value="">All years</option>${years.map(y=>`<option ${AF.year===String(y)?'selected':''}>${y}</option>`).join('')}</select>
        <select id="afwho"><option value="">Any correspondent</option>${correspondents.map(c=>`<option value="${c.id}" ${AF.who===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select>
        <select id="aftype"><option value="">Any form</option><option value="verbatim" ${AF.type==='verbatim'?'selected':''}>has verbatim text</option><option value="summary-only" ${AF.type==='summary-only'?'selected':''}>summary only (no verbatim)</option><option value="copy" ${AF.type==='copy'?'selected':''}>copies, drafts, telegrams, excerpts</option><option value="enclosure" ${AF.type==='enclosure'?'selected':''}>enclosures</option></select>
      </div>
      <ul id="doclist"></ul></div><div class="reader" id="reader"></div></div>`;
    document.getElementById('afq').addEventListener('input', e=>{AF.q=e.target.value; renderList();});
    [['affolder','folder'],['afyear','year'],['afwho','who'],['aftype','type']].forEach(([el,k])=>document.getElementById(el).addEventListener('change', e=>{AF[k]=e.target.value; renderList();}));
  }
  renderList(id);
  renderReader(id);
};
function renderList(active){
  const ul=document.getElementById('doclist'); if(!ul) return;
  const docs=D.documents.filter(docMatches);
  document.getElementById('doccount').textContent=`${docs.length} of ${D.documents.length} items`;
  let yr=null; ul.innerHTML=docs.map(d=>{ let h=''; if(d.year!==yr){ yr=d.year; h+=`<span class="yr">${yr||'undated'}</span>`; } return h+`<li data-id="${d.id}" class="${d.id===active?'active':''}" onclick="App.go('/archive/${d.id}')"><span class="d">${esc(d.date_text.length>22?fmtDate(d.date):d.date_text)}</span> <span class="t">${esc(d.title)}</span><span class="small muted">${esc(d.form)}${d.enclosed_in?' · enclosure':''} · ${Object.entries(d.block_counts||{}).map(([k,v])=>`${v} ${k[0]}`).join(' ')}</span></li>`; }).join('');
  const a=ul.querySelector('li.active'); if(a) a.scrollIntoView({block:'nearest'});
}
function renderReader(id){
  const r=document.getElementById('reader'); if(!r) return;
  if(!id){ r.innerHTML=`<h1>Archive</h1><p class="subtitle">The correspondence of the Alaskan Mammoth Expeditions, 1906–1930, as transcribed by the principal investigator.</p>
    <div class="notice"><b>How to read a document.</b> The transcription file mixes three voices, and the reader keeps them apart typographically:
    <div class="block verbatim" style="margin:.5rem 0"><span class="who">historical writer (as transcribed by the PI)</span>Serif, with the PI’s marks preserved: <s>struck text</s>, <u>underlining</u>, <ins class="ms-insert">caret insertions</ins>, <span class="ed-inline">[sic]</span>, and <span class="pi-color pc-FF0000">her colour coding</span> (explained per document).</div>
    <div class="block summary" style="margin:.5rem 0"><span class="who">researcher’s summary (R. J. H. Woods)</span>Sans-serif on grey: the PI’s paraphrase of what a document says. Quotation marks inside a summary are hers.</div>
    <div class="block editorial" style="margin:.5rem 0"><span class="who">editorial note (R. J. H. Woods)</span>Italic on parchment: physical description, stamps, letterheads, archival context, and dated research notes.</div>
    <div class="block annotation" style="margin:.5rem 0"><span class="who">annotation on the original (as transcribed by the PI)</span>Marginal or interlinear notes on the document itself.</div>
    <div class="block model" style="margin:.5rem 0"><span class="who">model note</span>Anything the model added (record notes, identifications, cross-references) is labelled like this.</div></div>
    <p>Select an item on the left, or filter by folder, year, correspondent, or form. Enclosures are separate items linked to their covering letter. Items the PI could not date are placed by their position in her file and say so.</p>
    <h3>Collections</h3><ul>${folders.map(f=>`<li>${esc(f)} <span class="muted small">(${D.documents.filter(d=>d.archive===f).length})</span></li>`).join('')}</ul>`; return; }
  const d=IDX.doc[id]; if(!d){ r.innerHTML='<h1>Item not found</h1>'; return; }
  const idx=D.documents.findIndex(x=>x.id===id); const prev=D.documents[idx-1], next=D.documents[idx+1];
  const legend = d.color_legend? `<div class="legend-colors">${Object.entries(d.color_legend).map(([c,t])=>`<span><i style="background:#${c}"></i>${esc(t)}</span>`).join('')}</div>`:'';
  const related = [];
  if(d.enclosed_in) related.push(`Enclosed in ${docLink(d.enclosed_in)}`);
  (d.enclosures||[]).forEach(e=>related.push(`Enclosure: ${docLink(e)}`));
  r.innerHTML=`${navbar({extra:`${prev?`<button class="ghost" onclick="App.go('/archive/${prev.id}')">‹ Previous item</button>`:''}${next?`<button class="ghost" onclick="App.go('/archive/${next.id}')">Next item ›</button>`:''}`})}
    <div class="phase">archival item ${idx+1} of ${D.documents.length} · ${esc(d.form)}</div>
    <h1>${esc(d.title)}</h1>
    <div class="docmeta">

      ${affiliated.length?`<h2>People affiliated (as attested)</h2><div>${affiliated.map(q=>personPill(q.id)).join(' ')}</div>`:''}` : `
   <h2>Names as written</h2><table class="data"><thead><tr><th>Form</th><th>Where</th></tr></thead><tbody>${(p.variants||[]).map(v=>`<tr><td class="serif">${esc(v.form)}</td><td class="small">${esc(v.source)}</td></tr>`).join('')}</tbody></table>
   <h2>Roles and offices (as attested)</h2><table class="data"><thead><tr><th>Role</th><th>Source</th></tr></thead><tbody>${(p.roles||[]).map(v=>`<tr><td>${esc(v.role)}</td><td class="small">${esc(v.source)}</td></tr>`).join('')}</tbody></table>

     <div><h4>Sent</h4>${(p.sent||[]).length? `<ul class="small">${p.sent.map(x=>`<li>${docLink(x)} <span class="muted">${esc(IDX.doc[x].date_text)}</span></li>`).join('')}</ul>`:'<p class="muted small">none in the file</p>'}</div>
     <div><h4>Received</h4>${(p.received||[]).length? `<ul class="small">${p.received.map(x=>`<li>${docLink(x)} <span class="muted">${esc(IDX.doc[x].date_text)}</span></li>`).join('')}</ul>`:'<p class="muted small">none in the file</p>'}</div>

/* ---------------- network ---------------- */
const NS = { kinds:{correspondence:true, stated:true, pi:true, affiliation:false}, types:{person:true, office:true, institution:true}, scope:'hunt', focus:null, doc:null, yearMin:1906, yearMax:1930, labels:'auto', sel:null };
let sim=null;
Pages.network = function(seg){
  if(seg[0]==='focus'){ NS.focus=seg[1]; NS.doc=null; } else if(seg[0]==='doc'){ NS.doc=seg[1]; NS.focus=null; } else if(seg.length===0){ NS.focus=null; NS.doc=null; }
  page.innerHTML=`<div id="network"><div id="netstage">
     <div id="netcontrols">
       <div class="row"><button class="ghost" onclick="App.back()">← Back</button> <b>Evidence</b>
         <label><input type="checkbox" data-k="correspondence" ${NS.kinds.correspondence?'checked':''}><span style="color:var(--j1907)">■</span> correspondence</label>
         <label><input type="checkbox" data-k="stated" ${NS.kinds.stated?'checked':''}><span style="color:var(--j1908)">■</span> stated in a document</label>
         <label><input type="checkbox" data-k="pi" ${NS.kinds.pi?'checked':''}><span style="color:var(--model)">■</span> PI’s writing</label>
         <label><input type="checkbox" data-k="affiliation" ${NS.kinds.affiliation?'checked':''}><span style="color:#999">■</span> affiliation</label></div>
       <div class="row"><b>Nodes</b> <label><input type="checkbox" data-t="person" ${NS.types.person?'checked':''}>persons</label><label><input type="checkbox" data-t="office" ${NS.types.office?'checked':''}>unnamed offices</label><label><input type="checkbox" data-t="institution" ${NS.types.institution?'checked':''}>institutions</label></div>
       <div class="row"><b>Years</b> <select id="nyMin">${[1906,1907,1908,1909,1910,1914,1916,1930].map(y=>`<option ${y===NS.yearMin?'selected':''}>${y}</option>`).join('')}</select> – <select id="nyMax">${[1907,1908,1909,1910,1914,1916,1930].map(y=>`<option ${y===NS.yearMax?'selected':''}>${y}</option>`).join('')}</select> <span class="muted">(correspondence only)</span></div>
       <div class="row"><b>Labels</b> <select id="nlab"><option value="auto" ${NS.labels==='auto'?'selected':''}>main nodes</option><option value="all" ${NS.labels==='all'?'selected':''}>all</option><option value="none" ${NS.labels==='none'?'selected':''}>none</option></select>
         ${NS.focus?`<span class="tag">ego: ${esc(personLabel(NS.focus))}</span> <button class="ghost small" onclick="App.go('/network')">clear</button>`:''}${NS.doc?`<span class="tag">item: ${esc(IDX.doc[NS.doc].title)}</span> <button class="ghost small" onclick="App.go('/network')">clear</button>`:''}</div>
       <div class="row small muted" id="netstat"></div>
     </div><svg id="netsvg"></svg></div>
     <div id="netside"></div></div>`;
  document.querySelectorAll('#netcontrols input[data-k]').forEach(cb=>cb.addEventListener('change', ()=>{NS.kinds[cb.dataset.k]=cb.checked; drawNet();}));
  document.querySelectorAll('#netcontrols input[data-t]').forEach(cb=>cb.addEventListener('change', ()=>{NS.types[cb.dataset.t]=cb.checked; drawNet();}));
  document.getElementById('nyMin').addEventListener('change', e=>{NS.yearMin=+e.target.value; drawNet();});
  document.getElementById('nyMax').addEventListener('change', e=>{NS.yearMax=+e.target.value; drawNet();});
  document.getElementById('nlab').addEventListener('change', e=>{NS.labels=e.target.value; drawNet();});
  drawNet(); sidePanel(NS.focus||null);
};
function netData(){
  const nodeById=Object.fromEntries(D.network.nodes.map(n=>[n.id,n]));
  let edges=D.network.edges.filter(e=>NS.kinds[e.kind]);
  edges=edges.filter(e=>{ if(e.kind!=='correspondence') return true; const y=e.date? +e.date.slice(0,4): null; return y==null || (y>=NS.yearMin && y<=NS.yearMax); });
  edges=edges.filter(e=>{ const a=nodeById[e.source], b=nodeById[e.target]; return a&&b&&NS.types[a.type]&&NS.types[b.type]&&(a.scope==='hunt'||a.scope==='research')&&(b.scope==='hunt'||b.scope==='research'); });
  if(NS.focus) edges=edges.filter(e=>e.source===NS.focus||e.target===NS.focus);
  if(NS.doc) edges=edges.filter(e=>e.doc===NS.doc || (e.kind!=='correspondence' && e.evidence.some(v=>v.ref===NS.doc)));
  // aggregate parallel edges
  const agg=new Map();
  edges.forEach(e=>{ const key=[e.kind, e.directed?e.source+'>'+e.target: [e.source,e.target].sort().join('|')].join('#'); if(!agg.has(key)) agg.set(key,{...e, weight:0, items:[]}); const a=agg.get(key); a.weight++; a.items.push(e); });
  const E=[...agg.values()];
  const ids=new Set(E.flatMap(e=>[e.source,e.target]));
  const N=D.network.nodes.filter(n=>ids.has(n.id)).map(n=>({...n}));
  const deg=new Map(); E.forEach(e=>{ deg.set(e.source,(deg.get(e.source)||0)+e.weight); deg.set(e.target,(deg.get(e.target)||0)+e.weight); });
  N.forEach(n=>n.deg=deg.get(n.id)||0);
  return {N,E};
}
function drawNet(){
  const svgEl=document.getElementById('netsvg'); if(!svgEl) return;
  const {N,E}=netData();
  document.getElementById('netstat').textContent=`${N.length} nodes · ${E.length} ties (${E.reduce((s,e)=>s+e.weight,0)} attestations) · rules: Method & Data › Network`;
  const svg=d3.select(svgEl); svg.selectAll('*').remove();
  const W=svgEl.clientWidth||800, H=svgEl.clientHeight||600;
  svg.attr('viewBox',`0 0 ${W} ${H}`);
  const defs=svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 -4 8 8').attr('refX',8).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-3L8,0L0,3').attr('fill','#1f6fa3').attr('opacity',.7);
  const g=svg.append('g');
  svg.call(d3.zoom().scaleExtent([.4,4]).on('zoom', ev=>g.attr('transform', ev.transform)));
  const link=g.append('g').selectAll('path').data(E).join('path').attr('class', d=>'netedge '+d.kind).attr('stroke-width', d=>Math.min(1+Math.sqrt(d.weight)*1.1, 7)).attr('marker-end', d=>d.kind==='correspondence'&&d.directed?'url(#arrow)':null).style('cursor','pointer').on('click',(ev,d)=>{ ev.stopPropagation(); sideEdge(d); });
  link.append('title').text(d=>`${personLabel(d.source)} ${d.directed?'→':'↔'} ${personLabel(d.target)} · ${d.kind} · ${d.weight} attestation${d.weight>1?'s':''}`);
  const r=d=>4+Math.sqrt(d.deg)*2.2;
  const node=g.append('g').selectAll('g').data(N).join('g').attr('class','netnode').on('click',(ev,d)=>{ ev.stopPropagation(); NS.sel=d.id; sidePanel(d.id); highlight(d.id); }).on('dblclick',(ev,d)=>App.go('/person/'+d.id));
  node.append('circle').attr('r',r).style('fill', d=>d.type==='institution'?'var(--surface)':d.type==='office'?'var(--surface-2)':'var(--net-node)').style('stroke','var(--net-node)').attr('stroke-width', d=>d.type==='institution'?2:1).attr('stroke-dasharray', d=>d.type==='office'?'2 2':null);
  node.append('text').attr('dx', d=>r(d)+3).attr('dy',4).text(d=>d.label.replace(/\s*\(.*?\)\s*/g,' ').trim()).attr('display', d=> NS.labels==='none'?'none': NS.labels==='all'?null: (d.deg>=4||N.length<=30?null:'none'));
  node.append('title').text(d=>`${d.label}\n${d.type} · degree ${d.deg}\nclick: details · double-click: full record`);
  sim=d3.forceSimulation(N).force('link', d3.forceLink(E).id(d=>d.id).distance(d=>60+Math.max(0,30-d.weight*4)).strength(.4)).force('charge', d3.forceManyBody().strength(-220)).force('center', d3.forceCenter(W/2,H/2)).force('collide', d3.forceCollide(d=>r(d)+6));
  sim.on('tick', ()=>{ link.attr('d', d=>{ const sx=d.source.x, sy=d.source.y, tx=d.target.x, ty=d.target.y; const dx=tx-sx, dy=ty-sy, dr=Math.hypot(dx,dy)||1; const rt=r(d.target)+2; const ex=tx-dx/dr*rt, ey=ty-dy/dr*rt; const off = d.kind==='pi'? 16 : d.kind==='stated'? -14 : 0; if(!off) return `M${sx},${sy}L${ex},${ey}`; const mx=(sx+ex)/2 - dy/dr*off, my=(sy+ey)/2 + dx/dr*off; return `M${sx},${sy}Q${mx},${my} ${ex},${ey}`; }); node.attr('transform', d=>`translate(${d.x},${d.y})`); });
  node.call(d3.drag().on('start',(ev,d)=>{ sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; }).on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; }).on('end',(ev,d)=>{ sim.alphaTarget(0); d.fx=null; d.fy=null; }));
  svg.on('click', ()=>{ NS.sel=null; highlight(null); sidePanel(NS.focus||null); });
  function highlight(id){ if(!id){ link.classed('dim',false); node.classed('dim',false); return; } const nb=new Set([id]); E.forEach(e=>{ const s=e.source.id||e.source, t=e.target.id||e.target; if(s===id) nb.add(t); if(t===id) nb.add(s); }); node.classed('dim', d=>!nb.has(d.id)); link.classed('dim', e=>{ const s=e.source.id||e.source, t=e.target.id||e.target; return s!==id&&t!==id; }); }
  if(NS.sel) highlight(NS.sel);
}
function sideEdge(e){
  const side=document.getElementById('netside'); if(!side) return;
  side.innerHTML=`<div class="phase">tie · ${esc(e.kind)}</div><h2 style="margin-top:0">${esc(personLabel(e.source.id||e.source))} ${e.directed?'→':'↔'} ${esc(personLabel(e.target.id||e.target))}</h2>
    <p class="small muted">${esc(D.network.rules[e.kind]||'')}</p>
    <h4>${e.items.length} attestation${e.items.length>1?'s':''}</h4>
    ${e.items.map(it=>`<div class="card"><b>${esc(it.label)}</b>${it.date?` <span class="muted small">${esc(fmtDate(it.date))}</span>`:''}<ul class="small">${it.evidence.map(v=>`<li>${IDX.doc[v.ref]?docLink(v.ref):`<span class="tag">${esc(v.ref)}</span>`}${v.quote&&it.kind!=='correspondence'?`: <span class="serif">“${esc(v.quote)}”</span>`:''}</li>`).join('')}</ul></div>`).join('')}`;
}
function sidePanel(id){
  const side=document.getElementById('netside'); if(!side) return;
  if(!id){ const top=[...D.network.nodes].filter(n=>n.scope==='hunt').sort((a,b)=>(b.metrics.total||0)-(a.metrics.total||0)).slice(0,12);
    side.innerHTML=`<h2 style="margin-top:0">Network analysis</h2><p class="small">A nominalist network: a tie exists only where a provided text asserts it. Three kinds of evidence are kept apart and can be shown separately. Node size = number of attestations touching the node under the current filters. Click a node for its record, a tie for its evidence; double-click a node for the full prosopographical page.</p>
    <dl class="kv small"><dt><span style="color:var(--j1907)">■</span> correspondence</dt><dd>${esc(D.network.rules.correspondence)}</dd><dt><span style="color:var(--j1908)">■</span> stated</dt><dd>${esc(D.network.rules.stated)}</dd><dt><span style="color:var(--model)">■</span> PI’s writing</dt><dd>${esc(D.network.rules.pi)}</dd><dt><span style="color:#999">■</span> affiliation</dt><dd>${esc(D.network.rules.affiliation)}</dd><dt>exclusions</dt><dd>${esc(D.network.rules.exclusions)}</dd></dl>
    <h4>Most attested nodes (all evidence)</h4><table class="data"><thead><tr><th>Node</th><th>corr. out/in</th><th>stated</th><th>PI</th><th>total</th></tr></thead><tbody>${top.map(n=>`<tr><td><a href="#/person/${n.id}">${esc(n.label)}</a></td><td>${n.metrics.correspondence_out||0}/${n.metrics.correspondence_in||0}</td><td>${(n.metrics.stated_out||0)+(n.metrics.stated_in||0)}</td><td>${(n.metrics.pi_out||0)+(n.metrics.pi_in||0)}</td><td>${n.metrics.total||0}</td></tr>`).join('')}</tbody></table>
    <p class="small"><a href="data/csv/network_edges.csv" download>Download edge list (CSV)</a> · <a href="data/network.json" download>network.json</a> · <a href="#/method/network">Rules in full</a></p>`; return; }
  const p=IDX.person[id]; const n=D.network.nodes.find(x=>x.id===id)||{metrics:{}};
  const edges=D.network.edges.filter(e=>e.source===id||e.target===id);
  side.innerHTML=`<div class="phase">${esc(n.type||'')}</div><h2 style="margin-top:0">${esc(p.label)}</h2>
    ${p.pi_characterisation?`<div class="block pi" style="margin:.4rem 0"><span class="who">PI — Cast of Characters</span>${esc(p.pi_characterisation)}</div>`:''}
    ${p.identity_note?`<div class="block model" style="margin:.4rem 0"><span class="who">model note</span>${esc(p.identity_note)}</div>`:''}
    <dl class="kv small"><dt>correspondence</dt><dd>${n.metrics.correspondence_out||0} sent · ${n.metrics.correspondence_in||0} received</dd><dt>stated relations</dt><dd>${(n.metrics.stated_out||0)+(n.metrics.stated_in||0)}</dd><dt>PI-asserted</dt><dd>${(n.metrics.pi_out||0)+(n.metrics.pi_in||0)}</dd></dl>
    <p><button class="primary" onclick="App.go('/person/${id}')">Full record</button> <button onclick="App.go('/network/focus/${id}')">Ego network</button></p>
    <h4>Ties (${edges.length})</h4><ul class="small">${edges.slice(0,60).map(e=>{ const other=e.source===id?e.target:e.source; return `<li><span class="tag ${e.kind==='pi'?'model':''}">${e.kind}</span> ${e.source===id?'→':e.directed?'←':'↔'} <a href="#/person/${other}">${esc(personLabel(other))}</a> — ${esc(e.label)}${e.doc?` <span class="muted">(${esc(IDX.doc[e.doc].date_text)})</span>`:''}</li>`; }).join('')}${edges.length>60?`<li class="muted">… ${edges.length-60} more on the full record</li>`:''}</ul>`;
}

<script>

(function(){
'use strict';
const {D, IDX, esc, chip, personPill, docLink, storyLink, modelBlock, findingCard, navbar, fmtDate, placeCard} = App;
const page=document.getElementById('pageview');
let tlStream='terse';
Pages.timeline = function([id]){
