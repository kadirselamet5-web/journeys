    <h3>Connections</h3>
    <dl class="kv">
      <dt>In the story</dt><dd>${d.stories.length? d.stories.map(s=>storyLink(s)).join('<br>'):'<span class="muted">not used on a story page</span>'}</dd>
      <dt>In the timeline</dt><dd>${d.timeline.length? d.timeline.map(t=>`<a href="#/timeline/${t}">${esc(IDX.tl[t].text.slice(0,90))}…</a>`).join('<br>'):'<span class="muted">no terse-timeline entry</span>'}</dd>
      <dt>Findings</dt><dd>${d.findings.length? d.findings.map(f=>`<a href="#/method/findings#${f}" onclick="event.preventDefault();App.go('/method/findings/${f}')">${esc(IDX.finding[f].title)}</a>`).join('<br>'):'—'}</dd>
      <dt>Network</dt><dd>${(d.senders||[]).length&&(d.recipients||[]).length?`correspondence tie${(d.senders.length*d.recipients.length)>1?'s':''}: ${d.senders.map(s=>d.recipients.map(t=>`${esc(personLabel(s))} → ${esc(personLabel(t))}`).join('; ')).join('; ')} · <a href="#/network/doc/${d.id}">show in network</a>`:'<span class="muted">no sender→recipient tie (unaddressed or unsigned item)</span>'}</dd>
    </dl>
    <div class="footer-nav">${prev?`<a href="#/archive/${prev.id}">‹ ${esc(prev.title)}</a>`:'<span></span>'}${next?`<a href="#/archive/${next.id}" style="text-align:right">${esc(next.title)} ›</a>`:'<span></span>'}</div>`;
  r.scrollTop=0;
}

/* ---------------- person / institution pages ---------------- */
const PI_CAST_WHO = 'principal investigator — Cast of Characters: working notes (unpublished, 2019), quoted verbatim';
const FUND = D.network.funding || {nodes:[], edges:[], rule:'', caveats:[], statuses:{}};
function evKind(e){ return e.evidence_kind? ` <span class="tag" title="printed letterhead officer list, not a sentence written by the signer">${esc(e.evidence_kind)}</span>`:''; }
function refLink(ref){ return IDX.doc[ref]? docLink(ref) : ref==='tale'? '<a href="#/tale">Tale</a>' : ref==='cast'? '<a href="#/cast">Cast of Characters</a>' : ref==='pi_timeline'? '<a href="#/timeline">PI timeline</a>' : `<span class="tag">${esc(ref)}</span>`; }
function evidenceCell(e){ return `${e.date?`<span class="muted">${esc(fmtDate(e.date))}</span><br>`:''}${(e.evidence||[]).map(v=>`${refLink(v.ref)}${v.quote&&e.kind!=='correspondence'?`: <span class="serif">“${esc(v.quote)}”</span>`:''}`).join('<br>')}${e.note?`<div class="muted">${esc(e.note)}</div>`:''}`; }
function fundLabel(x){ const n=FUND.nodes.find(q=>q.id===x); return n? n.label : personLabel(x); }
function fundNodeLink(x){ return x.startsWith('x_')? `<a class="pill inst" href="#/network/view/funding" title="funding view">${esc(fundLabel(x))}</a>` : personPill(x); }
function fundingRows(id){ return FUND.edges.filter(e=>e.source===id||e.target===id); }
function fundingTable(rows){ return `<table class="data"><thead><tr><th>From</th><th>To</th><th>Amount as written</th><th>Status</th><th>Date</th><th>Evidence</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${fundNodeLink(e.source)}</td><td>${fundNodeLink(e.target)}</td><td class="serif">${esc(e.amount_as_written)}</td><td><span class="tag ${e.kind==='pi'?'model':''}" title="${esc(FUND.statuses[e.status]||'')}">${esc(e.kind==='pi'?'PI: '+e.status:e.status)}</span></td><td class="small">${esc(e.date?fmtDate(e.date):'undated')}</td><td class="small">${refLink(e.doc)}: <span class="serif">“${esc(e.quote)}”</span>${e.note?`<div class="muted">${esc(e.note)}</div>`:''}</td></tr>`).join('')}</tbody></table>`; }
App.fundingTable = fundingTable; App.PI_CAST_WHO = PI_CAST_WHO;

Pages.person = function([id]){
  const p=IDX.person[id]; if(!p){ page.innerHTML='<div class="page">'+navbar()+'<h1>Record not found</h1></div>'; return; }
  const edges=D.network.edges.filter(e=>e.source===id||e.target===id);
  const byKind=k=>edges.filter(e=>e.kind===k);
  const isInst = !id.startsWith('p_') && !id.startsWith('o_');
  const tieRow=e=>{ const other=e.source===id?e.target:e.source; const dir = e.directed? (e.source===id? '→':'←') : '↔'; return `<tr><td>${dir} ${personPill(other)}</td><td>${esc(e.label)}${evKind(e)}</td><td class="small">${evidenceCell(e)}</td></tr>`; };
  const tieTable=rows=>`<table class="data"><thead><tr><th>With</th><th>Relation</th><th>Evidence · date of the document</th></tr></thead><tbody>${rows.map(tieRow).join('')}</tbody></table>`;
  const affStated=byKind('affiliation').filter(e=>e.affiliation_status==='stated'), affInf=byKind('affiliation').filter(e=>e.affiliation_status==='inferred');
  const affiliatedStated = isInst? D.people.filter(q=>(q.institutions||[]).some(a=>a.id===id&&a.status==='stated')) : [];
  const affiliatedInf = isInst? D.people.filter(q=>(q.institutions||[]).some(a=>a.id===id&&a.status==='inferred')) : [];
  const instStated=(p.institutions||[]).filter(a=>a.status==='stated'), instInf=(p.institutions||[]).filter(a=>a.status==='inferred');
  const fr=fundingRows(id);
  page.innerHTML=`<div class="page">${navbar({right:`<button onclick="App.go('/network/focus/${id}')">Ego network</button>`})}
   <div class="phase">${isInst? (p.kind||'institution') : 'prosopographical record · '+esc(p.kind)+' · scope: '+esc(p.scope)}</div>
   <h1>${esc(p.label)}</h1>
   ${p.identity_note? modelBlock('Identity note: '+p.identity_note):''}
   ${p.pi_characterisation? `<div class="block pi"><span class="who">${PI_CAST_WHO}</span>${esc(p.pi_characterisation)}</div>`:''}
   ${(p.characterisations||[]).length? `<h3>Characterisations (PI)</h3>${p.characterisations.map(c=>`<div class="block pi"><span class="who">${esc(c.source)} — verbatim</span>${esc(c.text)}</div>`).join('')}`:''}
   ${p.note? `<div class="notice">${esc(p.note)}</div>`:''}
   ${isInst? `<dl class="kv">${p.units?`<dt>Units named</dt><dd>${p.units.map(esc).join('; ')}</dd>`:''}<dt>Attested in</dt><dd>${(p.attestations||[]).map(esc).join('<br>')}</dd>${p.place?`<dt>Place</dt><dd><a href="#/place/${p.place}">${esc(IDX.place[p.place].label)}</a> <span class="chip plain ${p.place_status==='stated'?'stated':'inferred'}" title="place_status: ${p.place_status==='stated'?'a provided text puts the institution at this place':'the model placed it'}">place ${esc(p.place_status||'')}</span></dd>`:''}</dl>
      ${affiliatedStated.length?`<h2>People affiliated (stated in a provided text)</h2><div>${affiliatedStated.map(q=>personPill(q.id)).join(' ')}</div>`:''}
      ${affiliatedInf.length?`<h2>People affiliated — inferred by the model</h2><div class="block model"><span class="who">model note — affiliations read from context, not stated in the sources</span>${affiliatedInf.map(q=>{ const a=q.institutions.find(x=>x.id===id); return `<div>${personPill(q.id)} <span class="small">${esc(a.note||'')}</span></div>`; }).join('')}</div>`:''}` : `
   <h2>Names as written</h2><table class="data"><thead><tr><th>Form</th><th>Where</th></tr></thead><tbody>${(p.variants||[]).map(v=>`<tr><td class="serif">${esc(v.form)}</td><td class="small">${esc(v.source)}</td></tr>`).join('')}</tbody></table>
   <h2>Roles and offices (as attested)</h2><table class="data"><thead><tr><th>Role</th><th>Source</th></tr></thead><tbody>${(p.roles||[]).map(v=>`<tr><td>${esc(v.role)}</td><td class="small">${esc(v.source)}</td></tr>`).join('')}</tbody></table>
   ${(p.addresses||[]).length?`<h2>Addresses</h2><ul>${p.addresses.map(a=>`<li>${esc(a.address)} <span class="muted small">(${esc(a.source)})</span></li>`).join('')}</ul>`:''}
   ${instStated.length?`<h2>Institutions (stated in a provided text)</h2><ul>${instStated.map(a=>`<li>${personPill(a.id)} <span class="small">— ${refLink(a.evidence.ref)}: <span class="serif">“${esc(a.evidence.quote)}”</span>${evKind(a)}${a.note?` <span class="muted">(${esc(a.note)})</span>`:''}</span></li>`).join('')}</ul>`:''}
   ${instInf.length?`<h2>Affiliations inferred by the model</h2><div class="block model"><span class="who">model note — read from context; no provided text names the person in this institution</span>${instInf.map(a=>`<div>${personPill(a.id)} <span class="small">${esc(a.note||'')}</span></div>`).join('')}</div>`:''}`}
   <h2>Correspondence <span class="muted small">(${(p.sent||[]).length} sent · ${(p.received||[]).length} received · named in ${(p.mentioned_in||[]).length})</span></h2>
   <div class="grid2">
     <div><h4>Sent</h4>${(p.sent||[]).length? `<ul class="small">${p.sent.map(x=>`<li>${docLink(x)} <span class="muted">${esc(IDX.doc[x].date_text)}</span></li>`).join('')}</ul>`:'<p class="muted small">none in the file</p>'}</div>
     <div><h4>Received</h4>${(p.received||[]).length? `<ul class="small">${p.received.map(x=>`<li>${docLink(x)} <span class="muted">${esc(IDX.doc[x].date_text)}</span></li>`).join('')}</ul>`:'<p class="muted small">none in the file</p>'}</div>
   </div>
   ${(p.mentioned_in||[]).length?`<h4>Named in <span class="tag model">derived</span></h4><div class="small">${p.mentioned_in.map(x=>docLink(x)).join(' · ')}</div><div class="small muted">automatic name-variant match (model); not an asserted tie; check the text.</div>`:''}
   <h2>Ties</h2>
   ${byKind('stated').length?`<h4>Relations stated in documents</h4>${tieTable(byKind('stated'))}`:''}
   ${byKind('pi').length?`<h4>Relations asserted by the principal investigator <span class="tag model">PI</span></h4>${tieTable(byKind('pi'))}`:''}
   ${affStated.length?`<h4>Affiliations (stated)</h4>${tieTable(affStated)}`:''}
   ${affInf.length?`<h4>Affiliations inferred by the model <span class="tag model">model</span></h4>${tieTable(affInf)}`:''}
   ${!edges.length?'<p class="muted small">No tie touches this record under the nominalist rules.</p>':''}
   ${fr.length?`<h2>Funding <span class="muted small">(sums stated in the file; amounts as written; no total is computed)</span></h2>${fundingTable(fr)}<p class="small"><a href="#/network/view/funding">Open the funding view</a></p>`:''}
   ${(p.findings||[]).length?`<h2>Discrepancies and absences concerning this record</h2>${p.findings.map(findingCard).join('')}`:''}
   ${p.stories&&p.stories.length?`<h2>Story pages</h2><ul>${p.stories.map(s=>`<li>${storyLink(s)}</li>`).join('')}</ul>`:''}
  </div>`;
};

/* ---------------- network ---------------- */
/* Five views over one data set. 'persons' is the asserted graph (correspondence, stated, PI, affiliation); 'institutions' is
   the person–institution bipartite graph; 'funding' the stated sums; 'coattestation' and 'mentions' are derived layers and
   are labelled so. Each view's rule and caveats come from D.network.views, the same strings Method › Network prints. */
const VIEWS = D.network.views || [];
const viewById = Object.fromEntries(VIEWS.map(v=>[v.id,v]));
const NS = { view:'persons', kinds:{correspondence:true, stated:true, pi:true, affiliation:false}, types:{person:true, office:true, institution:true}, focus:null, doc:null, yearMin:1906, yearMax:1930, labels:'auto', sel:null, coFilter:'all', coSort:'n_kinds', graph:null };
let sim=null;
const KIND_LABEL={correspondence:'correspondence (solid, arrow)', stated:'stated in a document (dash 7 3)', pi:'PI’s writing (dash 4 3)', affiliation:'affiliation (dash 1 3; inferred faint)'};
const KIND_DASH={correspondence:'', stated:'7 3', pi:'4 3', affiliation:'1 3', mention:'2 3'};
const KIND_COLOR={correspondence:'var(--j1907)', stated:'var(--j1908)', pi:'var(--model)', affiliation:'var(--muted)', mention:'var(--muted)'};
const FUND_DASH={paid:'', acknowledged:'', promised:'6 4', requested:'3 3', budgeted:'1 3', ceiling:'8 3 2 3', offered:'2 6'};
const FUND_WIDTH={paid:2.6, acknowledged:1.4, promised:2, requested:1.6, budgeted:1.4, ceiling:2, offered:1.4};
const inScope=n=>n && (n.scope==='hunt'||n.scope==='research');
const nodeById=Object.fromEntries(D.network.nodes.map(n=>[n.id,n]));
function swatch(dash, color, w){ return `<svg width="26" height="8" aria-hidden="true" style="vertical-align:middle"><line x1="1" y1="4" x2="25" y2="4" style="stroke:${color};stroke-width:${w||2}" ${dash?`stroke-dasharray="${dash}"`:''}></line></svg>`; }
function labelSelect(){ return `<select id="nlab" aria-label="Which node labels to show"><option value="auto" ${NS.labels==='auto'?'selected':''}>main nodes</option><option value="all" ${NS.labels==='all'?'selected':''}>all</option><option value="none" ${NS.labels==='none'?'selected':''}>none</option></select>`; }
function shortLabel(s){ return s.replace(/\s*\(.*?\)\s*/g,' ').replace(/^'|'$/g,'').trim(); }

Pages.network = function(seg){
  if(seg[0]==='view'){ NS.view = viewById[seg[1]]? seg[1] : 'persons'; NS.focus=null; NS.doc=null; }
  else if(seg[0]==='focus'){ NS.view='persons'; NS.focus=seg[1]; NS.doc=null; }
  else if(seg[0]==='doc'){ NS.view='persons'; NS.doc=seg[1]; NS.focus=null; }
  else { NS.view='persons'; NS.focus=null; NS.doc=null; }
  NS.sel=null;
  const v=viewById[NS.view]||{label:'Persons',derived:false,rule:'',caveats:[]};
  const yearOpts=(sel,ys)=>ys.map(y=>`<option ${y===sel?'selected':''}>${y}</option>`).join('');
  let rows='';
  if(NS.view==='persons'){
    rows=`<div class="row"><b>Evidence</b> ${['correspondence','stated','pi','affiliation'].map(k=>`<label><input type="checkbox" data-k="${k}" ${NS.kinds[k]?'checked':''}>${swatch(KIND_DASH[k],KIND_COLOR[k])} ${KIND_LABEL[k]}</label>`).join('')}</div>
      <div class="row"><b>Nodes</b> <label><input type="checkbox" data-t="person" ${NS.types.person?'checked':''}>persons</label><label><input type="checkbox" data-t="office" ${NS.types.office?'checked':''}>unnamed offices</label><label><input type="checkbox" data-t="institution" ${NS.types.institution?'checked':''}>institutions</label>
        <b>Years</b> <select id="nyMin" aria-label="Earliest year">${yearOpts(NS.yearMin,[1906,1907,1908,1909,1910,1914,1916,1930])}</select> – <select id="nyMax" aria-label="Latest year">${yearOpts(NS.yearMax,[1907,1908,1909,1910,1914,1916,1930])}</select> <span class="muted">(correspondence and stated ties; PI ties are undated)</span>
        <b>Labels</b> ${labelSelect()}
        ${NS.focus?`<span class="tag">ego: ${esc(personLabel(NS.focus))}</span> <button class="ghost small" onclick="App.go('/network')">clear</button>`:''}${NS.doc?`<span class="tag">item: ${esc((IDX.doc[NS.doc]||{}).title||NS.doc)}</span> <button class="ghost small" onclick="App.go('/network')">clear</button>`:''}</div>`;
  } else if(NS.view==='coattestation'){
    rows=`<div class="row"><b>Pairs</b> <select id="ncofilter" aria-label="Which pairs to show"><option value="all" ${NS.coFilter==='all'?'selected':''}>all pairs</option><option value="three" ${NS.coFilter==='three'?'selected':''}>all three kinds</option><option value="docs" ${NS.coFilter==='docs'?'selected':''}>documents only (no PI tie)</option><option value="pi" ${NS.coFilter==='pi'?'selected':''}>PI only (no document states it)</option></select> <b>Labels</b> ${labelSelect()} <span class="muted">strands: ${swatch('',KIND_COLOR.correspondence)} correspondence · ${swatch(KIND_DASH.stated,KIND_COLOR.stated)} stated · ${swatch(KIND_DASH.pi,KIND_COLOR.pi)} PI</span></div>`;
  } else if(NS.view==='funding'){
    rows=`<div class="row"><b>Status</b> ${Object.keys(FUND_DASH).map(s=>`<span title="${esc(FUND.statuses[s]||'')}">${swatch(FUND_DASH[s],'var(--ink-2)',FUND_WIDTH[s])} ${s}</span>`).join(' ')} <span>${swatch('4 3','var(--model)')} PI’s assertion</span></div>`;
  } else {
    rows=`<div class="row"><b>Labels</b> ${labelSelect()} ${NS.view==='mentions'?`<span class="muted">${swatch(KIND_DASH.mention,KIND_COLOR.mention)} sender → person named in the text (derived)</span>`:`<span class="muted">squares = institutions, sized by persons attested in them; ${swatch('1 3','var(--muted)')} affiliation (faint = inferred)</span>`}</div>`;
  }
  page.innerHTML=`<div id="network"><div id="netstage">
     <div id="netcontrols">
       <div class="row"><button class="ghost" onclick="App.back()">← Back</button> <b>View</b> <div class="seg" role="group" aria-label="Network view">${VIEWS.map(x=>`<button class="${x.id===NS.view?'active':''}" aria-pressed="${x.id===NS.view}" onclick="App.go('/network/view/${x.id}')">${esc(x.label)}${x.derived?' <span class="tag model" style="font-size:.6rem">derived</span>':''}</button>`).join('')}</div>
         <span class="find"><input id="netfind" type="search" list="netnodes" aria-label="Find a node" placeholder="Find a node…" autocomplete="off"><datalist id="netnodes"></datalist></span></div>
       ${rows}
       <div class="row small muted" id="netstat"></div>
     </div>
     <div id="netviewhead"><span class="tag ${v.derived?'model':''}">${v.derived?'derived':'asserted'}</span> <b>${esc(v.label)}</b> <span class="rule">${esc(v.rule)}</span>${(v.caveats||[]).length?` <span class="caveat muted">Caveat: ${esc(v.caveats[0])}</span>`:''}${(v.caveats||[]).length>1?` <a href="#/network/view/${v.id}" onclick="event.preventDefault();Pages._netCaveat()">all ${v.caveats.length} caveats</a>`:''}</div>
     <svg id="netsvg" role="img" aria-label="${esc(v.label)} network under the current filters; the side panel lists the same ties as text"></svg></div>
     <div id="netside"></div></div>`;
  document.querySelectorAll('#netcontrols input[data-k]').forEach(cb=>cb.addEventListener('change', ()=>{NS.kinds[cb.dataset.k]=cb.checked; drawNet();}));
  document.querySelectorAll('#netcontrols input[data-t]').forEach(cb=>cb.addEventListener('change', ()=>{NS.types[cb.dataset.t]=cb.checked; drawNet();}));
  const on=(id,ev,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };
  on('nyMin','change', e=>{NS.yearMin=+e.target.value; drawNet();});
  on('nyMax','change', e=>{NS.yearMax=+e.target.value; drawNet();});
  on('nlab','change', e=>{NS.labels=e.target.value; drawNet();});
  on('ncofilter','change', e=>{NS.coFilter=e.target.value; drawNet(); sidePanel(null);});
  const find=document.getElementById('netfind');
  find.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); gotoNode(findNode(find.value)); } });
  find.addEventListener('change', ()=>{ const n=findNode(find.value); if(n && n.label.toLowerCase()===find.value.trim().toLowerCase()) gotoNode(n); });
  drawNet(); sidePanel(NS.focus||null);
};

function netData(){
  let edges=D.network.edges.filter(e=>NS.kinds[e.kind]);
  // the year range applies to correspondence and stated ties by the date of their document; undated ties (PI, Cast, undated items) always pass
  edges=edges.filter(e=>{ if(e.kind!=='correspondence' && e.kind!=='stated') return true; const y=e.date? +e.date.slice(0,4): null; return y==null || (y>=NS.yearMin && y<=NS.yearMax); });
  edges=edges.filter(e=>{ const a=nodeById[e.source], b=nodeById[e.target]; return a&&b&&NS.types[a.type]&&NS.types[b.type]&&inScope(a)&&inScope(b); });
  if(NS.focus) edges=edges.filter(e=>e.source===NS.focus||e.target===NS.focus);
  if(NS.doc) edges=edges.filter(e=>e.doc===NS.doc || (e.kind!=='correspondence' && e.evidence.some(v=>v.ref===NS.doc)));
  const agg=new Map();
  edges.forEach(e=>{ const key=[e.kind, e.directed?e.source+'>'+e.target: [e.source,e.target].sort().join('|')].join('#'); if(!agg.has(key)) agg.set(key,{...e, weight:0, items:[]}); const a=agg.get(key); a.weight++; a.items.push(e); });
  const E=[...agg.values()];
  const ids=new Set(E.flatMap(e=>[e.source,e.target]));
  const N=D.network.nodes.filter(n=>ids.has(n.id)).map(n=>({...n}));
  const deg=new Map(); E.forEach(e=>{ deg.set(e.source,(deg.get(e.source)||0)+e.weight); deg.set(e.target,(deg.get(e.target)||0)+e.weight); });
  N.forEach(n=>n.deg=deg.get(n.id)||0);
  return {N,E};
}

  node.append('title').text(d=>`${d.label}\n${d.deg} mention(s)`);
  sim=d3.forceSimulation(N).force('link', d3.forceLink(E).id(d=>d.id).distance(70).strength(.3)).force('charge', d3.forceManyBody().strength(-200)).force('center', d3.forceCenter(W/2,H/2)).force('collide', d3.forceCollide(d=>r(d)+5));
  sim.on('tick', ()=>{ link.attr('d', d=>curvePath(d, r(d.target), 10)); node.attr('transform', d=>`translate(${d.x},${d.y})`); });
  nodeBehaviour(node, ()=>sim);
  NS.graph.nodes=N; NS.graph.highlight=neighbourHighlight(node, link, E);
}

function pairTable(){

Pages._coPick=function(a,b){ const p=(D.network.pairs||[]).find(x=>x.a===a&&x.b===b); if(!p) return; sidePair(p); if(NS.graph&&NS.graph.highlightPair) NS.graph.highlightPair(p); };

    if(NS.view==='persons'){

        <dl class="kv small"><dt>${swatch('',KIND_COLOR.correspondence)} correspondence</dt><dd>${esc(D.network.rules.correspondence)}</dd><dt>${swatch(KIND_DASH.stated,KIND_COLOR.stated)} stated</dt><dd>${esc(D.network.rules.stated)}</dd><dt>${swatch(KIND_DASH.pi,KIND_COLOR.pi)} PI’s writing</dt><dd>${esc(D.network.rules.pi)}</dd><dt>${swatch(KIND_DASH.affiliation,KIND_COLOR.affiliation)} affiliation</dt><dd>${esc(D.network.rules.affiliation)}</dd><dt>exclusions</dt><dd>${esc(D.network.rules.exclusions)}</dd></dl>

    } else if(NS.view==='funding'){
      side.innerHTML=`<h2 style="margin-top:0">Funding flow</h2>${ruleBlock(v)}

      <h4>Every funding edge</h4>${fundingTable(FUND.edges)}
      <p class="small"><a href="data/csv/funding.csv" download>Download funding edges (CSV)</a> · <a href="#/method/network">Views and rules</a></p>`;
    } else if(NS.view==='coattestation'){
      side.innerHTML=`<h2 style="margin-top:0">Co-attestation</h2>${ruleBlock(v)}

      ${pairTable()}
      <p class="small"><a href="data/csv/network_pairs.csv" download>Download pairs (CSV)</a></p>`;
    } else if(NS.view==='mentions'){
      const agg=new Map(); (D.network.mentions.edges||[]).forEach(e=>{ agg.set(e.target,(agg.get(e.target)||0)+1); });
      const top=[...agg.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12);
      side.innerHTML=`<h2 style="margin-top:0">Mentions <span class="tag model">derived</span></h2>${ruleBlock(v)}
      <p class="small">${esc(D.network.mentions.method||'')}</p>
      <h4>Most often named in others' letters</h4><table class="data"><thead><tr><th>Person</th><th>items naming them</th></tr></thead><tbody>${top.map(([p,n])=>`<tr><td><a href="#/person/${p}">${esc(personLabel(p))}</a></td><td>${n}</td></tr>`).join('')}</tbody></table>
      <p class="small"><a href="data/csv/network_mentions.csv" download>Download mention edges (CSV)</a></p>`;
    } else {
      const insts=D.institutions.map(i=>({i, n:D.network.edges.filter(e=>e.kind==='affiliation'&&e.target===i.id)})).filter(x=>x.n.length).sort((a,b)=>b.n.length-a.n.length);
      side.innerHTML=`<h2 style="margin-top:0">Persons and institutions</h2>${ruleBlock(v)}
      <h4>Institutions by persons attested</h4><table class="data"><thead><tr><th>Institution</th><th>stated</th><th>inferred</th><th>place</th></tr></thead><tbody>${insts.map(({i,n})=>`<tr><td><a href="#/person/${i.id}">${esc(i.label)}</a></td><td>${n.filter(e=>e.affiliation_status==='stated').length}</td><td>${n.filter(e=>e.affiliation_status==='inferred').length||''}</td><td class="small">${i.place?`${esc((IDX.place[i.place]||{}).label||i.place)} <span class="muted">(${esc(i.place_status||'')})</span>`:'—'}</td></tr>`).join('')}</tbody></table>`;
    }
    return;
  }
  const p=IDX.person[id]; if(!p){ side.innerHTML=''; return; }
  const n=nodeById[id]||{metrics:{}};
  const edges=D.network.edges.filter(e=>e.source===id||e.target===id);
  const fr=fundingRows(id);
  side.innerHTML=`<div class="phase">${esc(n.type||'')}</div><h2 style="margin-top:0">${esc(p.label)}</h2>
    ${p.pi_characterisation?`<div class="block pi" style="margin:.4rem 0"><span class="who">${PI_CAST_WHO}</span>${esc(p.pi_characterisation)}</div>`:''}

    ${p.identity_note?`<div class="block model" style="margin:.4rem 0"><span class="who">model note</span>${esc(p.identity_note)}</div>`:''}
    <dl class="kv small"><dt>correspondence</dt><dd>${n.metrics.correspondence_out||0} sent · ${n.metrics.correspondence_in||0} received</dd><dt>stated relations</dt><dd>${(n.metrics.stated_out||0)+(n.metrics.stated_in||0)}</dd><dt>PI-asserted</dt><dd>${(n.metrics.pi_out||0)+(n.metrics.pi_in||0)}</dd>${fr.length?`<dt>funding edges</dt><dd>${fr.length} <a href="#/network/view/funding">(view)</a></dd>`:''}</dl>

}
})();

      <div class="phase">published / cited source · ${esc(p.type)}</div><h1>${esc(p.short)}</h1>

};

Pages.method = function(seg){
  const sub=seg[0]||'overview'; const anchor=seg[1];
  const tabs=[['overview','Approach & authorship'],['geocoding','Geocoding decisions'],['network','Network rules'],['findings','Discrepancies & absences'],['data','Data & downloads']];
  let body='';
  if(sub==='overview'){
    body=`<h2>What this site is</h2><p class="serif">An evidence-based historical reconstruction of L. S. Quackenbush’s two Alaskan journeys for the American Museum of Natural History (1907, 1908), built only from the five files supplied by the Mammoth History Lab: the principal investigator’s talk text (“A Tale of Two Mammoths”, 2019), her transcription file of the AMNH correspondence, her comprehensive and terse timelines, and her Cast of Characters. Nothing on the site—no date, coordinate, quotation, person or tie—comes from anywhere else, except gazetteer coordinates, which are cited record by record.</p>
     <h2>Whose prose, whose transcription, what the model did</h2><dl class="kv">${Object.entries(D.meta.authorship).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
     <h2>Source criticism as the foundation</h2><ul>
      <li><b>Three voices kept apart.</b> The transcription file mixes verbatim quotation with the PI’s summaries and editorial notes. Every paragraph was typed as <span class="tag verbatim">verbatim</span>, <span class="tag summary">summary</span>, <span class="tag editorial">editorial</span> or <span class="tag annotation">annotation</span> and is rendered differently throughout (${D.meta.counts.blocks} blocks in ${D.meta.counts.documents} items). Typing was done by rule (quotation marks, the PI’s conventions for stamps, letterheads, dated notes) and then checked by hand; a handful of paragraphs that change voice mid-way were split at the sentence boundary.</li>
      <li><b>Marks preserved.</b> Struck text, underlining, caret insertions, [sic], [?], [illeg], and the PI’s colour coding (red/blue annotations by Bumpus and Osborn; red pencil underlining; purple for her itinerary stream) were recovered from the Word files and carried into the data.</li>
      <li><b>Absences as findings.</b> Unnamed people, missing enclosures, a letter removed from the file in 1908 and never returned, conversations that never entered the file, an untranscribed manuscript, and the unprovided Bulletin are recorded in the <a href="#/method/findings">register</a> rather than silently filled.</li>
      <li><b>Contradictions left standing.</b> Where the PI’s own documents disagree (15 May vs 15 June 1907; 19 May vs “toward the end of May” 1908; Lane’s Landing vs Shelton; 86 vs “about 80” miles) both readings are shown and the record is chipped <span class="chip disputed">disputed</span>.</li>
      <li><b>Nominalist prosopography.</b> Names are recorded as written (Meany/Meaney, Startsman/Startson/Statesman, “C.W. Graham [sic]”) and identities are asserted only where a source asserts them; two attestations of a “Lucas” are kept as two records with a stated possibility of identity.</li></ul>
     <h2>Design precedents consulted</h2><p class="small">The treatment of uncertainty follows published practice in historical GIS and digital humanities: semi-opaque circles around a centroid for approximate positions (as used by the Visualizing Emancipation project, University of Richmond), background rather than foreground treatment of uncertainty (Weixuan Li, <i>Journal for the History of Knowledge</i>, 2024), recording approximation in the dataset with a separate uncertainty column (St Olaf DH recipes), and the view of the interface itself as a scholarly argument (<i>DHQ</i> 18.1, 2024; <i>Digital Scholarly Editions as Interfaces</i>, SIDE 12). Typography follows long-form reading guidance: a serif for the historical text and the PI’s narrative, a sans for interface and summary, 16–17 px body, 1.55 line height, 60–75 characters per line.</p>
     <h2>Not received</h2><p class="small">The lab’s earlier map models and the previously designed primary-source interface were not among the supplied files and the repository was empty; the Archive tab was therefore designed afresh on the same typed-block logic and can be exchanged for the lab’s own interface, since it reads from <code>data/documents.json</code>.</p>`;
  } else if(sub==='geocoding'){
    body=`<h2>Hierarchy applied</h2><ol>${Object.entries(D.meta.geocoding_tiers).map(([k,v])=>`<li><b>Tier ${k}</b> — ${esc(v)}</li>`).join('')}</ol>
      <p class="small">GNIS = USGS Geographic Names Information System, Alaska domestic-names file (retrieved 18 Nov 2026); CGNDB = Canadian Geographical Names Database; GeoNames for places outside the US and Canada; Wikidata only as a cross-check and never as sole authority. Every connector is schematic (great-circle or straight) because no route was traced from a historical map. Upriver points on the Buckland are projections of Quackenbush’s river-mile estimates along a schematic axis and carry wide halos. The scale bar on the map is Leaflet’s; the distances quoted by the sources (30, 62, 86, 200 miles) are the writers’ estimates and were not measured here.</p>
      <p class="small">Map labels use a short form of each attested label (<code>short_label</code>, the model’s display normalisation); records, tooltips and these tables keep the full attested label. A place carrying two attested names for one gazetteer point is flagged ${chip('naming')} beside its status; the flag records naming variance, not a dispute about position. Places without a coordinate carry a sub-kind (${Object.entries(D.meta.unlocated_kinds||{}).map(([k,v])=>`<i>${esc(k)}</i> — ${esc(v)}`).join('; ')}) and are drawn only as the constraints the sources state and the gazetteer homonyms the name has — never as a point.</p>
      <h2>Every place, with its decision</h2><table class="data"><thead><tr><th>Place (attested)</th><th>Status</th><th>Tier</th><th>Precision</th><th>Lat, lon</th><th>Halo km</th><th>Authority / id</th><th>Why this point is here (or why none is drawn)</th></tr></thead><tbody>${D.places.map(p=>`<tr><td><a href="#/place/${p.id}">${esc(p.label)}</a><div class="small muted">${p.attested.map(a=>'“'+esc(a.form)+'”').join('; ')}</div></td><td>${chip(p.status)}${p.naming?' '+chip('naming'):''}${p.unlocated_kind?` <span class="tag">${esc(p.unlocated_kind)}</span>`:''}</td><td>${p.has_coords?(p.tier||'—'):'none'}</td><td class="small">${esc(p.precision)}</td><td class="small">${p.has_coords?`${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`:'—'}</td><td class="small">${p.radius_km||'—'}</td><td class="small">${p.coord_source?`${esc(p.coord_source.authority)}${p.coord_source.id?` · ${p.coord_source.url?`<a href="${esc(p.coord_source.url)}" target="_blank" rel="noopener">${esc(p.coord_source.id)}</a>`:esc(p.coord_source.id)}`:''}`:'—'}</td><td class="small">${esc(p.why)}</td></tr>`).join('')}</tbody></table>
      <h2>Unlocated places: constraints drawn and candidates listed</h2><p class="small">A constraint is a spatial statement a provided text makes about a place that cannot be located; it is drawn around its located anchor (a dashed ring for a stated distance, a leader label for ‘near’, a bracket for an equation with a located place) and never as a point. Candidates are the gazetteer records that bear the attested name; all are drawn alike and none is chosen.</p>
      <table class="data"><thead><tr><th>Place</th><th>Sub-kind</th><th>Constraint</th><th>Statement (verbatim)</th><th>Source</th><th>Model note</th></tr></thead><tbody>${D.places.filter(p=>!p.has_coords).flatMap(p=>{ const rows=(p.constraints||[]).map(c=>`<tr><td><a href="#/place/${p.id}">${esc(p.label)}</a></td><td><span class="tag">${esc(p.unlocated_kind)}</span></td><td class="small">${esc(c.kind)}${c.miles?` · ${c.miles} mi from`:' ·'} ${esc((IDX.place[c.anchor]||{}).short_label||c.anchor)}</td><td class="serif">“${esc(c.quote)}”</td><td class="small">${esc(c.speaker)} · ${App.refLinkShort(c.ref)}</td><td class="small">${esc(c.model_note)}</td></tr>`); if((p.candidates||[]).length) rows.push(`<tr><td><a href="#/place/${p.id}">${esc(p.label)}</a></td><td><span class="tag">${esc(p.unlocated_kind)}</span></td><td class="small">candidates</td><td class="small">${p.candidates.map(c=>`GNIS <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.id)}</a> ${esc(c.name)} (${esc(c.feature_class)}; ${esc(c.county||'')}) ${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}`).join('<br>')}</td><td class="small">USGS GNIS, Alaska file${D.meta.gnis_candidates_checked_against_file?' — re-checked against the file at build':''}</td><td class="small">${esc(p.candidates_note)}</td></tr>`); if(!rows.length) rows.push(`<tr><td><a href="#/place/${p.id}">${esc(p.label)}</a></td><td><span class="tag">${esc(p.unlocated_kind)}</span></td><td class="small">—</td><td class="small muted">no spatial statement in the sources</td><td></td><td class="small">${esc(p.why)}</td></tr>`); return rows; }).join('')}</tbody></table>
      <h2>Stops and their dates</h2><table class="data"><thead><tr><th>Stop</th><th>Place</th><th>Date as attested</th><th>Precision</th><th>Status</th><th>Why</th></tr></thead><tbody>${D.stops.map(s=>`<tr><td><span class="tag ${App.journeyClass(s.journey)}">${s.journey}</span> <b class="seq ${App.journeyClass(s.journey)}">${s.seq}</b> ${esc(s.label)} <a class="small" href="#/map/stop/${s.id}">on the map</a></td><td><a href="#/place/${s.place}">${esc(IDX.place[s.place].label.split(' (')[0])}</a></td><td class="small">${esc(s.date_text)}</td><td><span class="chip plain ${esc(s.date_precision)}">${esc(s.date_precision)}</span></td><td>${chip(s.status)}${s.naming?' '+chip('naming'):''}</td><td class="small">${esc(s.why)}</td></tr>`).join('')}</tbody></table>
      <h2>Connectors</h2><p class="small">An <i>out-and-back</i> is a side trip whose return passes through a named place before the next stop; the connector is drawn through that place (via) instead of asserting a through-route the sources deny. Where two or more connectors share the same pair of places (Seattle–Nome in both years, for instance) they are drawn side by side, 4 px apart, in the order 1907 outward, 1907 return, 1908 outward, 1908 return.</p>
      <table class="data"><thead><tr><th>Segment</th><th>Via (out-and-back)</th><th>Mode</th><th>Mode status</th><th>Geometry</th><th>Source</th></tr></thead><tbody>${D.segments.map(g=>`<tr><td><span class="tag ${App.journeyClass(g.journey)}">${g.journey}</span> ${esc(IDX.stop[g.frm].label)} → ${esc(IDX.stop[g.to].label)}</td><td class="small">${(g.via||[]).length? g.via.map(v=>`via ${esc((IDX.place[v.place]||{}).short_label||v.place)} (${v.status==='stated'?`stated: <span class="serif">“${esc(v.quote)}”</span> · ${App.refLinkShort(v.ref)}`:'inferred'})`).join('<br>') : '—'}</td><td>${esc(g.mode)}</td><td class="small">${esc(g.mode_status.replace('_',' '))}</td><td class="small">${esc(g.geometry)}</td><td class="small">${esc(g.source.ref)}: ${esc(g.source.locator||'')}${g.note?`<div class="muted">${esc(g.note)}</div>`:''}</td></tr>`).join('')}</tbody></table>`;
  } else if(sub==='network'){
    const views=D.network.views||[];
    body=`<h2>Views</h2><p class="small">Five views over one data set. The rule and caveat printed here are the same strings the view header and the side panel show (<code>network.views</code> in the data), so the three cannot diverge. Views marked <span class="tag model">derived</span> are computed from the asserted edges or from name matching and assert no tie.</p>
     <table class="data"><thead><tr><th>View</th><th>What a node is</th><th>What an edge is</th><th>Evidence rule</th><th>Caveat</th><th>Status</th></tr></thead><tbody>${views.map(v=>`<tr><td><a href="#/network/view/${v.id}">${esc(v.label)}</a></td><td class="small">${esc(v.node)}</td><td class="small">${esc(v.edge)}</td><td class="small">${esc(v.rule)}</td><td class="small">${(v.caveats||[]).map(esc).join('<br>')}</td><td><span class="tag ${v.derived?'model':''}">${v.derived?'derived':'asserted'}</span></td></tr>`).join('')}</tbody></table>
     <h2>Rules</h2><dl class="kv">${Object.entries(D.network.rules).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
     <h2>Prosopographical method</h2><ul><li>Persons are identified by the documents, not by the model: a record exists for each name attested, with every spelling and the source of each role or office.</li><li>Unnamed actors (the “old Indian”, the Eskimos, the prospectors, the signers of office copies) have records of kind <i>unnamed</i> or <i>collective</i> so that their absence is visible in the network.</li><li>Institutions are nodes; each person–institution tie carries one quotation naming the person in that institution and is marked <i>stated</i>, or is marked <i>inferred</i> where the model read it from context and is drawn dashed and faint.</li><li>Stated and affiliation ties are dated by the document that carries their quotation; PI ties are undated. The date is the document's, not the relationship's.</li><li>Ties resting on a printed letterhead officer list are tagged <span class="tag">letterhead</span>: a letterhead is printed, not written by the signer.</li><li>Characterisations (the PI's or a writer's evaluative phrases) are kept apart from roles and offices and are shown in the writer's voice.</li><li>Metrics (degree by edge kind) describe the transcription file, not the historical world: a person who wrote many letters that were not kept has a low degree.</li></ul>
     <h2>All ties with evidence</h2><table class="data"><thead><tr><th>Source</th><th></th><th>Target</th><th>Kind</th><th>Date of document</th><th>Relation</th><th>Evidence</th></tr></thead><tbody>${D.network.edges.filter(e=>e.kind!=='correspondence').map(e=>`<tr><td><a href="#/person/${e.source}">${esc(App.personLabel(e.source))}</a></td><td>${e.directed?'→':'↔'}</td><td><a href="#/person/${e.target}">${esc(App.personLabel(e.target))}</a></td><td><span class="tag ${e.kind==='pi'?'model':''}">${e.kind}${e.affiliation_status?' · '+e.affiliation_status:''}</span>${e.evidence_kind?` <span class="tag">${esc(e.evidence_kind)}</span>`:''}</td><td class="small">${esc(e.date?fmtDate(e.date):'undated')}</td><td class="small">${esc(e.label)}${e.note?`<div class="muted">${esc(e.note)}</div>`:''}</td><td class="small">${e.evidence.map(v=>IDX.doc[v.ref]?docLink(v.ref, IDX.doc[v.ref].date_text):esc(v.ref)).join('; ')}${e.evidence.length?`<div class="serif">${e.evidence.map(v=>'“'+esc(v.quote)+'”').join(' / ')}</div>`:'<span class="muted">none — inferred by the model</span>'}</td></tr>`).join('')}</tbody></table>
     <h2>Funding edges <span class="muted small">(amounts as written; no total is computed)</span></h2><p class="small">${esc(D.network.funding.rule)}</p><ul class="small">${D.network.funding.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${App.fundingTable(D.network.funding.edges)}`;
  } else if(sub==='findings'){
    const kinds=[['discrepancy','Discrepancies — where the provided sources disagree'],['absence','Absences — what the file does not contain'],['naming','Naming — variants and modern equivalents'],['unlocated','Unlocated — what cannot be placed'],['authorship','Authorship — whose words']];
    body=kinds.map(([k,lab])=>`<h2>${esc(lab)}</h2>${D.findings.filter(f=>f.kind===k).map(f=>`<div id="${f.id}">${findingCard(f.id)}${(f.stories||[]).length?`<div class="small muted" style="margin:-.3rem 0 .6rem .9rem">Story pages: ${f.stories.map(s=>storyLink(s)).join('; ')}</div>`:''}</div>`).join('')}`).join('');
  } else {
    const files=['documents','people','offices','institutions','places','stops','segments','context_arcs','stories','timeline','itinerary','tale','tale_footnotes','cast','network','published','findings','meta'];
    const csvs=['documents','document_blocks','places','stops','segments','people','institutions','network_edges','network_nodes','funding','network_pairs','network_mentions','timeline','itinerary','stories','published','findings'];
    body=`<h2>Exports</h2><p>The data lives outside the interface. Each table is exported as JSON and CSV; <code>data/bundle.js</code> carries the same content for this page; <code>data/DATA_DICTIONARY.md</code> defines every field. Built ${esc(D.meta.built)} from these inputs:</p>
     <table class="data"><thead><tr><th>Input file</th><th>SHA-256</th><th>bytes</th></tr></thead><tbody>${D.meta.inputs.map(i=>`<tr><td>${esc(i.file)}</td><td class="small" style="font-family:monospace">${esc(i.sha256)}</td><td class="small">${i.bytes}</td></tr>`).join('')}</tbody></table>
     <h3>JSON</h3><div class="dl">${files.map(f=>`<a href="data/${f}.json" download>${f}.json</a>`).join('')}</div>
     <h3>CSV</h3><div class="dl">${csvs.map(f=>`<a href="data/csv/${f}.csv" download>${f}.csv</a>`).join('')}</div>
     <h3>Data dictionary and pipeline</h3><p><a href="data/DATA_DICTIONARY.md" download>DATA_DICTIONARY.md</a> · <code>scripts/extract_docx.py</code> (Word → paragraphs with formatting) · <code>scripts/build_data.py</code> (typing, normalisation, cross-reference and quotation checks) · <code>scripts/authored/*.py</code> (hand-authored normalisation: document metadata, prosopography, gazetteer, stops, stories, ties, published sources, findings).</p>
     <h2>Counts</h2><dl class="kv">${Object.entries(D.meta.counts).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}${k==='verified_quotations'?' <span class="muted small">quoted fragments in the model’s notes and fields, verified against the sources at build; the build fails on any miss</span>':''}</dd>`).join('')}</dl>
     <h2>Verified quotation classes</h2><dl class="kv">${Object.entries(D.meta.quotation_classes||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
     <h2>Vocabularies</h2><h4>Block types</h4><dl class="kv">${Object.entries(D.meta.block_types).map(([k,v])=>`<dt><span class="tag ${k}">${k}</span></dt><dd>${esc(v)}</dd>`).join('')}</dl><h4>Status chips</h4><dl class="kv">${Object.entries(D.meta.status_chips).map(([k,v])=>`<dt>${chip(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  }
  page.innerHTML=`<div class="page wide">${navbar({close:false})}<h1>Method &amp; Data</h1>
    <div class="pagenav"><div class="seg">${tabs.map(([k,l])=>`<button class="${k===sub?'active':''}" onclick="App.go('/method/${k}')">${esc(l)}</button>`).join('')}</div></div>${body}</div>`;
  if(anchor){ setTimeout(()=>{ const el=document.getElementById(anchor); if(el){ el.scrollIntoView({block:'center'}); el.style.outline='2px solid var(--inferred)'; } },40); }
};
})();
</script>
</body>
